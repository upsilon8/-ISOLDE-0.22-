      return;
    }
  }
  if(a.fort){ dmg=Math.max(1,dmg-a.fort); } // 星辉甲胄：本场所受伤害-4
  a.hp=Math.max(0,a.hp-dmg);
  print(a.name+'受到 −'+dmg+'（剩余'+a.hp+'）','bad');
  if(a.hp<=0){
    if(a===state.p.regulus&&a.unyield>0){
      a.hp=1; a.unyield--;
      print('不屈！'+a.name+'锁住了最后一口气（还剩'+a.unyield+'回合）','hint');
      return;
    }
    if(ctx&&ctx.control===a)ctx.control=null; // 被操控的角色倒下，操控交还主角
    if(state.p.control===a.name)state.p.control=null;

    else if(state.p.regulus===a)state.p.regulus=null;
    else if(state.p.ampthis===a){ state.p.ampthis=null; const af=state.p.flags; af.ampthisReviveAt=Date.now()+480*1000; af.ampthisPending=true; af.ampthisDefeats=3; print('妖雾散去——她没有死，只是暂时退场（黑棘城荒野还能再遇到她）','bad'); }
    else state.p.mercs=state.p.mercs.filter(m=>m!==a);
    if(state.p.leader===a.name)state.p.leader='主角';
    print(a.name+'重伤倒下，被抬出了战场','bad');
  }
}

function applyEnemyHit(raw,def,extra){
  if(state.p.flags.god){ print('（无敌）这一下没有打中你','def'); return true; }
  if(ctx.en.fear)raw=Math.max(1,raw-ctx.en.fear); // 狮吼：目标被震慑，攻击-3
  if(ctx.en.atkDown)raw=Math.max(1,raw-ctx.en.atkDown); // 虚弱/恐惧/失志诅咒
  if(ctx.en.atkBoost)raw+=ctx.en.atkBoost;
  const aim=ctx.en.aim;
  if(aim && aim!=='你'){
    const a=findAlly(aim);
    if(!a||a.fled) return false;
    let dmg=raw;
    if(a.dodge){ if(Math.random()<0.6){ print(a.name+'闪开了这一击！','def'); return false; } print(a.name+'闪避失败——','bad'); }
    if(a.guard){ dmg=Math.ceil(raw*0.5); print(a.name+'防御姿态！伤害减半','def'); }
    if(a.def){ const before=dmg; dmg=Math.max(1,dmg-a.def); if(dmg<before)print(a.name+'的基础防御抵消了'+(before-dmg)+'点伤害','def'); }
    if((a.traits||[]).includes('老练')){ dmg=Math.max(1,dmg-1); }
    if(state.p.knight&&state.p.knight.role==='support'&&state.p.knight.name==='巡防骑士'&&!state.p.knight.fled){ dmg=Math.max(1,dmg-1); print('列阵：'+a.name+'所受伤害-1','def'); }
    if(state.p.leader==='安普卢斯'&&a.name!=='安普卢斯'){ dmg=Math.max(1,dmg-1); print('同行之誓：'+a.name+'所受伤害-1','def'); }
    allyHurt(a,dmg);
    return true;
  }
  let dmg=raw;
  const red=accFx('def')+accFx('dmgRed')+(state.p.fort||0)+(state.p.buffSys&&state.p.buffSys.防.v?state.p.buffSys.防.v:0);
  if(red)dmg=Math.max(1,dmg-red); // 饰品/法术/药剂的减伤
  const stFx2=stanceApplies()?STANCE_FX[state.p.stance]:null;
  if(stFx2&&stFx2.taken)dmg=Math.round(dmg*stFx2.taken); // 架势修正
  if(def==='格挡'){ dmg=Math.ceil(dmg*0.5); print('你格挡！伤害减半','def'); }
  else if(def==='闪避'){
    const fxs=state.p.weapon&&state.p.weapon.fx;
    const rate=0.6+(fxs&&fxs.includes('灵活')?0.05:0)+(fxs&&fxs.includes('迅影')?0.1:0)+(state.p.buffSys&&state.p.buffSys.速.v?state.p.buffSys.速.v*0.05:0)+accFx('dodge')*0.05;
    if(Math.random()<rate){ print('你侧身闪过！','def'); return false; }
    print('闪避失败——','bad');
  }
  if(state.p.counter){ // 架枪/铁壁/还刺/盾墙：被击中时反击
    const back=Math.max(1,Math.round(playerAtk()*state.p.counter));
    ctx.en.hp-=back;
    ctx.damagedEnemy=true;
    print('反击！'+ctx.en.name+' −'+back,'hit');
    state.p.counter=0;
  }
  state.p.hp-=dmg;
  if(state.p.hp<0)state.p.hp=0;
  print(ctx.en.name+' 命中你 −'+dmg+(extra?'（'+extra+'）':''),'bad');
  return true;
}
function tickBleed(){
  if(state.p.flags.god){ state.p.buff.流血=0; return; }
  if(state.p.buff.流血>0){
    const d=2*state.p.buff.流血;
    state.p.hp=Math.max(0,state.p.hp-d);
    print('伤口流血 −'+d,'bad');
    state.p.buff.流血--;
  }
}

function kingTurn(def){
  const en=ctx.en;

  if(en.hp<en.maxHp*0.4 && !en.狂暴){
    en.狂暴=true; en.def=2;
    print('猪王眼睛更红了——狂暴！攻击+30%，防御-20%','hint');
  }
  const cyc=ctx.cycle%3;
  if(cyc===0){
    const raw=en.狂暴?12:9;
    print('猪王后蹄刨地——冲锋！');
    const hit=applyEnemyHit(raw,def);
    if(hit){ state.p.buff.流血+=2; print('獠牙撕开伤口（流血+2层）','bad'); }
    ctx.exposed=true;
    print('冲锋过后，猪王露出空档——下回合腹部暴露！','hint');
  } else if(cyc===1){
    const raw=en.狂暴?10:8;
    print('猪王扭头横扫！');
    const hit=applyEnemyHit(raw,def);
    if(hit){ state.p.buff.流血+=1; print('伤口被撕开（流血+1层）','bad'); }
  } else {
    print('猪王压低身子，猛地一顶');
    applyEnemyHit(7,def);
  }
}

      print('缴获武器：'+L.weapon.name+'（伤害+'+L.weapon.atk+(L.weapon.fx&&L.weapon.fx.length?'，'+L.weapon.fx.join('/'):'')+'）——放进了包袱，营地「换武器」可装备','ok');

  if(L.acc||L.accessory){

function accHas(name){ return state.p.accs.some(a=>a.name===name); }
function accFx(key){ let v=0; state.p.accs.forEach(a=>{ const d=ACC_DEFS[a.name]; if(d&&d.fx&&d.fx[key]!==undefined)v+=d.fx[key]; }); return v; }
function accEquip(a){
  if(state.p.accs.length>=6)return false;
  const d=ACC_DEFS[a.name];
  state.p.accBag=state.p.accBag.filter(x=>x!==a);
  state.p.accs.push(a);
  const ab=state.p.accBonus;
  if(d&&d.fx){
    if(d.fx.hp){ ab.hp+=d.fx.hp; state.p.maxHp+=d.fx.hp; state.p.hp=Math.min(state.p.maxHp,state.p.hp+d.fx.hp); }
    if(d.fx.mp){ ab.mp+=d.fx.mp; state.p.maxMp+=d.fx.mp; state.p.mp=Math.min(state.p.maxMp,state.p.mp+d.fx.mp); }
    if(d.fx.sta){ ab.sta+=d.fx.sta; state.p.maxSta+=d.fx.sta; state.p.sta=Math.min(state.p.maxSta,state.p.sta+d.fx.sta); }
  }
  return true;
}
function accUnequip(a){
  const d=ACC_DEFS[a.name];
  state.p.accs=state.p.accs.filter(x=>x!==a);
  state.p.accBag.push(a);
  const ab=state.p.accBonus;
  if(d&&d.fx){
    if(d.fx.hp){ ab.hp-=d.fx.hp; state.p.maxHp-=d.fx.hp; state.p.hp=Math.min(state.p.maxHp,state.p.hp); }
    if(d.fx.mp){ ab.mp-=d.fx.mp; state.p.maxMp-=d.fx.mp; state.p.mp=Math.min(state.p.maxMp,state.p.mp); }
    if(d.fx.sta){ ab.sta-=d.fx.sta; state.p.maxSta-=d.fx.sta; state.p.sta=Math.min(state.p.maxSta,state.p.sta); }
  }
}

/* ---------- 回收系统（0.25）：多余装备拆成材料 ---------- */
function salvageWeaponY(w){
  const y={铁料:Math.max(1,Math.round((w.atk||2)/4)),旧银币:0,精炼熔断钢铁:0};
  if((w.atk||0)>=30)y.精炼熔断钢铁=1;
  if(w.fx&&w.fx.length)y.旧银币=1;
  return y;
}
function salvageArmorY(a){ const d=a.def||0; return d>0?{铁料:d}:{碎布条:2}; }
function salvageAccY(a){
  const t=(ACC_DEFS[a.name]||{tier:'普通'}).tier;
  if(t==='大师锻造')return{铁料:5,精炼熔断钢铁:1};
  if(t==='史诗')return{铁料:4,旧银币:2};
  if(t==='狩猎品')return{铁料:4,旧银币:1};
  if(t==='精品')return{铁料:3,旧银币:1};
  if(t==='优良')return{铁料:2,旧银币:1};
  return{铁料:1};
}
function salvageMenu(){
  const o=[];
  const w=state.p.weapon;
  const worn=new Set([state.p.gear.头,state.p.gear.胸,state.p.gear.腿,state.p.gear.披风].filter(Boolean).map(g=>g.name));
  const accSet=new Set(state.p.accs.map(a=>a.name));
  let any=false;
  print('回收 —— 拆掉多余装备，换回材料（已穿戴的不会出现在这里）','h');
  state.p.owned.forEach(x=>{
    if(x===w||x.name==='木剑')return;
    any=true;
    const y=salvageWeaponY(x);
    const ys=Object.keys(y).filter(k=>y[k]>0).map(k=>k+'×'+y[k]).join('、');
    o.push(['回收武器：'+x.name+'（伤害+'+x.atk+'）→ '+ys,()=>{ state.p.owned=state.p.owned.filter(z=>z!==x); for(const k in y)addItem(k,y[k]); print('拆了'+x.name+'，得到 '+ys,'ok'); salvageMenu(); }]);
  });
  state.p.armorBag.forEach(x=>{
    if(worn.has(x.name))return;
    any=true;
    const y=salvageArmorY(x);
    const ys=Object.keys(y).filter(k=>y[k]>0).map(k=>k+'×'+y[k]).join('、');
    o.push(['回收护甲：'+x.name+'（+'+x.def+'防）→ '+ys,()=>{ state.p.armorBag=state.p.armorBag.filter(z=>z!==x); for(const k in y)addItem(k,y[k]); print('拆了'+x.name+'，得到 '+ys,'ok'); salvageMenu(); }]);
  });
  state.p.accBag.forEach(x=>{
    if(accSet.has(x.name))return;
    any=true;
    const y=salvageAccY(x);
    const ys=Object.keys(y).filter(k=>y[k]>0).map(k=>k+'×'+y[k]).join('、');
    o.push(['回收饰品：'+x.name+' → '+ys,()=>{ state.p.accBag=state.p.accBag.filter(z=>z!==x); for(const k in y)addItem(k,y[k]); print('拆了'+x.name+'，得到 '+ys,'ok'); salvageMenu(); }]);
  });
  if(!any)print('没有多余装备——都穿在身上或用得上','dim');
  o.push(['返回',gotoCamp]);
  choices(o); statusLine();
}

function setBattleBuff(k,v,n){
  const b=state.p.buffSys[k];
  if(v>b.v){ b.v=v; b.n=n; }
  else if(v===b.v&&n>b.n){ b.n=n; }
}
function applyFoodFx(r){
  const fx=r.fx;
  if(fx.hp){ state.p.hp=Math.min(state.p.maxHp,state.p.hp+fx.hp); print('生命 +'+fx.hp,'ok'); }
  if(fx.mp){ state.p.mp=Math.min(state.p.maxMp,state.p.mp+fx.mp); print('法力 +'+fx.mp,'ok'); }
  if(fx.sta){ state.p.sta=Math.min(state.p.maxSta,state.p.sta+fx.sta); print('体力 +'+fx.sta,'ok'); }
  if(fx.buff攻)setBattleBuff('攻',fx.buff攻.v,fx.buff攻.n);
  if(fx.buff防)setBattleBuff('防',fx.buff防.v,fx.buff防.n);
  if(fx.buff速)setBattleBuff('速',fx.buff速.v,fx.buff速.n);
}

 {name:'生命药水',need:{骨头:2,血盐:1},make:'生命药水',desc:'+40生命'},
 {name:'猛力药',need:{血水结晶:1,巨魔牙:1,草药:1},make:'猛力药',desc:'3场内攻击+3'},
 {name:'硬皮药',need:{蛇皮:2,蛙油膏:1},make:'硬皮药',desc:'3场内所受伤害-2'},
 {name:'迅捷药',need:{蛛丝:2,草药:1},make:'迅捷药',desc:'3场内闪避+5%'},
 {name:'净化药',need:{除虱粉:1,草药:1},make:'净化药',desc:'清除流血与硬直，+10生命'},
 {name:'龙息火瓶',need:{龙鳞:1,蛙油膏:1},make:'龙息火瓶',desc:'投掷15火伤，惧火者×2'},
 {name:'血盐涂毒',need:{血盐:2,蛙油膏:1},make:'血盐涂毒',desc:'武器淬毒：5次命中附加流血'},
 {name:'罂粟安眠药',need:{罂粟:2,苦蜜蜡:1},make:'罂粟安眠药',desc:'镇住活着的魔枪（布里欧纳克每战消耗1份）'}
];
function usePotion(name){
  const am=1+0.05*Math.max(0,craftLevel('炼金')-1); // 炼金熟练度：Lv2起每级药剂效果+5%
  if(name==='生命药水'){ const v=Math.round(40*am); state.p.hp=Math.min(state.p.maxHp,state.p.hp+v); print('药水下肚 +'+v+'生命','ok'); }
  else if(name==='猛力药'){ setBattleBuff('攻',3,3); print('猛力入血——3场内攻击+3','ok'); }
  else if(name==='硬皮药'){ setBattleBuff('防',2,3); print('皮肤硬了一层——3场内所受伤害-2','ok'); }
  else if(name==='迅捷药'){ setBattleBuff('速',1,3); print('腿脚轻快——3场内闪避+5%','ok'); }
  else if(name==='净化药'){ state.p.buff.流血=0; state.p.buff.硬直=0; const v=Math.round(10*am); state.p.hp=Math.min(state.p.maxHp,state.p.hp+v); print('药剂洗过全身——流血与硬直清除，+'+v+'生命','ok'); }
}
function alchemyMenu(){
  const o=[];
  print('炼金 —— 把死掉的东西变成还能用的东西','h');
  ALCHEMY_DEFS.forEach(r=>{
    const miss=Object.keys(r.need).filter(k=>(state.p.inv[k]||0)<r.need[k]);
    if(!miss.length)o.push(['炼制：'+r.name+'（'+r.desc+'）',()=>{ for(const k in r.need)state.p.inv[k]-=r.need[k]; addItem(r.make,1); gainCraftXP('炼金',3); print('釜中翻腾——'+r.name+'炼成了','ok'); alchemyMenu(); }]);
    else o.push(['炼制：'+r.name+'（缺 '+miss.map(k=>k+'×'+r.need[k]).join('、')+'）',()=>{ print('素材不够','bad'); alchemyMenu(); }]);
  });
  ['生命药水','猛力药','硬皮药','迅捷药','净化药'].forEach(k=>{
    if((state.p.inv[k]||0)>0)o.push(['使用：'+k+' ×'+state.p.inv[k],()=>{ state.p.inv[k]--; usePotion(k); alchemyMenu(); }]);
  });
  o.push(['返回',gotoCamp]);
  choices(o); statusLine();
}

function legKnightFight(n,back){
  const d=LEG_KNIGHTS[n];
  if(!d){ print('/骑士 1-7','dim'); return; }
  startCombat(d,{canFlee:true,
   onWin:()=>{ state.p.flags['legF'+n]=true; print('传奇骑士·'+d.name+'——它不会再出现了','hint'); (back||backToTown)(); },
   onFlee:()=>{ print('你脱离了战斗——它还站在原处','dim'); (back||backToTown)(); }
  });
}
function winCombat(){
  const en=ctx.en, op=ctx.opts;
  if(en.legendLives&&en.legendLives>0){
    en.legendLives--;
    if(en.name==='妖僧·拉斯普提'){ en.lasFury=(en.lasFury||0)+1; print('越打越疯——他全属性+15%！','bad'); }
    en.hp=en.maxHp;
    en.bleed=0;
    print(en.name+'倒下了——但苍白的甲胄里有什么不肯死','hint');
    print(en.name+'重新站了起来！（剩余复活 '+en.legendLives+' 次）','bad');
    renderCombat();
    return;
  }
  // 敌阵结算：所有被击倒的敌人逐个结算掉落与经验
  const fallen=[...(ctx.defeated||[])].filter(Boolean);
  if(!fallen.includes(en))fallen.push(en);
  const fed=!!ctx.damagedEnemy; // 提尔锋必杀之约：使用者必须伤敌
  ctx=null; state.p.buff.流血=0;
  allies().forEach(a=>{ a.fled=false; a.act=null; a.guard=false; a.dodge=false; });
  if(state.p.buff.保养>0)state.p.buff.保养--;
  if(state.p.buff.磨石>0)state.p.buff.磨石--;
  // 料理/药剂的场次增益随战斗递减
  for(const k in state.p.buffSys){ const b=state.p.buffSys[k]; if(b.n>0){ b.n--; if(b.n<=0)b.v=0; } }
  print(fallen.length>1?('敌阵溃散——'+fallen.map(e=>e.name).join('、')+' 全灭','ok'):(fallen[0].name+' 倒下了','ok'));
  let totalXp=0;
  // 战历与图鉴：每次讨伐都记进敌谱
  state.p.kills=(state.p.kills||0)+fallen.length;
  fallen.forEach(e=>{
    if(e.xp){ totalXp+=e.xp; }
    if(KNIGHT_NAMES[e.name]){ state.p.flags.knightKills=(state.p.flags.knightKills||0)+1; } // 拉斯普提：累计击败10名骑士解锁
    if(e.stolen>0){ state.p.gold+=e.stolen; print('你捡回了被抢走的 '+e.stolen+' 枚铜币','ok'); }
    eliteLootDrop(e.name,e.luckDown);
    const rec=state.p.bestiary[e.name]||(state.p.bestiary[e.name]={n:0,day:state.p.days||0,high:e.high});
    rec.n++;
  });
  // 军阀密令：只有高危之敌身上才藏着北边的密令（黑棘城高危委托/极危悬赏/解放战争/传奇骑士）
  const highFallen=fallen.filter(e=>e.high);
  if(highFallen.length){
    addItem('军阀密令',highFallen.length);
    const n=state.p.inv.军阀密令||0;
    print('你在敌人身上搜出军阀密令 ×'+highFallen.length+'（累计'+n+'份）','hint');
    print(LIB_ORDER_LINES[Math.max(0,n-1)%LIB_ORDER_LINES.length],'dim');
    if(libOrdersLeft()===0)print('南境七城尽数解放——密令的尽头指向北方，那个夺走你领地的人就在那里','hint');
  } else if(!state.p.flags.orderHint){
    state.p.flags.orderHint=true;
    print('普通敌人身上没有北边的密令——密令只在高危之敌身上（黑棘城高危委托、各城极危悬赏、解放战争的祸首、传奇骑士）','dim');
  }
  if(totalXp){ const xpB=Math.round(totalXp*(1+accFx('xpPct'))); gainXp(xpB); allyGainXp(xpB); }
  if((state.p.flags.knightKills||0)>=10&&!state.p.flags.lasputiUnlocked){
    state.p.flags.lasputiUnlocked=true; state.p.flags.lasputiLv=state.p.flags.lasputiLv||60;
    print('你击败了第十名骑士——风里传来断断续续的笑声，有什么开始在地图上乱晃了（去黑棘城酒馆打听）','hint');
  }
  if(op.gold){ const gB=Math.round(op.gold*(1+accFx('goldPct'))); state.p.gold+=gB; print('拾取 '+gB+' 铜币','ok'); }
  if(op.items){ for(const k in op.items){ addItem(k,op.items[k]); print('获得 '+k+' ×'+op.items[k],'ok'); } }
  if(op.note)print(op.note,'dim');
  if(state.p.flags.tyrfing&&!fed){ state.p.hp=Math.max(1,state.p.hp-Math.round(state.p.maxHp*0.2)); print('必杀之约——你没有伤人，提尔锋借你的手刺穿了自己！','bad'); }
  op.onWin();
}
/* 伙伴经验（0.26）：战斗胜利后，除佣兵外的伙伴获得同等经验并可升级 */
function allyGainXp(n){
  allies().forEach(a=>{
    if(a!==state.p.companion&&a!==state.p.knight&&a!==state.p.regulus)return;
    a.xp=(a.xp||0)+n;
    print(a.name+' 获得 '+n+' 经验','dim');
    while(a.xp>=allyXpNeed(a)){
      a.xp-=allyXpNeed(a);
      a.lv=(a.lv||1)+1;
      if(a===state.p.companion){ a.atk=(a.atk!==undefined?a.atk:a.d||6)+1; a.maxHp+=10; a.hp=Math.min(a.maxHp,a.hp+10); print(a.name+' 升到 Lv.'+a.lv+'！基础攻击+1 · 生命上限+10','ok'); }
      else if(a===state.p.knight){ a.atk=(a.atk!==undefined?a.atk:a.tn||10)+1; a.maxHp+=10; a.hp=Math.min(a.maxHp,a.hp+10); print(a.name+' 升到 Lv.'+a.lv+'！基础攻击+1 · 生命上限+10','ok'); }
      else { a.atk=statsForLevel(a.lv).atk+20; a.def=20; a.maxHp+=10; a.hp=Math.min(a.maxHp,a.hp+10); print(a.name+' 升到 Lv.'+a.lv+'！基础攻防随等级重算（比同等级的你高20）· 生命上限+10','ok'); }
    }
  });
}
function loseCombat(){
  allies().forEach(a=>{ a.fled=false; a.act=null; a.guard=false; a.dodge=false; });
  if(state.p.companion){
    const c=state.p.companion;
    if((c.a||0)>0){
      c.a--;
      state.p.hp=5; state.p.buff.流血=0;
      print(c.name+'替你挡了这一下护甲碎了，人还站着（挡刀层数剩'+(c.a||0)+'）','bad');
    } else {
      state.p.companion=null;
      state.p.hp=5; state.p.buff.流血=0;
      print(c.name+'替你挡了这一下他重伤被救走——之后还能在酒厂重逢','bad');
    }
    if(ctx){ renderCombat(); } else { clearActs(); choices([['起身',gotoCamp]]); }
    statusLine();
    return;
  }
  if(state.p.knight){
    const k=state.p.knight;
    if((k.a||0)>0){
      k.a--;
      state.p.hp=5; state.p.buff.流血=0;
      print(k.name+'替你挡了这一击甲碎了一层，人还在（挡刀层数剩'+(k.a||0)+'）','bad');
    } else {
      state.p.knight=null;
      state.p.hp=5; state.p.buff.流血=0;
      print('落魄骑士替你挡下这一击甲碎了他倒了下去','bad');
    }
    if(ctx){ renderCombat(); } else { clearActs(); choices([['起身',gotoCamp]]); }
    statusLine();
    return;
  }
  if(state.p.mercs&&state.p.mercs.length){
    const m=state.p.mercs.shift();
    state.p.hp=5; state.p.buff.流血=0;
    print(m.name+'替你挡了这一下他倒下了你连他的全名都不知道','bad');
    if(ctx){ renderCombat(); } else { clearActs(); choices([['起身',gotoCamp]]); }
    statusLine();
    return;
  }
  ctx=null; state.p.buff.流血=0;
  clearActs(); hr();
  print('你倒下了','bad'); print('……','dim');
  print('噩梦你在营地篝火旁醒来——上次休息之后的记忆，像隔着一层水','dim');
  state.p.hp=state.p.maxHp; state.p.sta=state.p.maxSta; state.p.mp=state.p.maxMp;
  state.p.buff.硬直=0;
  choices([['起身',gotoCamp],['回最近城镇',backToTown]]);
  statusLine();
}

function buyG(k,price,back){
  const cat=CATALOG[k]||{};
  const pr=(price!=null)?price:cat.price;
  const backFn=back||gotoGoods;
  if(state.p.gold<pr){ print('钱不够','bad'); backFn(); return; }
  const max=Math.floor(state.p.gold/pr);
  const doBuy=n=>{
    state.p.gold-=pr*n;
    for(let i=0;i<n;i++){ if(cat.give){ for(const kk in cat.give)addItem(kk,cat.give[kk]); } else addItem(k,1); }
    print('买下'+k+' ×'+n+(cat.give?'（每份3个绷带）':'')+'','ok');
    backFn();
  };
  const o=[['买 1 个（'+pr+'铜币）',()=>doBuy(1)]];
  if(max>=5)o.push(['买 5 个（'+pr*5+'铜币）',()=>doBuy(5)]);
  if(max>=10)o.push(['买 10 个（'+pr*10+'铜币）',()=>doBuy(10)]);
  o.push(['全买（'+max+'个 · '+pr*max+'铜币）',()=>doBuy(max)]);
  o.push(['返回',backFn]);
  scene('买多少','你掂了掂钱袋——最多能买 '+max+' 个'+k,o);
}
function sellG(k,v,back){
  const backFn=back||gotoGoods;
  if(!state.p.inv[k]){ print('你没有这个','dim'); backFn(); return; }
  const have=state.p.inv[k];
  const doSell=n=>{ state.p.inv[k]-=n; state.p.gold+=v*n; print('卖出'+k+' ×'+n+'，+'+v*n+'铜币','ok'); backFn(); };
  const o=[['卖 1 个（+'+v+'铜币）',()=>doSell(1)]];
  if(have>=5)o.push(['卖 5 个（+'+v*5+'铜币）',()=>doSell(5)]);
  if(have>=10)o.push(['卖 10 个（+'+v*10+'铜币）',()=>doSell(10)]);
  o.push(['全卖（'+have+'个 · +'+v*have+'铜币）',()=>doSell(have)]);
  o.push(['返回',backFn]);
  scene('卖多少','你有 '+have+' 个'+k+'，每件值 '+v+' 铜币',o);
}

function gotoAstrologer(){
  const f=state.p.flags;
  if(!f.leoStarJob||f.starDone){ print('占星师不在','dim'); gotoChurch(); return; }
  const n=(f.starFrag1?1:0)+(f.starFrag2?1:0)+(f.starFrag3?1:0);
  if(n<3){
    print('占星师拨着铜盘："狮子座坠过一颗星，残片落在三片郊野——各藏一片，去野外游荡，星屑会自己找上你"','dim');
    const miss=[];
    if(!f.starFrag1)miss.push('利恩菲尔郊野');
    if(!f.starFrag2)miss.push('沃林郊野');
    if(!f.starFrag3)miss.push('白石镇郊野');
    print('当前残片 '+n+'/3 · 还差的星屑在：'+miss.join('、'),'hint');
    gotoChurch();
    return;
  }
  scene('占星台','三块残片在铜盘里拼成狮子座的轮廓，只差最后一步——排列',[
  ['按「轩辕十四最亮」排列',()=>{
    startCombat({name:'星坠之狮',lv:42,xp:480,hp:2400,atk:24,def:8,physRes:0.4,intro:'星图亮起来的瞬间，狮座的星光坠了下来——星坠之狮'},{canFlee:false,
     onWin:()=>{
       f.starDone=true; f.regulus4=true; addItem('黄道星图',1);
       print('星坠之狮化成星屑，铜盘里浮起一张黄道星图——第四件失传之物','ok'); gotoChurch();
     }});
  }],
  ['按「五帝座一最亮」排列',()=>{
    print('星图抖了一下就散了——排错了再想想','dim'); gotoAstrologer();
  }],
  ['先回去',gotoChurch]]);
}

  state.p.regulus={name:'轩辕十四',lv:40,xp:0,type:'剑',hp:150,maxHp:150,role:'王者',passive:'狮心：一回合两次攻击判定·暴怒·追猎（基础攻防比同等级的你高20）',double:true,atk:statsForLevel(40).atk+20,atk0:statsForLevel(40).atk+20,def:20,def0:20,weapon:state.p.lionSword?{name:'狮心剑',atk:40}:null};
  if(state.p.lionSword)state.p.regulus.w=20;

  print('两头野兽都倒下了，金色的光落下来，一个身影站在兽尸之间','hint');
  print('轩辕十四：40级，基础攻防比40级的你高20点','ok');

  print('「我叫轩辕十四」他开口，声音像狮吼压过风——「你集齐了五件失传之物，又杀穿了双狮，往后，我随你走」','dim');

  backToTown();
}

function wornEvent(cb){
  const roll=Math.random();
  if(roll<0.4){
    const pick=Math.random();
    if(pick<0.34) startCombat({name:'战场游魂',lv:16,xp:120,hp:420,atk:16,def:4,intro:'一具半透明的战魂从土里升起'},{canFlee:true,items:{送葬骨灰:1},onWin:cb,onFlee:cb});
    else if(pick<0.67) startCombat({name:'疮兽',lv:15,xp:100,hp:380,atk:15,def:3,intro:'一头浑身溃烂的野兽冲出来'},{canFlee:true,items:{兽皮:1},onWin:cb,onFlee:cb});
    else startCombat({name:'雹狼',lv:17,xp:130,hp:400,atk:16,def:4,intro:'一头皮毛焦硬的狼，身上噼啪作响'},{canFlee:true,items:{兽皮:1},onWin:cb,onFlee:cb});
  } else if(roll<0.7){
    const pick=Math.random();
    if(pick<0.5) startCombat({name:'灰壳暴徒',lv:16,xp:110,hp:440,atk:17,def:6,intro:'一个看不清脸的灰壳人拦在路上'},{canFlee:true,items:{骨器:1},onWin:cb,onFlee:cb});
    else startCombat({name:'雹铁猎人',lv:17,xp:120,hp:430,atk:16,def:4,intro:'一个背铁镐的人从焦坑边站起'},{canFlee:true,items:{雹铁:1},onWin:cb,onFlee:cb});
  } else if(roll<0.88){
    print('阴风贴着地面吹过你加快了脚步','dim'); cb();
  } else {
    const pick=['骨器','草药','火绒'][Math.floor(Math.random()*3)];
    addItem(pick,1);
    print('你在路边的乱石里捡到 '+pick+'×1','ok'); cb();
  }

function hireMerc(i){
  const roster=mercRoster();
  const m=roster[i];
  if(!m){ print('那人已经走了','dim'); gotoMarket(); return; }
  if(state.p.mercs.length>=mercCap()){ print('你身后已经站满'+mercCap()+'个人了','dim'); gotoMarket(); return; }
  if(state.p.gold<m.price){ print(m.price+'铜币钱不够','bad'); gotoMarket(); return; }
  state.p.gold-=m.price;
  state.p.mercs.push({name:m.name,lv:m.lv,weapon:m.weapon,traits:m.traits,tn:m.tn,hp:25+(m.tn||0)*5,maxHp:25+(m.tn||0)*5});

function buyExoticWeapon(name,price,atk,mod,type){
  if(state.p.gold<price){ print('钱不够','bad'); gotoExotic(); return; }
  state.p.gold-=price;
  const isOr=ORIENTAL.some(o=>o[0]===name);
  state.p.owned.push({name,atk,mod,type,fx:isOr?['异纹']:[]});
  print('你买下'+name+'，放进了背包'+(isOr?'——异纹微亮，攻击+8%':'')+'（营地「换武器」可装备）','ok');
  gotoExotic();
}
function buyItem(k,v){
  if(state.p.gold<v){ print('钱不够','bad'); gotoExotic(); return; }
  state.p.gold-=v; addItem(k,1);
  print('买下'+k+' ×1','ok'); gotoExotic();
}

function wander(){
  const f=state.p.flags;
  const roll=Math.random();
  if(!f.dragonMet && Math.random()<0.03){
    startCombat({name:'老龙',lv:20,xp:50,hp:400,atk:18,def:8,physRes:0.5,intro:'它落下来的时候，风先到了'},{canFlee:false,items:{覆金属龙皮:2,精炼熔断钢铁:1},onWin:wanderNext});
    return;
  }
  if(f.dragonMet && Math.random()<0.012){
    startCombat({name:'赤河龙',lv:40,xp:400,hp:900,atk:30,def:12,physRes:0.6,intro:'河水红了，一条比老龙更大的龙从河里升起——赤河龙'},{canFlee:false,items:{覆金属龙皮:3,龙鳞:2,精炼熔断钢铁:1,管理者材料:1},onWin:wanderNext});
    return;
  }
  if(twoLionsCheck(()=>scene('野外','你绕开了，继续走',[['继续游荡',wander],['回城',gotoAshwold]]))) return;
  if(state.p.level>=LEG_KNIGHTS[1].lv-10&&!f.legF1&&Math.random()<0.025){ legKnightFight(1,wanderNext); return; }

    else if(pick==='巨蛛') startCombat({name:'巨蛛',lv:4,xp:16,hp:22,atk:5,def:0,intro:'一只磨盘大的蜘蛛垂在树上'},{canFlee:true,items:{蛛丝:1},onWin:wanderNext,onFlee:wanderBack});

function regionWanderNext(){
  const lt=state.p.lastTown;
  if(lt==='cromford')return wanderCromfordNext();
  if(lt==='tanwo')return wanderTanwoNext();
  if(lt==='lienfiel')return wanderLienfielNext();
  if(lt==='warrin')return wanderWarrinNext();
  if(lt==='whitestone')return wanderWhitestoneNext();
  if(lt==='windcap')return wanderWindcapNext();
  if(lt==='landel')return wanderLandelNext();
  if(lt==='carwo')return wanderCarwoNext();
  if(lt==='ferrytown')return wanderFerryTownNext();
  if(lt==='battlefield')return wanderBattlefieldNext();
  if(lt==='blackthorn')return wanderBlackThornNext();
  if(NEW_TOWN_DEFS[lt])return wanderNewNext(NEW_TOWN_DEFS[lt].wander,lt);
  wanderNext();
}
function rangerWin(){
  if(Math.random()<0.4)addItem('游侠短弓',1);
  regionWanderNext();
}
function knightWin(gear,chance){
  if(Math.random()<chance)addItem(gear,1);
  regionWanderNext();
}
function fallenKnight(){
  scene('野外','一个披着破甲的人坐在路边剑横在膝上\n"给八十铜币，我这条命跟你走或者，别管我"',[
  ['雇他（80铜币，每回合砍10，替你挡一次死）',()=>{
    if(state.p.gold<80){ print('钱不够','bad'); }
    else { state.p.gold-=80; state.p.knight={name:'落魄骑士',tn:10,type:'大剑',hp:45,maxHp:45,lv:10,xp:0,role:'队员',passive:'军心：作为队长时全队伤害+1，他自身再+1',atk:10,atk0:10,def:2,def0:2,weapon:null,fw:0,fa:0}; print('他站起来铁甲哗啦响','ok'); }
    wander2();
  }],
  ['别管他',wander2]]);
}
function wanderNext(){ print('你继续走','dim'); scene('野外','风从北边吹来',[['继续游荡',wander],['回城',gotoAshwold]]); }
function wanderBack(){ scene('野外','你绕开了继续走',[['继续游荡',wander],['回城',gotoAshwold]]); }
function wander2(){ scene('野外','采药人背起篓子走了',[['继续游荡',wander],['回城',gotoAshwold]]); }
function travellerMerchant(){
  const items=pickFrom(['草药','陈年果酒','巨魔粗制饰品','净水袋','火绒'],2);
  const o=items.map(k=>[k+'（'+Math.floor(CATALOG[k].price*0.9)+'铜币，'+CATALOG[k].desc+'）',()=>buyTrav(k)]);
  o.push(['继续赶路',gotoRoad]);
  scene('旅行商人','一辆破车，一个到处走的人货不多，价还行',o);
}
function buyTrav(k){
  const price=Math.floor(CATALOG[k].price*0.9);
  if(state.p.gold<price){ print('钱不够','bad'); travellerMerchant(); return; }
  state.p.gold-=price; addItem(k,1);
  print('你买下'+k+'','ok'); travellerMerchant();
}

/* ---------- 设置与读档 ---------- */
const FONT_SIZES={s:'13px',m:'15px',l:'17px'};
function getFont(){
  try{ const st=JSON.parse(localStorage.getItem('isolde_settings')||'{}'); return st.font||'m'; }catch(e){ return 'm'; }
}
function applyFont(){ document.documentElement.style.fontSize=FONT_SIZES[getFont()]||'15px'; }
function toggleFont(){
  const order=['s','m','l'];
  let st={};
  try{ st=JSON.parse(localStorage.getItem('isolde_settings')||'{}'); }catch(e){}
  const next=order[(order.indexOf(st.font||'m')+1)%3];
  st.font=next;
  try{ localStorage.setItem('isolde_settings',JSON.stringify(st)); }catch(e){}
  applyFont();
  sysMenu();
}
function toggleTw(){
  let st={};
  try{ st=JSON.parse(localStorage.getItem('isolde_settings')||'{}'); }catch(e){}
  twModeCur = twModeCur==='on'?'fast':twModeCur==='fast'?'off':'on';
  if(twModeCur==='off')flushTw();
  st.twMode=twModeCur;
  try{ localStorage.setItem('isolde_settings',JSON.stringify(st)); }catch(e){}
  print('打字机效果：'+(twModeCur==='on'?'正常':twModeCur==='fast'?'快速':'关闭')+'（点击文字可跳过）','ok');
  sysMenu();
}
function sysMenu(){
  const o=[];
  o.push(['队伍',()=>teamMenu(sysMenu)]);
  o.push(['地图',showMap]);
  o.push(['图鉴（讨伐记录）',showBestiary]);
  o.push(['手动存档',()=>{ saveGame(); print('已存档（第'+state.p.days+'天）','ok'); sysMenu(); }]);
  o.push(['读档（回到上次存档）',()=>{
    const s=loadGame();
    if(!s){ print('没有存档','dim'); sysMenu(); return; }
    state=s; ctx=null; twQueue.length=0; twBusy=false;
    print('读档完成（第'+state.p.days+'天）','ok');
    restoreScene(state.scene||'ashwold');
  }]);

function journeyToNew(target){ if(!state.p.journey||state.p.journey.target!==target)state.p.journey={target,step:0}; journeyScene(target); }
function arriveNewTown(key){
  if(key==='carwo'){ arriveCarwo(); return; }
  if(key==='lienfiel'){ arriveLienfiel(); return; }
  if(key==='warrin'){ arriveWarrin(); return; }
  if(key==='whitestone'){ arriveWhitestone(); return; }
  if(key==='ferrytown'){ arriveFerryTown(); return; }
  if(key==='landel'){ arriveLandel(); return; }
  if(key==='windcap'||key==='windcapBack2'||key==='windcapBack3'){ arriveWindcap(); return; }
  if(key==='fortress'||key==='fortressS'||key==='fortressN'){ state.p.flags.fortressFrom=(key==='fortressN'?'north':'south'); gotoFortress(); return; }
  if(key==='battlefield'||key==='battlefieldBack'){ print('你踏进了古战场——草长不出新芽的地方','dim'); gotoRoad11(); return; }
  if(key==='eastwaste'){ print('东荒原——草越来越稀，野兽的粪堆越来越多','dim'); gotoEastWaste(); return; }
  if(key==='blackthorn'){ print('黑棘城到了——灰墙里全是刀口讨生活的人','dim'); gotoBlackThorn(); return; }
  if(key==='blackplain'){ print('黑原荒野——黑土一直铺到天边','dim'); gotoBlackPlain(); return; }
  if(key==='northbattlefield'){ print('北古战场——比南边的更老，断旗都烂成了布条','dim'); gotoNorthBattlefield(); return; }
  if(key==='herik'){ print('赫里克的军营到了——军号声就在墙外','dim'); gotoHerikCamp(); return; }
  const d=NEW_TOWN_DEFS[key];
  print(d.cn+'到了','dim');
  gotoNewTown(key);
}
function gotoNewTown(key){
  if(key==='blackthorn'){ gotoBlackThorn(); return; }
  if(key==='carwo'){ gotoCarwo(); return; }
  if(key==='windcap'){ gotoWindcap(); return; }
  if(key==='landel'){ gotoLandel(); return; }
  if(key==='ferrytown'){ gotoFerryTown(); return; }
  if(key==='herik'){ gotoHerikCamp(); return; }
  const d=NEW_TOWN_DEFS[key];
  curScene=key; state.p.lastTown=key;
  const o=[
  ['客栈（休息+存档，过一天）',restInTown],
  ['杂货铺',gotoGoods],
  ['铁匠铺',gotoSmith],
  ['酒馆',()=>gotoNewTavern(key)],
  ['告示板',()=>gotoNewBoard(key)],
  ['队伍',()=>teamMenu(backToTown)],
  ['地图',showMap],
  ['⚙ 系统',sysMenu],
  ['出城',()=>gotoNewRoad(key)]
  ];
  if(key==='tideport')o.splice(2,0,['码头',gotoTideDock]);
  if(key==='northport')o.splice(2,0,['码头',gotoNorthDock]);
  scene(d.cn,d.desc,o);
}
function gotoNewTavern(key){
  const d=NEW_TOWN_DEFS[key];
  scene('酒馆',d.cn+'的酒馆，人声嘈杂',[
  ['喝酒（1铜币，+10体力）',()=>{
    if(state.p.gold<1){ print('一个铜币都没有','bad'); gotoNewTavern(key); return; }
    state.p.gold-=1; state.p.sta=Math.min(state.p.maxSta,state.p.sta+10);
    print('一碗酒下肚，体力+10','ok'); gotoNewTavern(key);
  }],
  ['打听消息（免费）',()=>{
    print(d.rumors[state.p.flags.rumorIdx%d.rumors.length],'dim'); state.p.flags.rumorIdx++;
    gotoNewTavern(key);
  }],
  ['离开',backToTown]
  ]);
}
function gotoNewBoard(key){
  if(key==='blackthorn'){ gotoBlackThornBoard(); return; }
  const d=NEW_TOWN_DEFS[key]; const f=state.p.flags; const o=[];
  addLibTownRow(o,key);
  if(key==='silvershield')addLibTownRow(o,'fortress');
  if(key==='tideport'){
    if(!f.tideMainJob&&!f.tideMainDone&&!f.tideMainReward) o.push(['主线：疏通港道（报酬120铜币）',acceptTideMain]);
    if(f.tideMainJob&&!f.tideMainDone) o.push(['港道（主线进行中）',gotoTideChannel]);
    if(f.tideMainDone&&!f.tideMainReward) o.push(['交差：疏通港道（+120铜币）',collectTideMain]);
    if(f.tideMainReward) o.push(['主线：疏通港道（已完成·码头可坐船）',()=>{},true]);
  }
  if(key==='whitewater'){
    if(f.regulusGot&&!f.regulusDuelReward){
      if(!f.regulusDuelJob&&!f.regulusDuelDone) o.push(['支线：与轩辕十四单挑（报酬150铜币）',acceptRegulusDuel]);
      if(f.regulusDuelJob&&!f.regulusDuelDone) o.push(['寻踪：与轩辕十四单挑（去城外游荡）',()=>{ print('他说过：白水河畔见——只带剑','dim'); }]);
      if(f.regulusDuelDone) o.push(['交差：与轩辕十四单挑（+150铜币）',collectRegulusDuel]);
    } else if(f.regulusGot&&f.regulusDuelReward) o.push(['支线：与轩辕十四单挑（已完成）',()=>{},true]);
  }
  d.deliver.forEach(dv=>o.push(['交：收集'+dv[0]+'×'+dv[1]+'（报酬'+dv[2]+'铜币）',()=>deliverJob(dv[0],dv[1],dv[2],()=>gotoNewBoard(key))]));
  o.push(['交：收集火绒×4（报酬8铜币）',()=>deliverJob('火绒',4,8,()=>gotoNewBoard(key))]);
  o.push(['交：收集骨头×3（报酬9铜币）',()=>deliverJob('骨头',3,9,()=>gotoNewBoard(key))]);
  addBountyRows(o,key);
  o.push(['离开',backToTown]);
  scene('告示板',d.cn+'的告示板，贴条新旧不一',o);
}
function gotoNewRoad(key){
  if(key==='blackthorn'){ gotoBlackThornRoad(); return; }
  const r=NEW_ROADS[key]; const d=NEW_TOWN_DEFS[key];
  curScene='newroad:'+key;
  const o=[];
  o.push(['在郊野游荡',()=>wanderNew(d.wander,key)]);
  r.journeys.forEach(j=>{ if(j[2])o.push([j[0],()=>{},true]); else o.push([j[0],()=>journeyToNew(j[1])]); });
  o.push(['扎营',gotoCamp]);
  o.push(['⚙ 系统',sysMenu]);
  o.push(['地图',showMap]);
  o.push(['回城',()=>gotoNewTown(key)]);
  scene(r.cn,r.desc,o);
}
function wanderNew(pool,key){

  const roll=Math.random();
  if(key==='herik'){
    if(roll<0.4){ scene('军营外','风卷着沙，路上只有军靴印',[['继续游荡',()=>wanderNew(pool,key)],['回城',()=>gotoNewTown(key)]]); return; }
    if(roll<0.7) startCombat({name:'叛军散兵',lv:30,xp:240,hp:1650,atk:26,def:9,intro:'一个掉队的叛军散兵从沟里钻出来'},{canFlee:true,gold:6,onWin:()=>wanderNewNext(pool,key),onFlee:()=>wanderNewBack(pool,key)});
    else if(roll<0.9) startCombat({name:'劫粮流寇',lv:28,xp:220,hp:1500,atk:24,def:8,intro:'两个劫粮流寇盯上了你的干粮'},{canFlee:true,items:{干粮:1},onWin:()=>wanderNewNext(pool,key),onFlee:()=>wanderNewBack(pool,key)});

    return;

  if(twoLionsCheck(()=>scene('郊野','你绕开了，继续走',[['继续游荡',()=>wanderNew(pool,key)],['回城',()=>gotoNewTown(key)]]))) return;

    else if(pick<0.8) startCombat({name:'野猪',lv:7,xp:30,hp:36,atk:9,def:1,intro:'一头野猪拱着土，突然抬头'},{canFlee:true,items:{野猪肉:1},onWin:()=>wanderNewNext(pool,key),onFlee:()=>wanderNewBack(pool,key)});

/* 潮音港主线：疏通港道 + 坐船 */
function acceptTideMain(){ state.p.flags.tideMainJob=true;
  print('港务官把一袋铜币拍在桌上："港道被海盗和海妖堵死了——清了它们，船就能出海"','dim');
  gotoNewRoad('tideport');
}
function gotoTideChannel(){
  const f=state.p.flags;
  if(!f.tideMainJob||f.tideMainDone){ print('港道风平浪静','dim'); gotoNewRoad('tideport'); return; }
  scene('港道','港道口横着三条海盗船，再往外，海妖的歌声贴着水面飘',[
  ['开打',()=>{
    chainFights([
      {en:{name:'海盗',lv:14,xp:70,hp:66,atk:15,def:3,intro:'第一条船的海盗跳帮过来'},gold:6,flee:false},
      {en:{name:'海盗',lv:14,xp:70,hp:66,atk:15,def:3,intro:'第二条船的接上了'},gold:6,flee:false},
      {en:{name:'潮音海妖',lv:18,xp:160,hp:220,atk:17,def:4,physRes:0.5,intro:'海妖从水底浮起来——歌声一下子尖了'},flee:false}
    ],()=>{ f.tideMainJob=false; f.tideMainDone=true; print('海盗船沉了，海妖也不再唱歌——港道通了','ok'); gotoNewTown('tideport'); });
  }],

function collectTideMain(){ const f=state.p.flags; state.p.gold+=120; f.tideMainDone=false; f.tideMainReward=true; f.jobCount++;
  print('港务官数出120铜币，笑得像重新活了过来——码头可以出海了','ok');
  gotoNewBoard('tideport');
}
function townCN(key){ if(key==='windcap')return '风角港'; if(key==='carwo')return '卡尔沃'; if(key==='landel')return '兰德尔'; if(key==='ferrytown')return '渡口镇'; if(NEW_TOWN_DEFS[key])return NEW_TOWN_DEFS[key].cn; return key; }
function shipVoyage(step,from,to){
  if(step>=5){
    state.p.days=(state.p.days||0)+1;
    state.p.hp=state.p.maxHp; state.p.sta=state.p.maxSta;
    print('第'+state.p.days+'天，'+townCN(to)+'到了','ok');
    gotoNewTown(to);
    return;
  }
  if(Math.random()<0.35){
    const pick=Math.random();
    if(pick<0.4) startCombat({name:'海狼',lv:15,xp:85,hp:70,atk:15,def:2,intro:'一头海狼跃上甲板，牙缝里全是鱼血'},{canFlee:false,items:{海鱼:2},onWin:()=>shipVoyage(step+1,from,to)});
    else if(pick<0.75) startCombat({name:'海盗',lv:14,xp:70,hp:66,atk:15,def:3,intro:'一条海盗船靠了上来，钩索钉进船舷'},{canFlee:false,gold:6,onWin:()=>shipVoyage(step+1,from,to)});
    else startCombat({name:'潮音海妖',lv:18,xp:160,hp:220,atk:17,def:4,physRes:0.5,intro:'海妖的歌声贴着船底响起来'},{canFlee:false,items:{海鱼:3},onWin:()=>shipVoyage(step+1,from,to)});
    return;
  }
  scene('海上','浪一波一波拍着船舷——第'+(step+1)+'/5 段航程',[
  ['继续航行',()=>shipVoyage(step+1,from,to)],
  ['甲板上歇一歇（+10体力）',()=>{ state.p.sta=Math.min(state.p.maxSta,state.p.sta+10); shipVoyage(step,from,to); }]
  ]);
}

function mercCap(){ return state.p.flags.fortressTaken?6:2; }
function trainMercMenu(){
  const o=[];
  print('练兵场 —— 训练佣兵（费用随能力涨，每回合伤害+1、生命+10，最多+6）','h');
  let any=false;
  state.p.mercs.forEach(m=>{
    any=true;
    const cap=m.tn+6;
    if((m.tn||0)>=cap)o.push([m.name+'（已练到极限·每回合砍'+m.tn+'）',()=>{ print('他已经练到头了','dim'); trainMercMenu(); }]);
    else {
      const cost=30+(m.tn||0)*15;
      o.push(['训练：'+m.name+'（每回合砍'+m.tn+'→'+(m.tn+1)+'·费用'+cost+'铜币）',()=>{
        if(state.p.gold<cost){ print('钱不够','bad'); trainMercMenu(); return; }
        state.p.gold-=cost;
        m.tn=(m.tn||0)+1;
        m.hp=Math.min(m.maxHp,m.hp+10); m.maxHp+=10;
        print(m.name+'在练兵场上挥汗如雨——每回合伤害+1，生命+10','ok');
        trainMercMenu();
      }]);
    }
  });
  if(!any)print('没有佣兵可训——先去佣兵市场雇人','dim');
  o.push(['返回',gotoFortress]);
  choices(o); statusLine();
}

function acceptBounty(n,key){
  const b=BOUNTIES[n]; const f=state.p.flags;
  f['bounty'+String.fromCharCode(65+n)+'Job']=true;
  print('你接下悬赏：'+b[0],'dim');
  startCombat({name:b[1],lv:b[2],xp:b[2]*4,hp:b[3],atk:b[4],def:b[5],intro:b[6]},{canFlee:true,...b[8],
   onWin:()=>{ f['bounty'+String.fromCharCode(65+n)+'Job']=false; f['bounty'+String.fromCharCode(65+n)+'Done']=true; print(b[0]+'被拿下了——回城交差','ok'); gotoNewTown(key); },
   onFlee:()=>{ f['bounty'+String.fromCharCode(65+n)+'Job']=false; print('你脱离了战斗，悬赏还在板上','dim'); gotoNewTown(key); }});
}
function collectBounty(n,key){
  const b=BOUNTIES[n]; const f=state.p.flags;
  state.p.gold+=b[7]; f['bounty'+String.fromCharCode(65+n)+'Done']=false; f.jobCount++;
  print('管事数出'+b[7]+'铜币——悬赏长期有效','ok');
  gotoNewBoard(key);
}
function addBountyRows(o,key){
  const f=state.p.flags;
  BOUNTIES.forEach((b,i)=>{
    const K='bounty'+String.fromCharCode(65+i);
    if(!f[K+'Job']&&!f[K+'Done']) o.push(['悬赏：'+b[0]+'（报酬'+b[7]+'铜币）',()=>acceptBounty(i,key)]);
    else if(f[K+'Done']) o.push(['交差：'+b[0]+'（+'+b[7]+'铜币）',()=>collectBounty(i,key)]);
  });
}

function gotoHighJob(i){
  const hj=HIGH_JOBS[i]; const f=state.p.flags;
  if(!f['highJob'+i]||f['highDone'+i]){ print('这里什么都没有','dim'); gotoNewRoad('blackthorn'); return; }

    startCombat(hj[6].squad[0],{squad:hj[6].squad,squadLeader:hj[6].leader,canFlee:true,
     onWin:()=>{ f['highJob'+i]=false; f['highDone'+i]=true; print(hj[0]+'被拿下了——回黑棘城交差','ok'); wanderBlackThornNext(); },
     onFlee:()=>{ print('你脱离了战斗——它们还活着','dim'); gotoNewRoad('blackthorn'); }});
    return;
  }
  startCombat(hj[1],{canFlee:true,
   onWin:()=>{ f['highJob'+i]=false; f['highDone'+i]=true; print(hj[0]+'被拿下了——回黑棘城交差','ok'); wanderBlackThornNext(); },
   onFlee:()=>{ print('你脱离了战斗——它还活着','dim'); gotoNewRoad('blackthorn'); }});
}
function collectHighJob(i){
  const hj=HIGH_JOBS[i]; const f=state.p.flags;
  state.p.gold+=hj[2];
  if(hj[3]){ f['highDone'+i]=false; f.ampthisJobs=(f.ampthisJobs||0)+1; }
  else { f['highDone'+i]=false; f['highReward'+i]=true; }
  f.jobCount++;
  if(blackthornJobsDone()>=10&&!f.ampthisUnlocked){ f.ampthisUnlocked=true; f.ampthisPending=true; print('你为黑棘城办成了十件委托——城头的雾色变了，荒野里有东西醒了过来','hint'); }
  print('黑棘城付了'+hj[2]+'铜币'+(hj[3]?'——这单还会再挂出来':'——这单从此撤下'),'ok');
  gotoNewBoard('blackthorn');
}

function ampthisBoss(){
  const lv=Math.max(18,state.p.level);
  return {name:'安普提斯',lv,xp:800,hp:1200+lv*50,atk:16+Math.round(lv/2),def:10,physRes:0.3,intro:'雾里走出一名女子，脸上挂着泪痕——她在笑，笑得让人心里发毛'};

function ampthisCheck(){
  const f=state.p.flags;
  if(!f.ampthisUnlocked||f.ampthisJoined)return false;
  if(Date.now()<(f.ampthisReviveAt||0))return false;
  if(!f.ampthisPending&&Math.random()>=0.1)return false;
  f.ampthisPending=false;
  startCombat(ampthisBoss(),{canFlee:true,onWin:ampthisWin,onFlee:()=>{ scene('黑棘城外','雾里的影子没有追来',[['继续游荡',wanderBlackThorn],['回城',gotoBlackThorn]]); }});
  return true;
}
function ampthisWin(){
  const f=state.p.flags;
  f.ampthisDefeats=(f.ampthisDefeats||0)+1;
  if(f.ampthisDefeats<3){

function regulusDuelTurn(def){
  const en=ctx.en;
  // 二阶段：25%血以下主动变身（被法术攻击羞辱过则不进入）
  if(!en.phase2&&!ctx.regulusNoP2&&en.hp>0&&en.hp<=en.maxHp*0.25){
    en.phase2=true; en.invuln=1; en.cycle2=0;
    en.hp=Math.min(en.maxHp,en.hp+Math.round(en.maxHp*0.3));
    print('他放下了剑——兽形解禁，一头金鬃狮子立在河滩上（回血30%，下回合不行动）','hint');
    return;
  }
  if(en.invuln>0){ en.invuln=0; print('兽形解禁的金光里，他缓缓踱步——这一回合没有攻击','dim'); return; }
  if(!en.unyieldUsed&&en.hp>0&&en.hp<=en.maxHp*0.5){ en.unyield=3; en.unyieldUsed=true; print('不屈——他拄剑不倒（3回合内不会死亡，攻击+30%）','hint'); }
  en.swordWill=Math.min(5,(en.swordWill||0)+1); // 剑意蓄势
  const base=en.atk;
  let mult=1+0.05*en.swordWill;
  if(en.unyield>0)mult*=1.3;
  if(en.phase2){
    en.cycle2=(en.cycle2||0)+1;
    if(en.hp<=en.maxHp*0.15)mult*=1.5; // 末路狂奔
    if(state.p.buff.流血>0||state.p.buff.硬直>0)mult*=1.25; // 猎食本能
    if(en.hp<=en.maxHp*0.05){
      en.finalBlow=true;
      print('终焉一击——他把一切都押在这一爪上！');
      const h=applyEnemyHit(Math.round(base*mult*3),def);
      if(h){ state.p.buff.流血+=3; print('撕裂爪击×3（流血+3层）','bad'); }
      return;
    }
    if(en.cycle2%5===0){
      print('狮吼——白水河都在抖！');
      state.p.buff.硬直=1;
      state.p.hp=Math.max(1,state.p.hp-Math.round(state.p.maxHp*0.15));
      print('真实伤害：最大生命15%（无视护甲），你被震得耳鸣','bad');
      return;
    }
    if(en.cycle2%4===0){
      print('狂怒连击——三爪齐出！');
      for(let i=0;i<3;i++){ if(state.p.hp<=0)break; const h=applyEnemyHit(Math.round(base*mult*0.8),def); if(h)state.p.buff.流血+=1; }
      print('狂怒连击×3（每爪+1流血）','hint');
      return;
    }
    print('撕裂爪击！');
    const h=applyEnemyHit(Math.round(base*mult),def);
    if(h){ state.p.buff.流血+=2; print('狮爪撕开皮肉（流血+2层）','bad'); }
    return;
  }
  en.chargeCd=(en.chargeCd||0)+1;
  if(en.chargeCd%3===0){
    print('冲锋斩——他直线冲到你面前！');
    const h=applyEnemyHit(Math.round(base*mult*1.4),def);
    if(h){ print('冲锋斩的余势未消（×1.4）','bad'); }
    return;
  }
  print('他挥剑——剑势沉得像山');
  applyEnemyHit(Math.round(base*mult),def);
}

function journeyStep(){
  const j=state.p.journey;
  j.step++;
  if(j.step>=(JOURNEY_DEFS[j.target].legs||3)){
    const d=JOURNEY_DEFS[j.target];
    state.p.journey=null;
    if(d.arrive==='cromford')arriveCromford();
    else if(d.arrive==='ashwold')arriveAshwoldBack();
    else if(d.arrive==='tanwo')arriveTanwo();
    else if(d.arrive==='lienfiel')arriveLienfiel();
    else if(d.arrive==='warrin')arriveWarrin();
    else if(d.arrive==='lienfielBack')arriveLienfielBack();
    else if(d.arrive==='whitestone')arriveWhitestone();
    else if(d.arrive==='whitestoneBack')arriveWhitestoneBack();
    else if(d.arrive==='windcap'||d.arrive==='windcapBack2'||d.arrive==='windcapBack3')arriveWindcap();
    else if(d.arrive==='warrinBack')arriveWarrinBack();
    else if(d.arrive==='ferrytown'||d.arrive==='ferrytownBack'||d.arrive==='ferrytownBack2')arriveFerryTown();
    else if(d.arrive==='battlefield'||d.arrive==='battlefieldBack')arriveBattlefield();
    else if(d.arrive==='landel'||d.arrive==='landelBack')arriveLandel();
    else if(d.arrive==='carwo')arriveCarwo();
    else if(d.arrive.indexOf&&d.arrive.indexOf('newtown:')===0)arriveNewTown(d.arrive.slice(8));
    else arriveCromfordBack();
    return;
  }
  journeyScene(j.target);
}

  curScene='journey';

  const j=state.p.journey;
  const o=[
  ['扎营（休息+存档，过一天）',()=>{
    state.p.days=(state.p.days||0)+1;
    state.p.hp=state.p.maxHp; state.p.sta=state.p.maxSta; state.p.mp=state.p.maxMp;
    state.p.buff.流血=0; state.p.buff.硬直=0;

  }],
  ['探索周围',()=>exploreStep(journeyStep)],

  ];
  scene(d.title,d.desc+'，第'+(j.step+1)+'/'+(d.legs||3)+' 段',o);
}

function chainFights(arr,done){
  if(!arr.length){ done(); return; }
  const e=arr[0];
  if(e.before)e.before();
  startCombat(e.squad?e.squad[0]:e.en,{canFlee:e.flee===undefined?true:e.flee,items:e.items,gold:e.gold,squad:e.squad,squadLeader:e.squadLeader,
   onWin:()=>{ if(e.after)e.after(); chainFights(arr.slice(1),done); },
   onFlee:()=>{ print('你从混战中脱身','dim'); done(); }});
}

function huntCheck(back){
  const f=state.p.flags;
  let act=HUNT_LIST.filter(h=> h.test?h.test(): (f[h.flag]&&!f[h.done]));
  if(typeof HIGH_JOBS!=='undefined')HIGH_JOBS.forEach((hj,i)=>{ if(f['highJob'+i]&&!f['highDone'+i])act.push({name:hj[0],desc:hj[4],fight:()=>gotoHighJob(i)}); });
  if(typeof LIB_TOWNS!=='undefined')LIB_TOWNS.forEach(t=>{ if(f['libT_'+t.key]&&!f['libT_'+t.key+'Done'])act.push({name:'解放·'+t.cn,desc:'当地祸首的踪迹就在这里——解放'+t.cn+'的一战',fight:()=>gotoLibTown(t.key)}); });
  // 城市祸首不入野外寻踪：军阀的走狗就在城里，直接在告示板讨取
  if(!act.length)return false;
  if(Math.random()>0.25)return false;
  const h=act[Math.floor(Math.random()*act.length)];
  scene('寻踪·'+h.name,h.desc, [['进去',()=>{ state.p.huntBack=back; h.fight(); }],['改天再来',back]]);
  return true;
}
/* 寻踪/委托完成后不再跳告示板：回到接任务前的游荡进度，告示板交差按钮保留 */
function boardReturn(){

}
function huntBoardReturn(){
  const b=state.p.huntBack; state.p.huntBack=null;
  if(b)b(); else boardReturn();
}

function deliverJob(k,need,pay,back){
  const have=state.p.inv[k]||0;
  if(have<need){ print('还差'+(need-have)+'个'+k+'（现有'+have+'）','bad'); back(); return; }
  state.p.inv[k]-=need; state.p.gold+=pay; state.p.flags.jobCount++;
  print('你交上'+k+'×'+need+'，拿到'+pay+'铜币','ok'); back();
}

  scene('上游磨坊','水渠被淤死了上游的磨坊把水堵住了——井里的微光因此断了',[
  ['疏通水道（耗10体力）',()=>{
    state.p.sta=Math.max(0,state.p.sta-10);
    state.p.flags.wellJob=false; state.p.flags.wellDone=true;
    print('你清开了淤塞水重新流了下去','ok');
    gotoBrewery();
  }],
  ['先回去',gotoRoad2]
  ]);
}
function collectWell(){
  state.p.gold+=10; addItem('陈年果酒',2);
  state.p.flags.wellDone=false; state.p.flags.wellReward=true;
  print('老板付了10铜币，塞给你两瓶陈年果酒井水又发光了','ok');
  gotoBrewery();
}
function gotoFrogOil(){
  const o=[];
  o.push(['买：蛙油膏（4铜币，战斗外+10生命）',()=>buyG('蛙油膏',4)]);
  o.push(['买：蛙皮披风（15铜币，披风·+1防）',()=>buyArmorPiece('披风','蛙皮披风',15,1,gotoFrogOil)]);
  o.push(['卖：蛙皮（4铜币）',()=>sellG('蛙皮',4)]);
  o.push(['离开',gotoCromford]);
  scene('蛙油铺','整条街都是蛙油味柜台上一排排蛙油膏',o);
}
function gotoTavern2(){
  scene('酒馆','麦酒味混着蛙油味有人低声说，北边那个军阀的手越伸越长了',[
  ['喝酒（1铜币，+10体力）',()=>{
    if(state.p.gold<1){ print('一个铜币都没有','bad'); gotoTavern2(); return; }
    state.p.gold-=1; state.p.sta=Math.min(state.p.maxSta,state.p.sta+10);
    print('麦酒下肚，体力+10','ok'); gotoTavern2();
  }],
  ['打听消息（免费）',()=>{
    const rs=[
    '"潮季过了，蛙还是没完磨坊主说这是老天的脾气"',
    '"酒厂的井水前些天不亮了老板急得嘴上起泡"',
    '"往北走的人，十个里回来三个"'
    ];
    print(rs[state.p.flags.rumorIdx%rs.length],'dim'); state.p.flags.rumorIdx++;
    gotoTavern2();
  }],
  ['离开',gotoCromford]
  ]);
}

function grainRoute(){
  const f=state.p.flags;
  scene('粮食护送','粮车在北边路口两条路：大路绕远，小路穿沼泽',[
  ['走大路',()=>{ f.grainJob=false; f.grainDone=true; f.grainPay=8; print('一路无事粮车到了地方','ok'); huntBoardReturn(); }],
  ['走小路',()=>{
    startCombat({name:'沼蛙',lv:3,xp:12,hp:16,atk:4,def:0,intro:'一群沼蛙堵住了泥路'},{canFlee:false,items:{蛙皮:1},
      onWin:()=>{ f.grainJob=false; f.grainDone=true; f.grainPay=12; print('粮车过了泥路','ok'); huntBoardReturn(); }
    });
  }],
  ['回头',gotoBoard2]
  ]);
}
function collectGrain(){
  const f=state.p.flags;
  state.p.gold+=f.grainPay||0;
  print('磨坊主付了'+(f.grainPay||0)+'铜币','ok');
  f.grainDone=false; f.grainPay=0; f.jobCount++;
  gotoBoard2();
}
function gotoFrogField(){
  const f=state.p.flags;
  if(!f.frogJob||f.frogsLeft<=0){ print('蛙潮退了','dim'); gotoRoad2(); return; }
  startCombat({name:'沼蛙',lv:3,xp:12,hp:16,atk:4,def:0,intro:'一只沼蛙鼓着下巴'},{canFlee:true,items:{蛙皮:1},
   onWin:()=>{ f.frogsLeft--;
     if(f.frogsLeft>0){ print('还剩 '+f.frogsLeft+' 只','dim'); scene('蛙潮','蛙还在跳',[['继续打',gotoFrogField],['先回去',gotoRoad2]]); }
     else { f.frogDone=true; print('蛙潮退了','dim'); scene('蛙潮','街道安静下来',[['回告示板',gotoBoard2],['回城',gotoCromford]]); }
   },
   onFlee:()=>{ scene('蛙潮','你撤了蛙还在',[['再上',gotoFrogField],['回城',gotoCromford]]); }
  });
}
function collectFrog(){

  state.p.gold+=8; f.frogDone=false; f.frogJob=false; f.jobCount++;
  print('管事付了8铜币','ok');

function gotoFish(){
  const f=state.p.flags;
  if(!f.fishJob||f.fishDone){ print('船已经靠岸了','dim'); gotoRoad7(); return; }
  const r=Math.random();
  if(r<0.3){
    print('海狼撞上了船舷！','bad');
    startCombat({name:'海狼',lv:8,xp:36,hp:40,atk:9,def:1,intro:'一头海狼跃上甲板，牙缝里全是鱼血'},{canFlee:false,items:{海鱼:2},
     onWin:()=>fishResult()});
    return;
  }
  if(r<0.45){ print('这一网只有海草','dim'); fishResult(); return; }
  const n=1+Math.floor(Math.random()*3);
  addItem('海鱼',n);
  print('这一网捞起海鱼 ×'+n,'ok');
  fishResult();

function fishResult(){
  const f=state.p.flags;
  f.fishNets--;
  if(f.fishNets>0){ scene('渔船','还能再撒网，',[['继续撒网（还剩 '+f.fishNets+' 网）',gotoFish],['收网回港',()=>{ f.fishDone=true; gotoBoard7(); }]]); }
  else { f.fishDone=true; print('三网撒完，回港','dim'); huntBoardReturn(); }
}
function collectFish(){ const f=state.p.flags; state.p.gold+=5; f.fishDone=false; f.fishJob=false; f.jobCount++; print('船主付了5铜币，渔获归你','ok'); huntBoardReturn(); }

function lairEndlessPool(floor){
  const low=[['龙蜥',12,64,12,4],['海狼',8,40,9,1],['盐鬼',11,58,10,2],['海盗',7,38,9,2]];
  const mid=[['巢穴之主',18,140,15,7],['教团护教骑士',12,66,12,5],['黑甲骑士',13,80,13,8],['渡口水鬼',8,38,8,1]];
  const high=[['血池甲士',10,60,11,5],['巡防队长',15,90,14,7],['疫岸野骑士',14,80,13,6],['灰衣指挥官',13,75,13,6]];
  const pool=floor>=30?high.concat(mid).concat(low):floor>=10?mid.concat(low):low;
  return pool[Math.floor(Math.random()*pool.length)];
}
function lairMobStats(floor){
  const m=lairEndlessPool(floor);
  const mul=1+0.12*(floor-1);
  return {name:m[0],lv:Math.max(1,Math.round(m[1]+floor*0.5)),xp:Math.round(m[1]*4*(1+floor*0.1)),hp:Math.round(m[2]*mul),atk:Math.round(m[3]*(1+0.08*(floor-1))),def:m[4],intro:'第'+floor+'层的'+m[0]+'，被深处的鲸泉滋养得格外强壮'};
}
function whaleDragonStats(floor){
  const tier=Math.floor(floor/10);
  return {name:'巨鲸之泉龙',lv:10+tier*8,xp:tier*120,hp:Math.round(280*(1+0.25*(tier-1))),atk:16+tier*3,def:6+Math.round(tier*1.5),physRes:0.5,intro:'第'+floor+'层——巨鲸之泉的龙，每一片鳞都浸过鲸泉'};
}
function gotoLairEndless(){
  const f=state.p.flags;
  if(!f.lairUnlocked&&!f.lairReward&&!f.lairDone){ print('你还没探过龙巢的底，洞口不肯放你下去','dim'); huntBoardReturn(); return; }
  if(!state.p.lairFloor||state.p.lairFloor<1)state.p.lairFloor=1;
  const floor=state.p.lairFloor;
  if(floor%10===0){
    print('第'+floor+'层——洞壁在发亮，鲸泉的气息浓得能喝','hint');
    chainFights([
      {en:lairMobStats(floor),flee:false,after:()=>print('第一只倒下了，第二只从泉水里爬出来','dim')},
      {en:lairMobStats(floor),flee:false,after:()=>print('泉眼翻涌——龙来了','hint')},
      {en:whaleDragonStats(floor),flee:false}
    ],()=>lairFloorWin(floor,true));
  } else {
    startCombat(lairMobStats(floor),{canFlee:false,
     onWin:()=>lairFloorWin(floor,false)});
  }
}
function lairFloorWin(floor,isBoss){
  const p=state.p, f=state.p.flags;
  p.lairFloor=floor+1;
  if(floor>f.lairBest)f.lairBest=floor;
  const gold=2+floor*2;
  p.gold+=gold;
  print('第'+floor+'层清空：+'+gold+'铜币','ok');
  gainXp(15+floor*4);
  if(isBoss){
    const tier=Math.floor(floor/10);
    addItem('龙鳞',1+tier);
    if(floor>=20 && Math.random()<0.5)addItem('精炼熔断钢铁',1);
    print('巨鲸之泉龙倒下，泉水把鳞片冲到了你脚边','hint');
  } else {
    if(Math.random()<0.35)addItem('海鱼',1+Math.floor(Math.random()*2));
    else if(Math.random()<0.3)addItem('兽皮',1);
    else if(floor>=10 && Math.random()<0.25)addItem('龙鳞',1);
  }
  // 50层特殊奖励：裂纹的臂甲（不可替换）
  if(floor===50 && !f.armguardGot){
    f.armguardGot=true;
    p.armguard={name:'裂纹的臂甲',u:true};
    p.maxHp+=100; p.hp=Math.min(p.maxHp,p.hp+100);
    hr();
    print('泉水中央浮起一具臂甲——阿喀琉斯的左臂甲，已经裂了','hint');
    print('裂纹的臂甲：不可替换，武器获得法伤增伤+25%，全体队友伤害+4，生命上限+100','ok');
    print('它贴在你的左臂上，再也摘不下来','dim');
  }
  statusLine();
  scene('龙巢深处·第'+floor+'层','要再往下吗？更深处的奖励更厚，更深处的龙更饿',[
  ['继续下潜（第 '+(floor+1)+' 层）',gotoLairEndless],
  ['返回地面',()=>{ print('你顺着来路爬回地面，这次到了第'+floor+'层','dim'); state.p.lairFloor=1; gotoBoard7(); }]
  ]);
}

function allyWeaponMenu(){
  clearActs();
  const o=[];
  [state.p.knight,state.p.companion,state.p.regulus,state.p.ampthis].forEach(a=>{
    if(!a)return;
    const w=a.weapon;
    o.push([a.name+'（Lv.'+(a.lv||1)+' · 攻'+allyAtk(a)+' · 防'+(a.def||0)+'）'+(w?('武器：'+w.name+'（每击贡献'+allyWeaponDmg(a)+'）'):'（没有武器）'),()=>allyWeaponPick(a)]);

  choices(o); statusLine();

function allyWeaponPick(a){
  clearActs();
  const o=state.p.owned.map(w=>[
    w.name+'（伤害+'+w.atk+'，'+a.name+'每击实得+'+Math.round(w.atk*0.4)+'）'+(a.weapon&&a.weapon.name===w.name?'（装备中）':''),
    ()=>{ a.weapon={name:w.name,atk:w.atk}; print(a.name+'拿起了'+w.name+'（每击贡献+'+Math.round(w.atk*0.4)+'伤害）','ok'); allyWeaponMenu(); }]);
  o.push(['卸下武器',()=>{ a.weapon=null; print(a.name+'把武器放回了包袱边','dim'); allyWeaponMenu(); }]);
  o.push(['返回',allyWeaponMenu]);
  choices(o); statusLine();
}

function runCmd(s){

  else if(c==='/霜'){ state.p.journey=null; gotoNewTown('frostvalley'); }
  else if(c==='/银'){ state.p.journey=null; gotoNewTown('silvershield'); }
  else if(c==='/塞'){ state.p.journey=null; gotoFortress(); }
  else if(c==='/黑'){ state.p.journey=null; gotoBlackThorn(); }
  else if(c==='/北望'){ state.p.journey=null; gotoNewTown('northwatch'); }
  else if(c==='/观'){ state.p.journey=null; gotoNewTown('seaview'); }
  else if(c==='/黑原'){ state.p.journey=null; gotoBlackPlain(); }
  else if(c==='/北古'){ state.p.journey=null; gotoNorthBattlefield(); }
  else if(c==='/军团'){ state.p.journey=null; state.p.flags.northWarWarlord=false; northWarArmyScene(); }
  else if(c==='/安普'||c==='/安普提斯'){
    if(ctx){ print('战斗结束后再召唤','bad'); }
    else if(state.p.flags.ampthisJoined){ print('安普提斯就在队伍里——抬头看看','dim'); }
    else startCombat(ampthisBoss(),{canFlee:true,onWin:ampthisWin,onFlee:()=>{ print('你退开了——她在雾里看着你','dim'); backToTown(); }});
  }
  else if(c==='/妖僧'||c==='/拉斯普提'){
    if(ctx){ print('战斗结束后再召唤','bad'); }
    else {
      const lv=state.p.flags.lasputiLv||60;
      lasputiResume=null;
      startCombat({name:'妖僧·拉斯普提',lv,xp:900,hp:900+lv*25,atk:20+Math.round(lv/2),def:10,physRes:0.35,legendLives:3,intro:'你念出那个名字——他就站在那儿了，脑袋歪搭在肩上，脖子上的血滴答滴答'},{canFlee:true,onWin:lasputiWin,onFlee:()=>{ print('你退开了——他还在原地笑','dim'); backToTown(); }});
    }
  }
  else if(c==='/龙'){ state.p.flags.dragonMet=false; startCombat({name:'老龙',lv:20,xp:50,hp:400,atk:18,def:8,physRes:0.5,intro:'它落下来的时候，风先到了'},{canFlee:false,items:{覆金属龙皮:2,精炼熔断钢铁:1},onWin:()=>{ scene('野外','它倒下了，这不是它该有的结局',[['继续走',backToTown]]); }}); }
  else if(c==='/赤龙'){ startCombat({name:'赤河龙',lv:40,xp:400,hp:900,atk:30,def:12,physRes:0.6,intro:'河水红了，赤河龙从河里升起'},{canFlee:false,items:{覆金属龙皮:3,龙鳞:2,精炼熔断钢铁:1,管理者材料:1},onWin:()=>{ scene('河滩','它沉回了河里，河水慢慢变清',[['继续走',backToTown]]); }}); }
  else if(c==='/狮子'){
    state.p.level=30; state.p.xp=0;
    const s30=statsForLevel(30); const arm30=(state.p.armguard?100:0); const ab30=state.p.accBonus||{hp:0,mp:0,sta:0};
    state.p.maxHp=s30.maxHp+arm30+ab30.hp; state.p.maxMp=s30.maxMp+ab30.mp; state.p.maxSta=s30.maxSta+ab30.sta; state.p.atk=s30.atk;
    state.p.hp=state.p.maxHp; state.p.mp=state.p.maxMp; state.p.sta=state.p.maxSta;
    const f=state.p.flags;
    f.regulus1=true; f.regulus2=true; f.regulus3=true; f.regulus4=true; f.regulus5=true;
    f.lionSwordJob=true; f.lionSwordDone=true; f.leoStarJob=true; f.starDone=true;
    f.twoLionsReady=true;
    if(!f.leoEyeTown)f.leoEyeTown='ashwold';
    state.p.lionSword={name:'狮心剑',atk:40,type:'剑',fx:['狮心','暴怒','追猎']};
    print('（开发者）等级30 + 五件信物 + 狮心剑已就位——出城游荡即可触发双狮之试','ok'); statusLine();
  }
  else if(c==='/双狮'){ state.p.flags.twoLionsReady=true; state.p.flags.twoLionsMet=false; startTwoLions(); }
  else if(c==='/骑士'){ const n=parseInt(t[1])||1; legKnightFight(n,backToTown); }
  else if(c==='敌情'){ if(ctx){ (ctx.enemies&&ctx.enemies.length?ctx.enemies:[ctx.en]).forEach(e=>{ if(e.hp<=0)return; print('敌情：'+e.name+' Lv.'+(e.lv||'?')+' · 生命 '+Math.max(0,e.hp)+'/'+e.maxHp+' · 攻击'+e.atk+(e.atkBoost?'（+'+e.atkBoost+'协作）':'')+' · 防御'+e.def+(e===ctx.en?' ←目标':'')+(e.狂暴?' · 狂暴':'')+(e.stunned?' · 被震住':'')+(e.bleed?' · 流血'+e.bleed:'')+(ctx.exposed&&e===ctx.en?' · 腹部暴露':'')); }); } else print('当前没有战斗','dim'); }
  else if(c==='/reset'||c==='/重置'){ state=newGame(); riverScene(); }
  else print('听不懂（试试：看 / 状态 / 背包 / 帮助 / /dev）','dim');
}
