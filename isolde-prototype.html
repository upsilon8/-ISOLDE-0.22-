<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伊索尔德 / ISOLDE（第一章·南境）</title>
<style>
  :root{ --bg:#050805; --fg:#b8e8c0; --dim:#6f9a78; --amber:#e0b96a; --red:#ff6b5e; --ok:#8ee89a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Sarasa Mono SC","Consolas","Courier New","Noto Sans Mono CJK SC",monospace;
    font-size:15px; line-height:1.55; }
  #app{ display:flex; flex-direction:column; height:100%; max-width:880px; margin:0 auto; padding:8px 14px; }
  #status{ border:1px solid #1d3a22; padding:6px 10px; color:var(--amber); font-size:13px; white-space:pre-wrap; }
  #log{ flex:1; overflow-y:auto; padding:10px 2px; scrollbar-width:thin; }
  #log .line{ margin:2px 0; white-space:pre-wrap; word-break:break-word; }
  #log .h{ color:var(--amber); font-weight:bold; }
  #log .enemy{ color:var(--red); }
  #log .hit{ color:var(--ok); }
  #log .bad{ color:var(--red); }
  #log .def{ color:#7ec8e3; }
  #log .hint{ color:var(--amber); }
  #log .hl{ color:#ffd97a; font-weight:bold; background:#33260f; padding:0 2px; }
  #log .dim{ color:var(--dim); }
  #actions{ padding:8px 0; border-top:1px dashed #1d3a22; display:flex; flex-wrap:wrap; gap:6px; }
  button{ background:#0c1a0e; color:var(--fg); border:1px solid #2a5c33; padding:6px 12px;
    cursor:pointer; font:inherit; font-size:14px; }
  button:hover{ background:#14301a; border-color:#4b9a5c; color:#fff; }
  button:disabled{ opacity:.4; cursor:default; }
  #inputrow{ display:flex; padding:6px 0 2px; color:var(--ok); }
  #cmd{ flex:1; background:transparent; border:none; outline:none; color:var(--fg); font:inherit; font-size:15px; }
  .title{ text-align:center; margin:18vh 0 0; }
  .title pre{ font-size:13px; color:var(--amber); }
</style>
</head>
<body>
<div id="app">
  <div id="status">—</div>
  <div id="log"></div>
  <div id="actions"></div>
  <div id="inputrow">&gt; <input id="cmd" autocomplete="off" spellcheck="false" placeholder="帮助 / 看 / 状态 / 背包"></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const log=$('#log'), act=$('#actions'), cmd=$('#cmd'), statusEl=$('#status');
const SAVE_KEY='isolde_proto_v1';
let state=null, ctx=null, lastDesc='';
let twModeCur='on', twBusy=false, twCur=null;
const twQueue=[];
try{ const _st0=JSON.parse(localStorage.getItem('isolde_settings')||'{}'); twModeCur=_st0.twMode||(_st0.tw===false?'off':(_st0.tw==='fast'?'fast':'on')); }catch(e){}

/* ---------- 输出与UI ---------- */
function twSpeed(){ return twModeCur==='fast'?2:8; } // 正常8ms/字，快速2ms/字
function appendLine(t,cls){
  const d=document.createElement('div');
  d.className='line '+cls;
  d.textContent=t;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}
function print(t,cls=''){
  t=String(t);
  if(twModeCur==='off'){ appendLine(t,cls); return; }
  twQueue.push([t,cls]);
  twTick();
}
function twTick(){
  if(twBusy||!twQueue.length)return;
  twBusy=true;
  const pair=twQueue.shift();
  const t=pair[0], cls=pair[1];
  const d=document.createElement('div');
  d.className='line '+cls;
  d._full=t;
  log.appendChild(d);
  twCur=d;
  let i=0;
  const step=()=>{
    if(i>=t.length){ twCur=null; twBusy=false; log.scrollTop=log.scrollHeight; twTick(); return; }
    i++;
    d.textContent=t.slice(0,i);
    log.scrollTop=log.scrollHeight;
    setTimeout(step,twSpeed());
  };
  step();
}
function flushTw(){ while(twQueue.length){ const p=twQueue.shift(); appendLine(p[0],p[1]); } if(twCur){ twCur.textContent=twCur._full||''; twCur=null; } twBusy=false; }
function skipTw(){ if(twCur){ twCur.textContent=twCur._full||''; twCur=null; } flushTw(); } // 点击文字：当前行立即显示并跳过排队
function hr(){ print('─'.repeat(44),'dim'); }
function clearActs(){ act.innerHTML=''; }
function btn(t,f,disabled){ const b=document.createElement('button'); b.textContent=t; if(disabled)b.disabled=true; b.onclick=()=>f(); act.appendChild(b); }
function choices(list){ clearActs(); list.forEach(([t,f,d])=>btn(t,f,d)); }
function scene(title,desc,opts,descRaw){
  lastDesc=descRaw||desc;
  clearActs(); hr();
  print(title,'h'); print(desc);
  if(opts)choices(opts);
  statusLine();
}
function statusLine(){
  const p=state.p, w=p.weapon;
  let s='【'+placeName()+'】第'+(p.days||0)+'天 · Lv.'+(p.level||1)+'('+(p.xp||0)+'/'+xpNeed()+') · 生命 '+p.hp+'/'+p.maxHp+' · 体力 '+p.sta+' · 法力 '+p.mp+'/'+p.maxMp+' · 铜币 '+p.gold;
  s+='\n武器：'+(w?w.name+'(伤害+'+w.atk+')':'空手')+((p.stance&&STANCE_FX[p.stance]&&heavyStanceSet(weaponTypeOf(w||{})))?' · 架势：'+p.stance:'')+' · 熟练'+weaponTypeOf(w||{})+' Lv.'+wprofLv(weaponTypeOf(w||{}))+(p.def>0?' · 甲 '+p.def:'')+(p.accs&&p.accs.length?' · 饰×'+p.accs.length:'')+(p.armguard?' · 臂甲：'+p.armguard.name:'')+(p.companion?' · 伙伴':'' )+(p.knight?' · 骑士随从':'')+(p.regulus?' · 轩辕十四':'')+(p.mercs&&p.mercs.length?' · 佣兵×'+p.mercs.length:'')+((p.leader&&p.leader!=='主角')?' · 领队：'+p.leader:'')+((p.control)?' · 操控：'+p.control:'');
  if(p.buff.流血>0)s+=' · 流血'+p.buff.流血+'层';  if(p.buff.保养>0)s+=' · 保养×'+p.buff.保养;
  if(p.buff.磨石>0)s+=' · 磨石×'+p.buff.磨石;
  if(p.flags.通缉)s+=' · 被通缉';
  statusEl.textContent=s;
}
let curScene='ashwold';
function backToTown(){ if(state.p.lastTown==='cromford')gotoCromford(); else if(state.p.lastTown==='tanwo')gotoTanwo(); else if(state.p.lastTown==='lienfiel')gotoLienfiel(); else if(state.p.lastTown==='warrin')gotoWarrin(); else if(state.p.lastTown==='whitestone')gotoWhitestone(); else if(state.p.lastTown==='windcap')gotoWindcap(); else if(state.p.lastTown==='ferrytown')gotoFerryTown(); else if(state.p.lastTown==='landel')gotoLandel(); else if(state.p.lastTown==='carwo')gotoCarwo(); else if(state.p.lastTown==='blackthorn')gotoBlackThorn(); else if(state.p.lastTown==='herik')gotoHerikCamp(); else if(state.p.lastTown&&NEW_TOWN_DEFS[state.p.lastTown])gotoNewTown(state.p.lastTown); else gotoAshwold(); }
function restInTown(){
  state.p.days=(state.p.days||0)+1;
  state.p.hp=state.p.maxHp; state.p.sta=state.p.maxSta; state.p.mp=state.p.maxMp;
  state.p.buff.流血=0; state.p.buff.硬直=0;
  healAllies();
  saveGame();
  print('你在镇上歇了一夜第'+state.p.days+'天（已存档）','ok');
  backToTown();
}
function backToRoad(){ if(state.p.lastTown==='cromford')gotoRoad2(); else if(state.p.lastTown==='tanwo')gotoRoad3(); else if(state.p.lastTown==='lienfiel')gotoRoad4(); else if(state.p.lastTown==='warrin')gotoRoad5(); else if(state.p.lastTown==='whitestone')gotoRoad6(); else if(state.p.lastTown==='windcap')gotoRoad7(); else if(state.p.lastTown==='ferrytown')gotoRoad10(); else if(state.p.lastTown==='landel')gotoRoad8(); else if(state.p.lastTown==='carwo')gotoRoad9(); else if(state.p.lastTown==='blackthorn')gotoBlackThornRoad(); else if(state.p.lastTown&&NEW_TOWN_DEFS[state.p.lastTown])gotoNewRoad(state.p.lastTown); else gotoRoad(); }
function placeName(){
  if(curScene==='cromford')return '克罗姆福德';
  if(curScene==='tanwo')return '坦沃';
  if(curScene==='lienfiel')return '利恩菲尔';
  if(curScene==='warrin')return '沃林';
  if(curScene==='whitestone')return '白石镇';
  if(curScene==='windcap')return '风角港';
  if(curScene==='road2')return '克罗姆福德城外';
  if(curScene==='road3')return '坦沃城外';
  if(curScene==='road4')return '利恩菲尔城外';
  if(curScene==='road5')return '沃林城外';
  if(curScene==='road6')return '白石镇城外';
  if(curScene==='road7')return '风角港城外';
  if(curScene==='ferrytown')return '渡口镇';
  if(curScene==='landel')return '兰德尔';
  if(curScene==='carwo')return '卡尔沃';
  if(curScene==='road8')return '兰德尔城外';
  if(curScene==='road9')return '卡尔沃城外';
  if(curScene==='road10')return '渡口镇城外';
  if(curScene==='road11')return '古战场';
  if(curScene==='eastwaste')return '东荒原';
  if(curScene==='blackthorn')return '黑棘城';
  if(curScene==='blackthornroad')return '黑棘城外';
  if(curScene==='blackplain')return '黑原荒野';
  if(curScene==='northbattlefield')return '北古战场';
  if(curScene==='fortress')return '灰墙要塞';
  if(curScene&&curScene.indexOf('newroad:')===0){ const k=curScene.slice(8); return NEW_ROADS[k]?NEW_ROADS[k].cn:'郊野'; }
  if(curScene&&NEW_TOWN_DEFS[curScene])return NEW_TOWN_DEFS[curScene].cn;
  if(curScene==='road')return '阿什沃德城外';
  if(curScene==='camp')return '营地';
  if(curScene==='journey')return '旅途';
  return '阿什沃德';
}
function saveGame(){
  try{
    state.scene=curScene;
    state.sv=2;
    state.savedDay=state.p.days;
    localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  }catch(e){}
}
/* 存档迁移：任何旧版本存档读入后，逐项补齐新字段（旧档永不失效） */
function migrate(s){
  if(!s||!s.p||s.p.weapon===undefined)return null;
  const p=s.p;
  if(p.level===undefined)p.level=1;
  if(p.xp===undefined)p.xp=0;
  if(p.mercs===undefined){ p.mercs=p.merc?[p.merc]:[]; delete p.merc; }
  if(!p.buff)p.buff={流血:0,硬直:0,保养:0,磨石:0};
  if(p.buff.磨石===undefined)p.buff.磨石=0;
  if(p.buff.流血===undefined)p.buff.流血=0;
  if(p.buff.硬直===undefined)p.buff.硬直=0;
  if(p.buff.保养===undefined)p.buff.保养=0;
  if(p.days===undefined)p.days=0;
  if(p.shop===undefined)p.shop={};
  if(p.gear===undefined){ p.gear={头:null,胸:p.armor||null,腿:null,披风:null}; delete p.armor; }
  if(p.armorBag===undefined)p.armorBag=[];
  if(p.campFrom===undefined)p.campFrom=null;
  for(const slot of ['头','胸','腿','披风']){ if(p.gear[slot]===undefined)p.gear[slot]=null; }
  if(p.knight===undefined)p.knight=null;
  if(p.accs===undefined)p.accs=[];
  if(p.accBag===undefined)p.accBag=[];
  if(p.accessory){ p.accBag.push(p.accessory); delete p.accessory; } // 旧单槽饰品并入饰品袋
  if(p.accBonus===undefined)p.accBonus={hp:0,mp:0,sta:0};
  if(p.craftXP===undefined)p.craftXP={锻造:0,烹饪:0,炼金:0}; // 制作熟练度
  if(p.pow===undefined)p.pow=0;
  if(p.fort===undefined)p.fort=0;
  if(p.coat===undefined)p.coat=0;
  if(p.buffSys===undefined)p.buffSys={攻:{v:0,n:0},防:{v:0,n:0},速:{v:0,n:0}};
  if(p.armguard===undefined)p.armguard=null;
  if(p.armguard&&p.armguard.name==='裂纹的臂甲'&&!p.armguard.u){ p.maxHp+=50; p.hp=Math.min(p.maxHp,p.hp+50); p.armguard.u=true; } // 旧档臂甲加成从+50补到+100
  if(p.regulus===undefined)p.regulus=null;
  if(p.lionSword===undefined)p.lionSword=null;
  if(p.inv&&(p.inv['管理员材料']||p.inv['管理员物品'])){ p.inv.管理者材料=(p.inv.管理者材料||0)+(p.inv['管理员材料']||0)+(p.inv['管理员物品']||0); delete p.inv['管理员材料']; delete p.inv['管理员物品']; }
  if(p.leader===undefined)p.leader='主角';
  if(p.control===undefined)p.control=null; // 战斗外切换的操控角色（null=主角）
  if(p.stance===undefined)p.stance='攻势'; // 架势（重武器/剑的攻防架势）
  if(!STANCE_FX[p.stance])p.stance='攻势'; // 旧档的非法架势归位
  if(p.stance==='攻')p.stance='攻势';
  if(p.wprof===undefined)p.wprof={}; // 武器熟练度（按类型累计使用次数）
  if(p.bestiary===undefined)p.bestiary={}; // 敌人图鉴
  if(p.kills===undefined)p.kills=0; // 累计击杀
  const allyLv=(a,def)=>{ if(!a)return; if(a.lv===undefined)a.lv=def; if(a.xp===undefined)a.xp=0; };
  allyLv(p.companion,6); allyLv(p.knight,p.knight?p.knight.tn||10:10); allyLv(p.regulus,40);
  if(p.knight&&p.knight.name==='落魄骑士'){ p.knight.role='队员'; p.knight.passive='军心：作为队长时全队伤害+1，他自身再+1'; }
  (p.mercs||[]).forEach(m=>{ if(m.hp===undefined){ m.hp=25+(m.tn||0)*5; m.maxHp=m.hp; } });
  if(p.knight&&p.knight.hp===undefined){ p.knight.hp=45; p.knight.maxHp=45; }
  if(p.companion&&p.companion.hp===undefined){ p.companion.hp=30; p.companion.maxHp=30; }
  const allyStat=(a,fb,def)=>{ if(!a)return; if(a.atk===undefined)a.atk=fb(a)+(a.w||0); if(a.atk0===undefined)a.atk0=a.atk; if(a.def===undefined)a.def=def; if(a.def0===undefined)a.def0=def; if(a.weapon===undefined)a.weapon=null; if(a.fw===undefined)a.fw=0; if(a.fa===undefined)a.fa=0; if(a.a===undefined)a.a=Math.min(3,Math.floor(a.def/4)); };
  allyStat(p.companion,a=>a.d||6,1);
  allyStat(p.knight,a=>a.tn||10,2);
  allyStat(p.regulus,a=>statsForLevel(a.lv||40).atk+20,20);
  if(p.regulus&&!p.regulus.weapon&&p.lionSword)p.regulus.weapon={name:'狮心剑',atk:40};
  if(p.lairFloor===undefined)p.lairFloor=1;
  if(!p.flags)p.flags={};
  for(let i=0;i<24;i++){ if(p.flags['highJob'+i]===undefined)p.flags['highJob'+i]=false; if(p.flags['highDone'+i]===undefined)p.flags['highDone'+i]=false; if(p.flags['highReward'+i]===undefined)p.flags['highReward'+i]=false; }
  if(p.flags.god===undefined)p.flags.god=false;
  if(p.forge===undefined)p.forge={count:0};
  if(p.companion===undefined)p.companion=null;
  if(p.journey===undefined)p.journey=null;
  if(p.flags.ampelosMet===undefined)p.flags.ampelosMet=false;
  if(p.flags.dragonMet===undefined)p.flags.dragonMet=false;
  if(p.lastTown===undefined)p.lastTown='ashwold';
  for(const k of ['铁料','蛙皮','蛙油膏','覆金属龙皮','烟幕弹','苦蜜蜡','苦蜜酒','骨器','灰肉','疫骨','麦饼','龙鳞','精炼熔断钢铁','管理者材料','军阀密令','法术书·火舌','法术书·霜刃','法术书·雷击','法术书·霜雾','法术书·北风之怒','法术书·石拳','法术书·冰锥术','法术书·荆棘缠绕','法术书·治愈环流','法术书·灼热射线','法术书·生命虹吸','法术书·灼热新星','法术书·疾风刃','法术书·碎石雨','法术书·净光术','法术书·深眠咒','法术书·御土之盾','法术书·增幅术','法术书·恐惧术','法术书·虚弱诅咒','法术书·迟缓诅咒','法术书·破甲诅咒','法术书·疫病诅咒','法术书·背运诅咒','法术书·幻影术','法术书·安抚幻觉','法术书·失志诅咒','法术书·秘法飞弹','法术书·心智鞭笞','法术书·星陨术','法术书·陨星天降','法术书·焚世烈焰','法术书·绝对零度','法术书·雷霆万钧','法术书·湮灭射线','法术书·北境冰暴','法术书·死亡一指','法术书·血沸术','法术书·灵魂湮灭','法术书·精神崩解','法术书·灵魂尖啸','法术书·神罚之矛','木','竹','骨','橡木','白蜡木','紫杉木','赐福木','诅咒载体木','陨铁','龙钢','古战场铁','血术硬化钢','鲸骨','罂粟','海鱼','大鱼','烤鱼','兽皮','野猪肉','绷带','干粮','保养油','旧铁片','猪王皮','胡椒','烤肉','旧银币','巨魔牙','魔化兽皮','蛇蛋','净水袋','草药','陈年果酒','巨魔粗制饰品','磨石','肉桂','丁香','藏红花','血盐','血水结晶','女妖之泪','黑鳄皮','巨魔皮','碎布条','火把','止血膏','醒神草','盐渍肉','猛火油','皮革帽','铁头盔','锁子甲兜帽','板甲头盔','皮背心','锁子甲胸甲','板甲胸甲','皮革护腿','锁子甲护腿','板甲护腿','布披风','皮革披风','游侠短弓','骑士剑','熊皮','蛛丝','骨头','蛇皮','暗影之尘','送葬骨灰','水渍石','摆锤','弃誓之剑','空甲胄壳','虱壳','虱母壳','除虱粉','灰衣甲片','灰衣队长徽记','灰土结晶','妖僧残页','拉斯普提的碎甲片','疯狂核心','拉斯普提的毒血','疯子的蜡烛','蜂蜜','木炭']){
    if(p.inv[k]===undefined)p.inv[k]=0;

function loadGame(){
  try{

  }catch(e){}

}
function restoreScene(sc){

  else if(sc==='lienfiel')gotoLienfiel();

  else if(sc&&sc.indexOf('newroad:')===0)gotoNewRoad(sc.slice(8));
  else if(sc==='fortress')gotoFortress();
  else if(sc&&NEW_TOWN_DEFS[sc])gotoNewTown(sc);
  else if(sc==='road')gotoRoad();

  else if(sc==='road3')gotoRoad3();

  else if(sc==='road5')gotoRoad5();

  else if(sc==='camp')gotoCamp();

  else if(sc==='journey')gotoRoad();
  else backToTown();
}
function exportSave(){
  state.scene=curScene;
  state.sv=2;
  try{
    const code='ISOLDE'+btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    print('存档码——复制下面整段文字，可在任何浏览器"导入存档"继续这段旅程：','h');
    print(code,'ok');
  }catch(e){ print('导出失败','bad'); }
  sysMenu();
}
function importSave(){
  let code=null;
  try{ if(typeof prompt==='function')code=prompt('粘贴存档码：'); }catch(e){}
  if(!code){ print('无法打开输入框（此环境不支持）','dim'); sysMenu(); return; }
  try{
    const json=decodeURIComponent(escape(atob(String(code).trim().replace(/^ISOLDE/,''))));
    const s=migrate(JSON.parse(json));
    if(!s){ print('存档码无效','bad'); sysMenu(); return; }
    state=s; ctx=null; twQueue.length=0; twBusy=false;
    saveGame();
    print('导入成功，已覆盖本地存档','ok');
    restoreScene(s.scene||'ashwold');
  }catch(e){ print('存档码无效','bad'); sysMenu(); }
}

function pickFrom(pool,n){
  const arr=pool.slice();
  let seed=shopCycle()*7+13;
  const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr.slice(0,n);
}
function stockOf(shop,pool){
  if(!state.p.shop)state.p.shop={};
  const cyc=shopCycle();
  if(!state.p.shop[shop]||state.p.shop[shop].cycle!==cyc){
    state.p.shop[shop]={cycle:cyc,items:pickFrom(pool,20)}; // 每天20种新货，隔天刷新
  }
  return state.p.shop[shop];
}
function takeStock(shop,name){

}

function forgeMenu(){
  const lv=forgeLevel(); const f=state.p.forge;
  clearActs();
  print('定制武器 —— 铁匠 Lv.'+lv+'（已打造 '+f.count+'/1000）· 锻造熟练 Lv.'+craftLevel('锻造')+'（'+craftXpIn('锻造')+'/50）','h');
  print('先选大类，再按部位选材（剑身/剑柄/护手——龙钢、陨铁、鲸骨各有特性）任何等级都有 2.1% 概率出东方武器','dim');
  const o=FORGE_CATS.map(([cat,mat])=>[cat+'（铁料×'+mat+'）',()=>forgePartMenu(cat,mat,[],0)]);
  o.push(['返回',gotoSmith]);
  choices(o); statusLine();
}
function forgePartMenu(cat,baseMat,chosen,idx,back){
  if(!chosen)chosen=[];
  back=back||gotoSmith;
  const parts=FORGE_PARTS[cat]||[['主体',['铁料']]];
  if(idx>=parts.length)return doForge2(cat,baseMat,chosen,back);
  const partName=parts[idx][0], pool=parts[idx][1];
  clearActs();
  print('选材：'+cat+'——'+partName+'（第'+(idx+1)+'部位/'+parts.length+'）','h');
  const o=[];
  for(const m of pool){
    const d=FORGE_MAT_DEF[m]||{desc:''};
    const have=state.p.inv[m]||0;
    const used=chosen.filter(x=>x===m).length;
    const locked=(d.ch2&&!(state.p.flags&&state.p.flags.ch2));
    if(locked)o.push([m+'（'+d.desc+'）·未解锁',()=>{ print('这是北方的钢材——还不到用的时候','bad'); forgePartMenu(cat,baseMat,chosen,idx,back); }]);
    else if(have-used<=0)o.push([m+'（'+d.desc+'）·缺',()=>{ print(m+'不够','bad'); forgePartMenu(cat,baseMat,chosen,idx,back); }]);
    else {
      o.push([m+'（'+d.desc+'）·'+have,()=>forgePartMenu(cat,baseMat,chosen.concat([m]),idx+1,back)]);
      if(have-used>=10)o.push([m+'×10（'+d.desc+'）·'+have,()=>forgePartMenu(cat,baseMat,chosen.concat(Array(10).fill(m)),idx+1,back)]);
    }
  }
  const steelN=(state.p.sharpSteel||[]).length;
  if(steelN){
    const usedSteel=chosen.filter(x=>x==='锋利精钢').length;
    if(steelN-usedSteel>0){
      const top=Math.max.apply(null,state.p.sharpSteel);
      o.push(['锋利精钢（继承攻击+'+top+'）·'+steelN,()=>forgePartMenu(cat,baseMat,chosen.concat(['锋利精钢']),idx+1,back)]);
      if(steelN-usedSteel>=10)o.push(['锋利精钢×10（继承攻击+'+top+'）·'+steelN,()=>forgePartMenu(cat,baseMat,chosen.concat(Array(10).fill('锋利精钢')),idx+1,back)]);
    }
  }
  o.push(['返回',()=>back()]);
  choices(o); statusLine();
}
function doForge2(cat,baseMat,chosen,back){
  back=back||gotoSmith;
  const lv=forgeLevel();
  const fee=5+lv*3;
  if(state.p.inv.铁料<baseMat){ print('铁料不够（需'+baseMat+'块）','bad'); forgeMenu(); return; }
  const counts={};
  chosen.forEach(k=>{ counts[k]=(counts[k]||0)+1; });
  let inheritAtk=0;
  for(const k of Object.keys(counts)){
    if(k==='锋利精钢'){ if((state.p.sharpSteel||[]).length<counts[k]){ print('锋利精钢不够','bad'); forgeMenu(); return; } continue; }
    if((state.p.inv[k]||0)<counts[k]){ print('没有足够的'+k+'','bad'); forgeMenu(); return; }
  }
  if(state.p.gold<fee){ print('加工费'+fee+'铜币，钱不够','bad'); forgeMenu(); return; }
  state.p.inv.铁料-=baseMat;
  for(const k of Object.keys(counts)){ if(k==='锋利精钢')continue; state.p.inv[k]-=counts[k]; }
  if(counts['锋利精钢']){
    state.p.sharpSteel.sort((a,b)=>b-a);
    inheritAtk=state.p.sharpSteel.splice(0,counts['锋利精钢']).reduce((a,b)=>a+b,0);
  }
  state.p.gold-=fee;
  state.p.forge.count++;
  gainCraftXP('锻造',5);
  const newLv=forgeLevel();
  if(newLv>lv){ print('铁匠点了点头——他升到了 Lv.'+newLv+'！','hint'); }
  const rank={劣质:0,普通:1,优良:2,稀有:3,史诗:4};
  let atkPct=1, minQ=null, fxAll=[], staff={};
  chosen.forEach(m=>{
    const d=FORGE_MAT_DEF[m]||{};
    if(d.atkPct)atkPct*=1+d.atkPct;
    if(d.minQ&&(minQ===null||rank[d.minQ]>rank[minQ]))minQ=d.minQ;
    if(d.fx)for(const f of d.fx){ if(!fxAll.includes(f))fxAll.push(f); }
    if(d.staff)staff[d.staff[0]]=d.staff[1];
    if(d.staffN)staff['neg_'+d.staffN[0]]=d.staffN[1];
  });
  let w;
  if(Math.random()<0.021){
    const o=ORIENTAL[Math.floor(Math.random()*ORIENTAL.length)];
    w={name:o[0]+'（东方）',atk:Math.max(1,Math.round(o[1]*atkPct)),type:o[2],fx:['异纹'].concat(rollFx(lv).filter(f=>f!=='异纹'))};
    print('炉火里翻出一种异样的花纹……','hint');
    print('异纹：来自海外的锻法，攻击+8%','dim');
  } else {
    const branch=CAT_BRANCH[cat][Math.floor(Math.random()*CAT_BRANCH[cat].length)];
    let q=rollQuality(lv);
    if(minQ && rank[q]<rank[minQ])q=minQ;
    w={name:branch+'·'+q,atk:Math.max(1,Math.round(Math.round(CAT_BASE[cat]*Q_FACTOR[q])*atkPct)),type:cat,fx:rollFx(lv)};
  }
  for(const fx of fxAll){ if(!w.fx.includes(fx))w.fx.push(fx); }
  if(Object.keys(staff).length)w.spellPct=staff;
  const cbLv=craftLevel('锻造')-1;
  if(cbLv>0)w.atk=Math.round(w.atk*(1+0.02*cbLv));
  if(inheritAtk){ w.atk+=inheritAtk; print('锋利精钢里的旧刃魂醒来——继承攻击+'+inheritAtk,'hint'); }
  print('打好了：'+w.name+'（攻击+'+w.atk+(w.fx.length?'，词条：'+w.fx.join('/'):'')+(w.spellPct?'，带杖身偏向':'')+'）','ok');
  state.p.owned.push(w);
  state.p.weapon={...w};
  print('你接过'+w.name+'，掂了掂（木剑还在包袱里——它不扔）','dim');
  back();
}
/* ---------- 熔炼旧武器（0.25）：旧剑回炉成锋利精钢，继承原武器四分之一攻击 ---------- */
function meltWeaponMenu(){
  clearActs();
  print('熔炼旧武器 —— 旧剑回炉成锋利精钢，继承原武器四分之一的攻击','h');
  print('锋利精钢可作为锻造材料投入任何部位：每块给新武器加上继承的攻击','dim');
  const o=[];
  (state.p.owned||[]).forEach(w=>{
    if(!w)return;
    if(w.name==='木剑')return;
    if(state.p.weapon&&state.p.weapon.name===w.name)return; // 手上的家伙不熔
    const inh=Math.max(1,Math.round((w.atk||0)/4));
    o.push(['熔炼：'+w.name+'（伤害+'+w.atk+' → 锋利精钢·继承攻击+'+inh+'）',()=>{
      state.p.owned.splice(state.p.owned.indexOf(w),1);
      state.p.sharpSteel.push(inh);
      print(w.name+'在炉里化成一滩钢水，凝成一块锋利精钢（继承攻击+'+inh+'）','ok');
      meltWeaponMenu();
    }]);
  });
  if(!o.length)print('没有可熔的旧武器（木剑不熔，手上的家伙不熔）','dim');
  o.push(['返回',gotoSmith]);
  choices(o); statusLine();
}

function forgeArmorMenu(){
  const lv=forgeLevel();
  clearActs();
  print('定制护甲 —— 铁匠 Lv.'+lv+'（已打造 '+state.p.forge.count+'/1000）','h');
  print('选部位，再选辅料（铁料为底，辅料可叠加至20件，效果累计）材质随铁匠等级解锁，品质影响防御','dim');
  const o=[['头（铁料×2）',()=>forgeArmorMatMenu('头')],['胸（铁料×4）',()=>forgeArmorMatMenu('胸')],['腿（铁料×3）',()=>forgeArmorMatMenu('腿')],['披风（铁料×2）',()=>forgeArmorMatMenu('披风')],['返回',gotoSmith]];
  choices(o); statusLine();
}
function forgeArmorMatMenu(slot,chosen){
  if(!chosen)chosen=[];
  const lv=forgeLevel();
  clearActs();
  print('选择辅料 —— '+slot+'（铁料×'+ARMOR_MAT_FEE[slot]+'为底，已选辅料 '+chosen.length+'/20）','h');
  if(chosen.length) print('已选：'+chosen.join('、'),'ok');
  const o=[];
  for(const pair of ARMOR_MATS){
    const k=pair[0], desc=pair[1];
    const have=(k==='铁料'?state.p.inv.铁料:state.p.inv[k])||0;
    const used=chosen.filter(x=>x===k).length;
    const remaining=have-used;
    const full=chosen.length>=20;
    o.push([k+'（'+desc+'）'+(k==='铁料'?'':(' ×'+remaining)), (full||remaining<=0)?()=>{ print(full?'辅料已满（20件）':'材料不够','bad'); forgeArmorMatMenu(slot,chosen); } : ()=>forgeArmorMatMenu(slot,chosen.concat([k]))]);
    const batch=Math.min(10,20-chosen.length);
    if(!full&&remaining>=batch&&batch>0)o.push([k+'×'+batch+'（'+desc+'）'+(k==='铁料'?'':(' ×'+remaining)),()=>forgeArmorMatMenu(slot,chosen.concat(Array(batch).fill(k)))]);
  }
  if(chosen.length) o.push(['撤销上一个（'+chosen[chosen.length-1]+'）',()=>forgeArmorMatMenu(slot,chosen.slice(0,-1))]);
  o.push(['开炉打造（辅料×'+chosen.length+'，加工费'+(5+lv*3)+'铜币）',()=>doForgeArmor(slot,chosen)]);
  o.push(['返回',forgeArmorMenu]);
  choices(o); statusLine();
}
function doForgeArmor(slot,chosen){
  const lv=forgeLevel();
  const fee=5+lv*3;
  const mat=ARMOR_MAT_FEE[slot];
  const ironExtra=chosen.filter(k=>k==='铁料').length;
  const needIron=mat+ironExtra;
  const counts={};
  chosen.forEach(k=>{ counts[k]=(counts[k]||0)+1; });
  if(state.p.inv.铁料<needIron){ print('铁料不够（需'+needIron+'块）','bad'); forgeArmorMatMenu(slot,chosen); return; }
  for(const k of Object.keys(counts)){
    if(k==='铁料')continue;
    if((state.p.inv[k]||0)<counts[k]){ print('没有足够的'+k+'','bad'); forgeArmorMatMenu(slot,chosen); return; }
  }
  if(state.p.gold<fee){ print('加工费'+fee+'铜币，钱不够','bad'); forgeArmorMatMenu(slot,chosen); return; }
  state.p.inv.铁料-=needIron;
  for(const k of Object.keys(counts)){ if(k!=='铁料')state.p.inv[k]-=counts[k]; }
  state.p.gold-=fee;
  state.p.forge.count++;
  const newLv=forgeLevel();
  if(newLv>lv){ print('铁匠点了点头——他升到了 Lv.'+newLv+'！','hint'); }
  let pool;
  if(lv<=2)pool=ARMOR_FORGE[slot].slice(0,1);
  else if(lv<=4)pool=ARMOR_FORGE[slot].slice(0,2);
  else if(lv<=5)pool=ARMOR_FORGE[slot].slice(0,3);
  else pool=ARMOR_FORGE[slot];
  const pick=pool[Math.floor(Math.random()*pool.length)];
  let q=rollQuality(lv);
  const rank={劣质:0,普通:1,优良:2,稀有:3,史诗:4};
  let dAdd=0, minQ=null;
  for(const k of chosen){
    const eff=ARMOR_MAT_EFFECT[k]||{};
    if(eff.d)dAdd+=eff.d;
    if(eff.minQ&&(minQ===null||rank[eff.minQ]>rank[minQ]))minQ=eff.minQ;
  }
  if(minQ && rank[q]<rank[minQ])q=minQ;
  const qf={劣质:0.7,普通:1.0,优良:1.3,稀有:1.7,史诗:2.2}[q];
  let def=Math.max(0,Math.round(pick[1]*qf)+dAdd);
  // 锻造熟练度：Lv2起每级让护甲防御+1
  def+=Math.max(0,craftLevel('锻造')-1);
  gainCraftXP('锻造',5);
  // 材质由第一个放入的辅料决定（第一个是铁料则走常规材质池）
  const first=chosen[0];
  const matName=(first&&first!=='铁料'&&ARMOR_MAT_NAME[first])?ARMOR_MAT_NAME[first]:pick[0];
  const name=matName+'·'+q;
  if(first&&first!=='铁料'&&ARMOR_MAT_NAME[first]) print('材质：'+first+'——整件甲胄都浸透了它的气息','dim');
  print('打好了：'+name+'（'+slot+'·+'+def+'防'+(dAdd?'，辅料加成+'+dAdd:'')+'）','ok');
  if(!state.p.gear[slot]){
    state.p.gear[slot]={name,def,price:def*5};
    state.p.def+=def;
    print('你直接穿上了它+'+def+'防御','ok');
  } else {
    state.p.armorBag.push({name,slot,def,price:def*5});
    print('新的'+name+'放进了护甲包（营地「穿戴护甲」可换装）','dim');
  }
  forgeArmorMatMenu(slot,[]);
}

function followerForgeMenu(){
  clearActs();
  print('定制随从装备 —— 铁匠 Lv.'+forgeLevel()+'（佣兵不接这活，他们自备家伙）','h');
  const o=[];
  if(state.p.knight)o.push(['为骑士打造（基础攻击+2 / 基础防御+1）',()=>followerForgePick('knight')]);
  if(state.p.companion)o.push(['为安普卢斯打造',()=>followerForgePick('comp')]);
  if(!o.length)print('没有随从在队','dim');
  o.push(['返回',gotoSmith]);
  choices(o); statusLine();
}
function followerForgePick(who){
  clearActs();
  const o=[
  ['武器（铁料×2，基础攻击+2，可锻造10次）',()=>doFollowerForge(who,'w')],
  ['护甲（铁料×3，基础防御+1，可锻造10次）',()=>doFollowerForge(who,'a')],
  ['返回',followerForgeMenu]];
  choices(o); statusLine();
}
function doFollowerForge(who,kind){
  const lv=forgeLevel();
  const fee=5+lv*3;
  const mat=kind==='w'?2:3;
  if(state.p.inv.铁料<mat){ print('铁料不够','bad'); followerForgePick(who); return; }
  if(state.p.gold<fee){ print('加工费'+fee+'铜币钱不够','bad'); followerForgePick(who); return; }
  const f= who==='knight'?state.p.knight:state.p.companion;
  if(kind==='w'){
    if((f.fw||0)>=10){ print(f.name+'的武器已经锻到顶了','dim'); followerForgePick(who); return; }
    if(state.p.inv.铁料<mat){ print('铁料不够','bad'); followerForgePick(who); return; }
    if(state.p.gold<fee){ print('加工费'+fee+'铜币钱不够','bad'); followerForgePick(who); return; }
    state.p.inv.铁料-=mat; state.p.gold-=fee;
    state.p.forge.count++;
    gainCraftXP('锻造',3);
    f.fw=(f.fw||0)+1;
    f.atk=(f.atk!==undefined?f.atk:(f.atk0||10))+2;
    print('打好了'+f.name+'的武器更精了（基础攻击+2，现'+f.atk+'）','ok');
  } else {
    if((f.fa||0)>=10){ print(f.name+'的甲胄已经锻到顶了','dim'); followerForgePick(who); return; }
    if(state.p.inv.铁料<mat){ print('铁料不够','bad'); followerForgePick(who); return; }
    if(state.p.gold<fee){ print('加工费'+fee+'铜币钱不够','bad'); followerForgePick(who); return; }
    state.p.inv.铁料-=mat; state.p.gold-=fee;
    state.p.forge.count++;
    gainCraftXP('锻造',3);
    f.fa=(f.fa||0)+1;
    f.def=(f.def!==undefined?f.def:(f.def0||2))+1;
    f.a=Math.min(3,Math.floor(f.def/4));
    print('打好了'+f.name+'的甲胄更厚了（基础防御+1，现'+f.def+'，挡刀层→'+f.a+'）','ok');
  }
  followerForgePick(who);
}

function weaponTypeOf(w){ return (w&&w.type)?w.type:'剑'; }
/* 每把武器的战技（锚定 12-武器技能系统.md，每类型一招） */
/* ---------- 武器熟练度（12-武器技能系统.md）：按类型累计使用次数，Lv1-3解锁战技，Lv4/5加成 ---------- */
function wprofUse(type){ const p=state.p.wprof||(state.p.wprof={}); return p[type]||0; }
function wprofLv(type){
  const u=wprofUse(type);
  if(u>=300)return 5; if(u>=150)return 4; if(u>=80)return 3; if(u>=30)return 2; return 1;
}
function gainWprof(type){
  const p=state.p.wprof||(state.p.wprof={});
  const before=wprofLv(type);
  p[type]=(p[type]||0)+1;
  const after=wprofLv(type);
  if(after>before)print('你的'+type+'熟练度提升——Lv.'+after+'！','hint');
}
function wprofDmgPct(type){ const lv=wprofLv(type); if(lv>=5)return 1.2; if(lv>=4)return 1.1; return 1; }
function wprofSta(type){ return wprofLv(type)>=5?0.9:1; }
/* 匕首熟练度连击：熟练度越高，每回合追加攻击的次数与概率越高（Lv1只能打一次） */
function daggerExtraHits(){
  const lv=wprofLv('匕首');
  if(lv<2)return 0;
  const r=Math.random();
  if(lv>=5){ if(r<0.10)return 3; if(r<0.35)return 2; if(r<0.65)return 1; return 0; }
  if(lv>=4){ if(r<0.15)return 2; if(r<0.45)return 1; return 0; }
  if(lv>=3){ if(r<0.08)return 2; if(r<0.28)return 1; return 0; }
  if(r<0.20)return 1; return 0;
}

function comboChain(){
  const start=weaponTypeOf(state.p.weapon);
  const used=new Set();
  const allies=[];
  const arm=state.p.armguard?4:0;
  state.p.mercs.forEach(m=>allies.push({name:m.name,type:m.weapon,d:4+(m.tn||0)+arm}));
  if(state.p.knight)allies.push({name:'落魄骑士',type:'大剑',d:10+arm});
  if(state.p.companion)allies.push({name:state.p.companion.name,type:'剑',d:(state.p.companion.d||6)+arm});
  const seq=[];
  let cur=start, guard=0;
  while(seq.length<3 && guard++<10){
    const next=PROT_CHAIN[cur]||[];
    const a=allies.find(x=>!used.has(x.name)&&next.includes(x.type));
    if(!a)break;
    used.add(a.name); seq.push(a); cur=a.type;
  }
  return seq;
}

/* ---------- 战斗 ---------- */
function playerAtk(){
  let a=state.p.atk+(state.p.weapon?state.p.weapon.atk:0)+(state.p.pow||0)+accFx('atk')+(state.p.buffSys&&state.p.buffSys.攻.v?state.p.buffSys.攻.v:0);
  if(state.p.buff.保养>0)a=Math.round(a*1.3);
  if(state.p.buff.磨石>0)a=Math.round(a*1.1);
  if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('锋利'))a=Math.round(a*1.05);
  if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('异纹'))a=Math.round(a*1.08);
  if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('精准'))a=Math.round(a*1.1);
  if(accFx('atkPct'))a=Math.round(a*(1+accFx('atkPct')));
  if(state.p.armguard)a=Math.round(a*1.25); // 裂纹的臂甲：武器法伤增伤+25%
  if(state.p.flags.tyrfing){ a=Math.round(a*1.25)+8; } // 提尔锋融入体内（天伤道）：伤害+25%，攻击+8
  const stFx=stanceApplies()?STANCE_FX[state.p.stance]:null;
  if(stFx&&stFx.atk)a=Math.round(a*stFx.atk); // 架势修正（重武器架势或剑的攻防架势）
  a=Math.round(a*wprofDmgPct(weaponTypeOf(state.p.weapon))); // 熟练度 Lv4+10% / Lv5+20%
  a+=leaderDmg(); // 领队加成（身先士卒/军心/狮心王座）
  if(state.p.crown>0)a=Math.round(a*1.3); // DYO「以荣冠加冕无名之身」：荣冠3回合攻击+30%
  a-=(state.p.curseLas||0); // 拉斯普提的妖僧诅咒（本场攻击-2/层）
  if(state.p.lasTaunt>0)a=Math.round(a*(1-0.05*state.p.lasTaunt)); // 烦躁：攻击-5%/层
  return a;
}
function hitDmg(atk,mult,def){ return Math.max(1,Math.round(atk*mult-def)); }
/* 单挑·轩辕十四：荣耀之锁——正面近战伤害-35%，每击削他1层剑意 */
function duelGloryReduce(dmg){
  const en=ctx&&ctx.en;
  if(en&&en.name==='轩辕十四·单挑'&&!en.phase2){
    dmg=Math.round(dmg*0.65);
    if(!en.gloryNoted){ en.gloryNoted=true; print('荣耀之锁——他不能拒绝正面交锋，只能硬接（你的近战伤害-35%）','hint'); }
    en.swordWill=Math.max(0,(en.swordWill||0)-1);
  }
  return dmg;
}

function spellMenu(caster){
  clearActs();
  if(caster)print(caster.name+'的法术（MP '+(caster.mp||0)+'/'+(caster.maxMp||0)+'）','hint');
  const o=casterSpells(caster).map(k=>{

function castRegulusSpell(key,r){
  const s=REGULUS_SPELL_DEFS[key];
  if(s.healPct){ const h=Math.round(r.maxHp*s.healPct); r.hp=Math.min(r.maxHp,r.hp+h); print(r.name+'狮心鼓动——血液像鼓点一样奔流 +'+h+'生命','ok'); }
  if(s.fort){ r.fort=s.fort; print(r.name+'身披星辉甲胄——本场所受伤害-'+s.fort,'ok'); }
  if(s.pow){ r.pow=s.pow; print(r.name+'狮力灌入四肢——本场攻击+'+s.pow,'ok'); }
  if(s.stunC){ r.stunC=s.stunC; print(r.name+'睁开了猎星之眼——命中15%震住目标','ok'); }
  if(s.regen){ r.regen=s.regen; print(r.name+'踏上了星坠步——每回合回复'+s.regen+'生命','ok'); }
  if(s.roar){ const e=ctx.en; e.stunned=true; e.fear=3; print(r.name+'发出狮吼——'+e.name+'被震住了，攻击-3！','hint'); }
}
function castSpell(key,caster){
  const s=SPELL_DEFS[key]||REGULUS_SPELL_DEFS[key];
  if(!s||!ctx){ renderCombat(); return; }
  const who=caster||null; // null=主角
  const mp=who?who.mp||0:state.p.mp;
  if(mp<s.cost){ print('法力不足','bad'); renderCombat(); return; }
  if(who)who.mp-=s.cost; else state.p.mp-=s.cost;
  if(REGULUS_SPELL_DEFS[key]){ castRegulusSpell(key,who); }
  else if(s.fort||s.pow){
    if(s.fort){ if(who)who.fort=s.fort; else state.p.fort=s.fort; print((who?who.name:'你')+'周身土石护体——本场所受伤害-'+s.fort,'ok'); }
    if(s.pow){ if(who)who.pow=s.pow; else state.p.pow=s.pow; print((who?who.name:'你')+'魔力涌入四肢——本场攻击+'+s.pow,'ok'); }
  }
  else if(s.fear||s.atkDown||s.defDown||s.plague||s.illusion||s.soothe||s.luck){
    const e=ctx.en;
    if(s.fear)e.fear=s.fear;
    if(s.atkDown)e.atkDown=s.atkDown;
    if(s.defDown)e.defDown=s.defDown;
    if(s.plague)e.plague=s.plague;
    if(s.luck)e.luckDown=true;
    if(s.illusion){ e.stunned=true; print('幻影在它眼前晃动——它挥空了，下回合无法出手','hint'); }
    if(s.soothe){ state.p.buff.流血=0; state.p.buff.硬直=0; state.p.hp=Math.min(state.p.maxHp,state.p.hp+15); print('幻觉抚平了伤痛——流血与硬直消散，+15生命','ok'); }
    print((who?who.name:'你')+'施放'+s.name+'——'+e.name+'被缠住了','hint');
  }
  else {
  let base=0, h=0;
  if(s.heal){
    h=Math.max(1,Math.round(s.heal*0.25)); // 法术效率整体为期望值的四分之一
    if(who&&who.name==='安普提斯'){ const m=ampthisMult(SPELL_SCHOOL[key]||''); h*=m; print('妖雾翻涌——她的法术比寻常法师强了'+m+'倍','hint'); }
  } else if(who){
    base=allySpellPower(key,who).dmg;
  } else {
    const staff=(state.p.weapon&&state.p.weapon.type==='法杖')?state.p.weapon.atk:0;
    const raw=Math.max(1,(s.dmg||0)+Math.round(state.p.level*(s.scale||1))+staff);
    const full=state.p.armguard?Math.round(raw*1.25):raw; // 裂纹的臂甲：法伤+25%
    // 法术效率整体降至期望值的四分之一（另有安排）
    base=Math.max(1,Math.round(full*0.25));
  }
  if(s.heal){
    if(s.aoeHeal){
      [state.p].concat(allies()).forEach(x=>{ if(x.maxHp&&x.hp>0)x.hp=Math.min(x.maxHp,x.hp+h); });
      print((who?who.name:'你')+'念动'+s.name+'——温流环过全队，每人+'+h+'生命','ok');
    } else if(who){
      const t=mostWounded();
      t.hp=Math.min(t.maxHp,t.hp+h);
      print(who.name+'念动'+s.name+'——微光落在'+(t===state.p?'你':t.name)+'身上，+'+h+'生命','ok');
    } else {
      state.p.hp=Math.min(state.p.maxHp,state.p.hp+h);
      print('你念动'+s.name+'——微光覆身，+'+h+'生命','ok');
      if(s.cleanse){ state.p.buff.流血=0; state.p.buff.硬直=0; print('净光洗过全身——流血与硬直都散了','ok'); }
    }
  } else {
    const targets=(s.aoe&&ctx.enemies&&ctx.enemies.length)?ctx.enemies.filter(e=>e.hp>0):[ctx.en];
    print((who?who.name:'你')+'咏唱'+s.name+'——','hint');
    let total=0;
    targets.forEach(e=>{
      let dmg=Math.max(1,base-Math.round(e.def/2)); // 法术半穿甲
      if(s.fire&&e.惧火){ dmg=Math.round(dmg*2); print('火舌遇惧火者，伤害翻倍！','hint'); }
      if(!who&&ctx.spellBoost){ dmg=Math.round(dmg*ctx.spellBoost); print('共鸣爆发——法术伤害×'+ctx.spellBoost+'！','hint'); }
      if(!who&&heavyStanceSet(weaponTypeOf(state.p.weapon))&&state.p.stance==='魔导势')dmg=Math.round(dmg*1.3); // 魔导势：法术+30%
      const spW=state.p.weapon&&state.p.weapon.spellPct;
      if(spW&&!who){ // 杖身材质的学派偏向
        let m=spW.all||1;
        const sc=SPELL_SCHOOL[key]||'元素';
        if(spW[sc])m*=spW[sc];
        if(spW['neg_'+sc])m*=spW['neg_'+sc];
        if(m!==1)dmg=Math.round(dmg*m);
      }
      if(e.name==='轩辕十四·单挑'&&!e.phase2){ dmg=Math.round(dmg*1.8); ctx.regulusNoP2=true; if(!e.glorySpell){ e.glorySpell=true; print('法术落在他身上——他不肯转身，但变了脸色（法术×1.8，他不会进入二阶段了）','hint'); } }
      if(s.fire&&e.name==='妖僧·拉斯普提'&&!e.惧火){ dmg=Math.round(dmg*1.3); print('火焰灼烧妖僧——伤害+30%！','hint'); }
      e.hp-=dmg;
      total+=dmg;
      if(!who)ctx.damagedEnemy=true;
      print(s.name+'击中'+e.name+' −'+dmg,'hit');
      if(s.bleed){ e.bleed=(e.bleed||0)+s.bleed; print('目标血流不止','hit'); }
      if(s.stun){ e.stunned=true; print('目标被震住了！','hint'); }
      if(s.stunChance&&Math.random()<s.stunChance){ e.stunned=true; print('目标被冻住了！','hint'); }
    });
    if(s.drain&&total>0){
      const back=Math.max(1,Math.round(total*s.drain));
      const t=who||state.p;
      t.hp=Math.min(t.maxHp,t.hp+back);
      print((who?who.name:'你')+'汲取生命 +'+back,'ok');
    }
  }
  }
  while(ctx&&ctx.en&&ctx.en.hp<=0){ if(!enemyDown())return; }
  if(!ctx)return;
  if(ctx.spellBoost)ctx.spellBoost=0; // 共鸣只强化一发
  lionJoinCheck();
  if(allies().length||(ctx.lionJoined&&!ctx.lionFled)) nextAllyTurn(0);
  else { enemyTurn(); afterEnemy(); }
}

/* 等级与经验：上限1000级
   1-200级：升级所需=等级×80；200级之后每升一级所需经验按指数增长（每级+1%）
   成长曲线：1-119平缓 → 120-200黄金期（加成最猛）→ 201-1000加成递减 */
function xpNeed(){
  const l=state.p.level||1;
  if(l<=200)return l*80;
  return Math.round(l*80*Math.pow(1.01,l-200));
}
function statsForLevel(n){
  let hp=110, atk=12, mp=50, sta=100;
  for(let l=2;l<=n;l++){
    if(l<=119){
      hp+=10+Math.floor(l/10)*2;
      atk+=3+((l===15||l===30||l===50||l===70)?1:0);
      mp+=5+Math.floor(l/12);
      sta+=5+Math.floor(l/10);
    } else if(l<=200){
      // 黄金期：120-200级，加成最猛
      hp+=16+Math.floor(l/10)*2;
      atk+=4;
      mp+=8+Math.floor(l/12);
      sta+=8+Math.floor(l/10);
    } else {
      // 200级之后：加成递减
      hp+=Math.max(2,8-Math.floor((l-200)/100));
      atk+=2;
      mp+=Math.max(1,4-Math.floor((l-200)/150));
      sta+=Math.max(1,4-Math.floor((l-200)/150));
    }
  }
  return {maxHp:hp,atk,maxMp:mp,maxSta:sta};
}
function gainXp(n){
  if(!n)return;
  state.p.xp=(state.p.xp||0)+n;
  print('获得 '+n+' 经验','dim');
  let leveled=false;
  while(state.p.xp>=xpNeed() && state.p.level<1000){
    state.p.xp-=xpNeed();
    state.p.level++;
    const s=statsForLevel(state.p.level);
    const arm=state.p.armguard?100:0;
    const ab=state.p.accBonus||{hp:0,mp:0,sta:0};
    const hpGain=(s.maxHp+arm+ab.hp)-state.p.maxHp;
    const mpGain=s.maxMp+ab.mp-state.p.maxMp;
    const staGain=s.maxSta+ab.sta-state.p.maxSta;
    const atkGain=s.atk-state.p.atk;
    state.p.maxHp=s.maxHp+arm+ab.hp; state.p.hp=Math.min(state.p.maxHp,state.p.hp+Math.max(0,hpGain));
    state.p.maxMp=s.maxMp+ab.mp; state.p.mp=Math.min(state.p.maxMp,state.p.mp+Math.max(0,mpGain));
    state.p.maxSta=s.maxSta+ab.sta; state.p.sta=Math.min(state.p.maxSta,state.p.sta+Math.max(0,staGain));
    state.p.atk=s.atk;
    print('等级提升至 '+state.p.level+'！生命上限+'+hpGain+'（同时回复'+Math.max(0,hpGain)+'生命）· 法术上限+'+mpGain+' · 体力上限+'+staGain+' · 攻击伤害+'+atkGain,'ok');
    if(state.p.level===15||state.p.level===30||state.p.level===50||state.p.level===70)print('你在刀口上滚了这么多年，出手比从前更狠——攻击额外+1','hint');
    if(state.p.level===120)print('120级——你摸到了凡人的天花板，往后每一级都沉甸甸的，也是最猛的','hint');
    if(state.p.level===201)print('201级——天花板之上：经验翻着倍涨，加成却越来越薄','hint');
    leveled=true;
  }
  if(leveled)statusLine();
}

function prepEnemy(en){
  en.hp=Math.round(en.hp*1.6); en.maxHp=en.hp; en.atk=Math.round(en.atk*1.4);
  // 精英强化：中后期一次性精英/首领（Lv20+，不含传奇骑士与巅峰级）生命+25% 攻击+15% 经验+30%
  const EL=ELITE_LOOT[en.name];
  if(EL&&EL.c===1&&(en.lv||0)>=20&&!ELITE_PINNACLE[en.name]){ en.hp=Math.round(en.hp*1.25); en.maxHp=en.hp; en.atk=Math.round(en.atk*1.15); en.xp=Math.round((en.xp||0)*1.3); }
  // 第一章BOSS血量减半（太难打了——抵消上面的膨胀，回到设计值）
  if((EL&&EL.c===1)||BOSS_HP_HALF[en.name]){ en.hp=Math.round(en.hp*0.5); en.maxHp=en.hp; }
  en.狂暴=false; en.stunned=false; en.physNoted=false; en.bleed=0; en.stolen=0; en.atkBoost=0; en.fear=0;
  en.atkDown=0; en.defDown=0; en.plague=0; en.luckDown=false; en.不愈=false; // 控场法术的减益字段
  en.high=!!HIGH_FOE[en.name]; // 高危之敌：身上带着北边的密令
  en.亡灵=!!{骷髅兵:1,送葬人:1,遗迹守卫者:1,掘墓人:1,腐尸:1,'苍白骑士·塞拉斯':1,墓窟守卫:1,渡河骨龙:1,赤河溺魂:1,棺中圣女:1,战场游魂:1,'空甲骑士·奥古斯丁':1,无头战魂:1,战旗亡魂:1,荒原骨龙:1,北境战兵:1,无名游魂:1,锈甲游魂:1,古战场龙:1}[en.name];
  en.骑类=!!(en.name&&en.name.indexOf('骑士')>=0);
  return en;
}
/* ---------- 敌阵系统：成群敌人同场协作（号令/同型连携/盾阵） ---------- */
function squadBoost(en){
  const es=ctx.enemies||[];
  let b=0; const notes=[];
  if(es.length>1){
    if(ctx.opts.squadLeader&&es.some(e=>e!==en&&e.hp>0&&e.name===ctx.opts.squadLeader)){ b+=3; notes.push('号令（'+ctx.opts.squadLeader+'）·全队攻击+3'); }
    const same=es.filter(e=>e.hp>0&&e.name===en.name).length;
    if(same>=2){ b+=(same-1)*2; notes.push('同型连携·'+en.name+'攻击+'+(same-1)*2); }
  }
  return {b,notes};
}
function squadDefBonus(en){
  const es=ctx.enemies||[];
  if(es.length<2)return 0;
  return es.some(e=>e!==en&&e.hp>0&&SHIELD_NAMES[e.name])?3:0;
}
function enemyDown(){
  if(!ctx||!ctx.en)return false;
  if(typeof ctx.en.hp!=='number'||!isFinite(ctx.en.hp))ctx.en.hp=0; // 血条异常自修复（曾因战技mult缺失变NaN）
  if(ctx.en.hp>0)return true;
  if(ctx.en.name==='轩辕十四·单挑'&&ctx.en.unyield>0){
    ctx.en.hp=1; ctx.en.unyield--;
    print('不屈！他锁住了最后一口气（还剩'+ctx.en.unyield+'回合）','hint');
    return true;
  }
  print(ctx.en.name+' 倒下了','ok');
  if(ctx.defeated)ctx.defeated.push(ctx.en);
  const es=ctx.enemies;
  if(es&&es.length){
    const i=es.indexOf(ctx.en);
    if(i>=0)es.splice(i,1);
    const alive=es.find(e=>e.hp>0);
    if(alive){ ctx.en=alive; print(alive.name+'补了上来——敌阵还在！','hint'); return true; }
  }
  winCombat();
  return false;
}
function controlAlly(){
  const a=state.p.control?findAlly(state.p.control):null;
  if(state.p.control&&(!a||a.hp<=0))state.p.control=null; // 操控对象已不在队或倒下
  return (a&&a.hp>0)?a:null;
}
function startCombat(en,opts){
  if(opts.squad&&opts.squad.length){
    const es=opts.squad.map(e=>prepEnemy({...e}));
    ctx={enemies:es,en:es[0],opts,cycle:0,lastDef:null,exposed:false,skillCd:0,defeated:[],control:controlAlly(),damagedEnemy:false};
    hr(); print('⚔ '+en.name+' 与他的同伴','enemy');
    es.forEach(e=>print(e.name+'（Lv.'+(e.lv||'?')+'）','dim'));
    print(en.intro,'dim');
    print('敌方'+es.length+'人结成阵势，互相照应——先杀哪个？','hint');
  } else {
    prepEnemy(en);
    ctx={en,opts,cycle:0,lastDef:null,exposed:false,skillCd:0,defeated:[],control:controlAlly(),damagedEnemy:false};
    hr(); print('⚔ '+en.name,'enemy'); print(en.intro,'dim');
  }
  if(opts.twoLions)ctx.lionJoined=!!state.p.flags.lionTrialJoined;
  // 战斗内状态重置：加冕/拉斯普提诅咒与嘲讽/轩辕十四的兽形与剑意
  state.p.crown=0; state.p.curseLas=0; state.p.lasTaunt=0;
  if(state.p.regulus){ const rr=state.p.regulus; rr.lionForm=false; rr.lionRounds=0; rr.lionInvuln=0; rr.swordWill=0; rr.unyield=0; rr.unyieldUsed=false; rr.crownCd=0; }
  // 传奇武器开局自动技：佛拉格拉克（应答之剑）自动先攻 / 布里欧纳克（五光魔枪）自动齐射
  const lw=state.p.weapon;
  if(lw&&lw.fx&&lw.fx.includes('自动')){
    ctx.damagedEnemy=true;
    const d=Math.max(1,playerAtk()-Math.round(Math.max(0,ctx.en.def-(ctx.en.defDown||0))));
    ctx.en.hp-=d;
    print('佛拉格拉克自己从腰间飞了出去——'+ctx.en.name+' −'+d,'hit');
    if(ctx.en.hp<=0){ if(!enemyDown())return; }
  }
  if(ctx&&lw&&lw.fx&&lw.fx.includes('五光')){
    ctx.damagedEnemy=true;
    const haveDrug=(state.p.inv.罂粟安眠药||0)>0;
    const rays=haveDrug?5:4;
    if(haveDrug){ state.p.inv.罂粟安眠药--; print('你把罂粟安眠药抹在枪身上——它安静下来，五道光飞出','hint'); }
    else print('没有罂粟安眠药——魔枪狂躁，四道光扑向敌人，还有一道会扑向你！','bad');
    const es=(ctx.enemies&&ctx.enemies.length)?ctx.enemies.filter(e=>e.hp>0):[ctx.en];
    for(let i=0;i<rays;i++){
      const t=es[i%es.length];
      const d=Math.max(1,Math.round(playerAtk()*0.4)-Math.round(Math.max(0,t.def-(t.defDown||0))/2));
      t.hp-=d;
      print('布里欧纳克的光——'+t.name+' −'+d,'hit');
      if(ctx.en===t&&t.hp<=0){ if(!enemyDown())return; }
      else if(t.hp<=0&&ctx.enemies){ t.hp=0; }
    }
    if(!haveDrug&&ctx){ const sd=Math.max(1,Math.round(state.p.maxHp*0.15)); state.p.hp=Math.max(1,state.p.hp-sd); print('狂躁的光擦过你 −'+sd,'bad'); }
  }
  // 每场战斗开始时，身体强化法术与队友强化全部重新开始
  state.p.pow=0; state.p.fort=0; state.p.counter=0;
  allies().forEach(a=>{ a.pow=0; a.fort=0; a.regen=0; a.stunC=0; });
  if(opts.twoLions&&ctx.lionJoined)print('轩辕十四已在你身侧——狮吼压过双狮的咆哮','hint');
  if(state.p.regulus){
    const h=Math.max(1,Math.round(state.p.maxHp*0.1));
    state.p.hp=Math.min(state.p.maxHp,state.p.hp+h);
    allies().forEach(a=>{ if(a.maxHp)a.hp=Math.min(a.maxHp,a.hp+Math.round(a.maxHp*0.1)); });
    print('轩辕十四的狮心鼓荡——全队恢复10%生命','ok');
  }
  renderCombat();
}
function renderCombat(){
  clearActs();
  if(ctx.enemies&&ctx.enemies.length>1){
    ctx.enemies.forEach(e=>{
      if(e.hp<=0)return;
      const tag=e===ctx.en?' ←目标':'';
      const leader=ctx.opts.squadLeader===e.name?' [号令]':'';

    });

  }

  if(ctx.exposed) print('它硬直了！腹部暴露——弱点','hint');
  if(ctx.en.bellyAlways) print('它的弱点在腹部——壳遮不住的地方','hint');
  print('你：生命 '+state.p.hp+'/'+state.p.maxHp+' · 体力 '+state.p.sta+(state.p.buff.流血>0?' · 流血'+state.p.buff.流血+'层':''));
  if(ctx.control)print('当前操控：'+ctx.control.name+'（生命 '+ctx.control.hp+'/'+ctx.control.maxHp+' · 法力 '+ctx.control.mp+'/'+ctx.control.maxMp+'）· 由'+ctx.control.name+'主攻，攻击不耗体力，可用其战技与法术','hint');
  if(ctx.cycle===0) print('体力消耗：攻击10 · 连携12 · 战技按武器 · 格挡5 · 闪避10（体力<10时伤害-40%）','dim');
  const o=[];
  if(!ctx.opts.solo){
  // 队友指挥
  allies().forEach(a=>{
    print(a.name+'：'+a.hp+'/'+a.maxHp+(a.guard?'（防御中）':'')+(ctx.control===a?'（操控中）':''),'dim');
    o.push(['指挥·'+a.name+'：'+(a.guard?'攻击':'防御'),()=>{ a.guard=!a.guard; print(a.name+(a.guard?'举起武器戒备，伤害减半但不再出手':'重新投入进攻'),'dim'); renderCombat(); }]);
  });
  // 切换操控角色（主角与全队成员，含佣兵）——选择会记到战斗外
  {
    const roster=[null].concat(allies().filter(a=>!a.fled&&a.hp>0));

    const nxt=roster[(cur+1)%roster.length];
    o.push(['切换操控→'+(nxt?nxt.name:'你'),()=>{ ctx.control=nxt; state.p.control=nxt?nxt.name:null; print(nxt?('现在由'+nxt.name+'主攻'):'你亲自出手','dim'); renderCombat(); }]);
  }
  }
  o.push(['攻击·正面 (×0.8)',()=>playerAct('正面')]);
  o.push(['攻击·侧面 (×1.3)',()=>playerAct('侧面')]);
  if(ctx.enemies&&ctx.enemies.length>1){
    const alive=ctx.enemies.filter(e=>e.hp>0);
    const idx=alive.indexOf(ctx.en);
    const nxt=alive[(idx+1)%alive.length];
    o.push(['切换目标→'+nxt.name,()=>{ ctx.en=nxt; print('你盯上了'+nxt.name,'dim'); renderCombat(); }]);
    if(!ctx.control&&state.p.sta>=12) o.push(['横扫（全体×0.6，耗12体力）',()=>playerAct('横扫')]);
  }
  if(ctx.exposed) o.push(['刺腹部 (×2.0)',()=>playerAct('腹部')]);
  else if(ctx.en.bellyAlways) o.push(['刺腹部（弱点）',()=>playerAct('腹部')]);
  if(!ctx.control){
    const adds=comboChain();
    if(adds.length && state.p.sta>=12) o.push(['连携·'+adds.length+'人（+15%/人）',()=>playerAct('连携')]);
    const wt2=weaponTypeOf(state.p.weapon);
    const pl=wprofLv(wt2);
    const stSet=heavyStanceSet(wt2);
    if(stSet){
      const set=HEAVY_STANCES[wt2];
      const cur=(state.p.stance&&STANCE_FX[state.p.stance]&&set.includes(state.p.stance))?state.p.stance:set[0];
      const nxt=set[(set.indexOf(cur)+1)%set.length];
      o.push(['架势：'+cur+'（'+STANCE_FX[cur].desc+'）→ 切换',()=>{ state.p.stance=nxt; print('你切换架势——'+nxt+'：'+STANCE_FX[nxt].desc,'dim'); renderCombat(); }]);
    }
    const skills=WSKILLS[wt2]||[];
    for(let i=0;i<skills.length;i++){
      const sk=skills[i];
      if(i+1>pl)continue; // 熟练度门槛：Lv1/2/3 各解锁一招
      const staCost=Math.round(sk.cost*wprofSta(wt2));
      const afford=(!sk.mp||state.p.mp>=sk.mp)&&state.p.sta>=staCost&&!ctx.skillCd;
      if(afford)o.push(['战技·'+sk.n+'（'+(sk.mult?('×'+sk.mult+(sk.aoe?'·整排':sk.hits?'·'+sk.hits+'连击':'')):sk.stance?'切换':sk.counter?'反击':sk.spellBoost?'共鸣':'')+((sk.stance||sk.counter||sk.spellBoost)?'':'，CD2')+'）',()=>playerAct('战技',i)]);
    }
    if(ctx.skillCd&&pl>=1)print('战技冷却：还剩 '+ctx.skillCd+' 回合','dim');
    if(state.p.weapon&&state.p.weapon.name==='小镰刀'){
      if(!ctx.skillCd&&state.p.sta>=5) o.push(['战技·尖刺打击（弱点直击·半血上×2.2/半血下×3.0·僵直2回合·耗5体力）',()=>playerAct('镰技')]);
      else if(ctx.skillCd&&pl>=1) print('战技冷却：还剩 '+ctx.skillCd+' 回合','dim');
    }
    if(stSet&&pl>=1){
      const set=HEAVY_STANCES[wt2];
      const add=STANCE_ADD[wt2][state.p.stance||set[0]];
      if(add&&state.p.sta>=add.cost&&!ctx.skillCd)o.push(['架势战技·'+add.n+'（'+(add.mult?'×'+add.mult:'反击')+'，CD2）',()=>playerAct('架势技')]);
    }
    if(casterSpells(null).length) o.push(['法术（MP '+state.p.mp+'）',spellMenu]);
  } else {
    // 操控队友：他也能用自己的战技与法术
    const c=ctx.control;
    const sk=allySkill(c);
    if(sk && !(c.skillCd>0)) o.push(['战技·'+sk.name+'（×'+sk.mult+'）',()=>playerAct('战技')]);
    else if(sk && c.skillCd>0) print('战技冷却：还剩 '+c.skillCd+' 回合','dim');
    if(casterSpells(c).length) o.push(['法术（MP '+(c.mp||0)+'）',()=>spellMenu(c)]);
  }
  o.push(['格挡 (减伤50%)',()=>playerAct('格挡')]);
  o.push(['闪避 (60%)',()=>playerAct('闪避')]);
  o.push(['道具',ctx.control?()=>playerAct('道具'):useItemMenu]);
  if(ctx.opts.canFlee) o.push(['逃跑',()=>playerAct('逃跑')]);
  choices(o);
  statusLine();
}
function enemyHdr(){ return ctx.en.name+' Lv.'+(ctx.en.lv||'?')+' — 生命 '+Math.max(0,ctx.en.hp)+'/'+ctx.en.maxHp+(ctx.en.狂暴?' [狂暴]':''); }

  if(state.p.inv.醒神草>0)o.push(['醒神草 ×'+state.p.inv.醒神草+'（+25体力）',()=>{state.p.inv.醒神草--;state.p.sta=Math.min(state.p.maxSta,state.p.sta+25);print('你嚼着醒神草+25体力','ok');renderCombat();}]);
  if(state.p.inv.盐渍肉>0)o.push(['盐渍肉 ×'+state.p.inv.盐渍肉+'（+30生命）',()=>{state.p.inv.盐渍肉--;state.p.hp=Math.min(state.p.maxHp,state.p.hp+30);print('你咽下盐渍肉+30生命','ok');renderCombat();}]);
  if(state.p.inv.除虱粉>0)o.push(['除虱粉 ×'+state.p.inv.除虱粉+'（对虱类10伤害）',throwLicePowder]);
  if(state.p.inv.烟幕弹>0)o.push(['烟幕弹 ×'+state.p.inv.烟幕弹+'（逃跑必定成功）',smokeFlee]);
  // 料理（烹饪系统）
  COOK_DEFS.forEach(r=>{ if(state.p.inv[r.name]>0)o.push([r.name+' ×'+state.p.inv[r.name]+'（'+r.desc+'）',()=>{ state.p.inv[r.name]--; applyFoodFx(r); renderCombat(); }]); });
  // 药剂（炼金系统）
  if(state.p.inv.生命药水>0)o.push(['生命药水 ×'+state.p.inv.生命药水+'（+40生命）',()=>{ state.p.inv.生命药水--; usePotion('生命药水'); renderCombat(); }]);
  if(state.p.inv.猛力药>0)o.push(['猛力药 ×'+state.p.inv.猛力药+'（3场内攻击+3）',()=>{ state.p.inv.猛力药--; usePotion('猛力药'); renderCombat(); }]);
  if(state.p.inv.硬皮药>0)o.push(['硬皮药 ×'+state.p.inv.硬皮药+'（3场内所受伤害-2）',()=>{ state.p.inv.硬皮药--; usePotion('硬皮药'); renderCombat(); }]);
  if(state.p.inv.迅捷药>0)o.push(['迅捷药 ×'+state.p.inv.迅捷药+'（3场内闪避+5%）',()=>{ state.p.inv.迅捷药--; usePotion('迅捷药'); renderCombat(); }]);
  if(state.p.inv.净化药>0)o.push(['净化药 ×'+state.p.inv.净化药+'（清除流血与硬直+10生命）',()=>{ state.p.inv.净化药--; usePotion('净化药'); renderCombat(); }]);
  if(state.p.inv.龙息火瓶>0)o.push(['龙息火瓶 ×'+state.p.inv.龙息火瓶+'（投掷15火伤，惧火者×2）',()=>{ state.p.inv.龙息火瓶--; let d=15; if(ctx.en.惧火){ d=Math.round(d*2); print('火瓶炸开——它怕这个！','hint'); } ctx.en.hp-=d; ctx.damagedEnemy=true; print('龙息火瓶砸在'+ctx.en.name+'身上 −'+d,'hit'); if(ctx.en.hp<=0){ if(!enemyDown())return; } renderCombat(); }]);
  if(state.p.inv.血盐涂毒>0)o.push(['血盐涂毒 ×'+state.p.inv.血盐涂毒+'（武器淬毒：5次命中附加流血）',()=>{ state.p.inv.血盐涂毒--; state.p.coat=(state.p.coat||0)+5; print('刃上淬了毒——接下来5次命中附加流血','hint'); renderCombat(); }]);
  if(!o.length)print('身上没有能用的','dim');
  o.push(['返回',renderCombat]);
  choices(o);
  statusLine();
}
function throwTorch(){
  state.p.inv.火把--;
  let d=8;
  if(ctx.en.惧火){
    d=Math.round(d*2);
    print('火光炸开——它怕这个！','hint');
    if(ctx.en.name==='铜铃女'){ ctx.en.stunned=true; print('铜铃女被火光震得僵住了！','hint'); }
  }
  ctx.en.hp-=d;
  ctx.damagedEnemy=true;
  print('火把砸在'+ctx.en.name+'身上 −'+d,'hit');
  if(ctx.en.hp<=0){ if(!enemyDown())return; }
  renderCombat();
}

function smokeFlee(){
  if(!state.p.inv.烟幕弹){ renderCombat(); return; }
  state.p.inv.烟幕弹--;
  const my=ctx;
  ctx=null; state.p.buff.流血=0; state.p.buff.硬直=0;
  print('你砸下烟幕弹白烟吞掉了一切','hint');
  if(state.p.flags.tyrfing&&my&&!my.damagedEnemy){ state.p.hp=Math.max(1,state.p.hp-Math.round(state.p.maxHp*0.2)); print('必杀之约——你没有伤人，提尔锋借你的手刺穿了自己！','bad'); }
  if(my&&my.opts&&my.opts.onFlee){ my.opts.onFlee(); }
  else backToRoad();
}
function applyWeaponFx(en){
  const fx=state.p.weapon&&state.p.weapon.fx;
  if(fx){
    if(fx.includes('血腥')||fx.includes('剧毒')){
      en.bleed=(en.bleed||0)+2;
      print('目标血流不止','hit');
    }
    if(fx.includes('汲血')){
      state.p.hp=Math.min(state.p.maxHp,state.p.hp+2);
      print('汲血：你回复2生命','ok');
    }
    if(fx.includes('泪蚀')&&Math.random()<0.15){
      en.bleed=(en.bleed||0)+1;
      print('泪蚀：泪痕渗进伤口（流血+1）','hit');
    }
    if(fx.includes('霜刃')&&Math.random()<0.15){
      en.stunned=true;
      print('霜刃：目标被冻住了！','hint');
    }
    const stunChance=(fx.includes('哀鸣')?0.15:0)+(fx.includes('尘封')?0.15:0)+(fx.includes('缠丝')?0.1:0);
    if(stunChance&&Math.random()<stunChance){
      en.stunned=true;
      print('目标被震住了！','hint');
    }
  }
  // 饰品之力与血盐涂毒（即使武器没有词条也生效）
  const ls=accFx('lifesteal');
  if(ls){ state.p.hp=Math.min(state.p.maxHp,state.p.hp+ls); print('饰品汲血——回复'+ls+'生命','ok'); }
  const bc=accFx('bleedC');
  if(bc&&Math.random()<bc){ en.bleed=(en.bleed||0)+1; print('饰品之力撕开伤口（流血+1）','hit'); }
  const sc=accFx('stunC');
  if(sc&&Math.random()<sc){ en.stunned=true; print('饰品之力——目标被震住了！','hint'); }
  if(state.p.coat&&state.p.coat>0){ state.p.coat--; en.bleed=(en.bleed||0)+1; print('血盐涂毒渗入伤口（流血+1，剩'+state.p.coat+'次）','hit'); }
  if(fx&&fx.includes('不愈')){ en.bleed=(en.bleed||0)+1; en.不愈=true; print('佛拉格拉克的伤口不会愈合——流血不止','hit'); }
}
function playerAct(kind,idx){
  const my=ctx, en=my.en;
  my.lastDef=kind;
  const ctrl=my.control;
  if(ctrl){
    // 操控队友（含佣兵）：以其属性主攻，攻击不耗体力
    if(kind==='道具'){ allyUseItem(ctrl); }
    else if(kind==='正面'||kind==='侧面'||kind==='腹部'){
      const mult = kind==='正面' ? 0.8 : kind==='侧面' ? 1.3 : 2.0;
      let d=allyFullAtk(ctrl);
      d=Math.max(1,Math.round(d*mult)-Math.round(Math.max(0,en.def-(en.defDown||0))/2));
      if(en.physRes){ if(!en.physNoted){ en.physNoted=true; print('它的身体对物理攻击有抗性（伤害减半）','hint'); } d=Math.round(d*en.physRes); }
      if(en.blocked){ d=Math.max(1,Math.round(d*0.5)); print(en.name+'格挡了！伤害减半','def'); en.blocked=false; }
      en.hp-=d;
      ctx.damagedEnemy=true;
      print(ctrl.name+'挥击'+en.name+' −'+d+'（'+kind+'）','hit');
      if((ctrl.traits||[]).includes('狠辣')&&Math.random()<0.2){ en.bleed=(en.bleed||0)+1; print(ctrl.name+'的攻击撕开了伤口','hit'); }
      if((ctrl.traits||[]).includes('利落')&&Math.random()<0.1){ en.hp-=d; print(ctrl.name+'追了一击！−'+d,'hit'); }
      allyHitFx(ctrl,en);
    }
    else if(kind==='战技'){
      const sk=allySkill(ctrl);
      if(!sk||(ctrl.skillCd>0)){ renderCombat(); return; }
      ctrl.skillCd=2;
      let def=Math.max(0,en.def+squadDefBonus(en)-(en.defDown||0));
      if(sk.pierce)def=Math.round(def*(1-sk.pierce));
      let d=hitDmg(allyFullAtk(ctrl),sk.mult||1,def); // 保险：mult缺失按1算
      if(en.blocked){ d=Math.max(1,Math.round(d*0.5)); print(en.name+'格挡了！伤害减半','def'); en.blocked=false; }
      en.hp-=d;
      ctx.damagedEnemy=true;
      print(ctrl.name+'战技——'+sk.name+'！','hint');
      print(en.name+' −'+d,'hit');
      if(sk.bleed){ en.bleed=(en.bleed||0)+2; print('目标血流不止','hit'); }
      if(sk.stun){ en.stunned=true; print('目标被震住了！','hint'); }
      if((ctrl.traits||[]).includes('狠辣')&&Math.random()<0.2){ en.bleed=(en.bleed||0)+1; print(ctrl.name+'的攻击撕开了伤口','hit'); }
      allyHitFx(ctrl,en);
    }
    else if(kind==='格挡'){ ctrl.guard=true; print(ctrl.name+'架起武器，准备格挡','dim'); }
    else if(kind==='闪避'){ ctrl.dodge=true; print(ctrl.name+'压低重心，准备闪避','dim'); }
    else if(kind==='逃跑'){
      const fxs=state.p.weapon&&state.p.weapon.fx;
      const rate=0.8+(fxs&&fxs.includes('迅影')?0.1:0)+accFx('fleePct');
      if(Math.random()<rate){ print('你们转身就跑它没有追','ok'); ctx=null; state.p.buff.流血=0; allies().forEach(a=>{ a.fled=false; a.act=null; a.guard=false; a.dodge=false; }); if(state.p.flags.tyrfing&&!my.damagedEnemy){ state.p.hp=Math.max(1,state.p.hp-Math.round(state.p.maxHp*0.2)); print('必杀之约——你没有伤人，提尔锋借你的手刺穿了自己！','bad'); } if(my.opts.onFlee)my.opts.onFlee(); return; }
      print('你们转身就跑——被扑了回来！','bad'); my.lastDef=null;
    }
    if(ctx!==my) return;
    if(en.hp<=0){ if(!enemyDown())return; }
    lionJoinCheck();
    nextAllyTurn(0);
    return;
  }
  if(kind==='横扫'){
    if(state.p.sta<12){ print('体力不够','dim'); renderCombat(); return; }
    state.p.sta=Math.max(0,state.p.sta-12);
    gainWprof(weaponTypeOf(state.p.weapon));
    const es=ctx.enemies&&ctx.enemies.length?ctx.enemies.filter(e=>e.hp>0):[en];
    print('你旋身横扫——','hint');
    es.forEach(e=>{
      let dmg=hitDmg(playerAtk(),0.6,Math.max(0,e.def+squadDefBonus(e)-(e.defDown||0)));
      dmg=duelGloryReduce(dmg);
      if(e.physRes){ if(!e.physNoted){ e.physNoted=true; print(e.name+'对物理攻击有抗性（伤害减半）','hint'); } dmg=Math.round(dmg*e.physRes); }
      e.hp-=dmg;
      ctx.damagedEnemy=true;
      print(e.name+' −'+dmg,'hit');
    });
    while(ctx&&ctx.en&&ctx.en.hp<=0){ if(!enemyDown())return; }
  } else if(kind==='镰技'){
    // 小镰刀·尖刺打击：半血上×2.2/半血下×3.0，弱点直击僵直两回合，CD1·耗5体力
    if(state.p.sta<5){ print('体力不够','bad'); renderCombat(); return; }
    if(ctx.skillCd){ renderCombat(); return; }
    state.p.sta=Math.max(0,state.p.sta-5);
    ctx.skillCd=1;
    gainWprof(weaponTypeOf(state.p.weapon));
    const mult=en.hp>=en.maxHp*0.5?2.2:3.0;
    let def=Math.max(0,en.def+squadDefBonus(en)-(en.defDown||0));
    let dmg=hitDmg(playerAtk(),mult,def);
    if(en.pos)dmg=Math.round(dmg*en.pos.belly);
    else if(en.exposed)dmg=Math.round(dmg*2);
    if(en.blocked){ dmg=Math.max(1,Math.round(dmg*0.5)); print(en.name+'格挡了！你的伤害减半','def'); en.blocked=false; }
    en.hp-=dmg;
    ctx.damagedEnemy=true;
    en.stunned=2; // 必定打击弱点——僵直两回合
    print('尖刺打击！——镰刃直取弱点（×'+mult.toFixed(1)+'）','hint');
    print(en.name+' −'+dmg+'，弱点受创，僵直两回合！','hit');
    applyWeaponFx(en);
  } else if(kind==='正面'||kind==='侧面'||kind==='腹部'||kind==='连携'||kind==='战技'||kind==='架势技'){
    let dmg=0;
    gainWprof(weaponTypeOf(state.p.weapon));
    if(kind==='连携'){
      const adds=comboChain();
      if(!adds.length){ renderCombat(); return; }
      state.p.sta=Math.max(0,state.p.sta-12);
      let total=playerAtk();
      const parts=['你（'+state.p.weapon.name+'）'];
      const chainBonus=(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('军令'))?0.2:0.15;
      adds.forEach((a,i)=>{ const d=Math.round(a.d*(1+chainBonus*(i+1))); total+=d; parts.push(a.name+'（'+a.type+'）'); });
      dmg=Math.max(1,Math.round(total-en.def-squadDefBonus(en)-(en.defDown||0)));
      dmg=duelGloryReduce(dmg);
      en.hp-=dmg;
      ctx.damagedEnemy=true;
      print('连携！'+parts.join(' → '),'hint');
      print(en.name+' −'+dmg+'（连携伤害，+'+(chainBonus*100)+'%/人）','hit');
      applyWeaponFx(en);
    } else if(kind==='战技'||kind==='架势技'){
      const wtS=weaponTypeOf(state.p.weapon);
      let sk=null;
      if(kind==='战技'){ sk=(WSKILLS[wtS]||[])[idx||0]; }
      else { const set=HEAVY_STANCES[wtS]||[]; sk=STANCE_ADD[wtS]?STANCE_ADD[wtS][state.p.stance||set[0]]:null; }
      if(!sk){ renderCombat(); return; }
      if(sk.stance){
        const set=HEAVY_STANCES[wtS];
        if(set){
          const cur=state.p.stance||set[0];
          const nxt=set[(set.indexOf(cur)+1)%set.length];
          state.p.stance=nxt;
          print('你切换架势——'+nxt+'：'+STANCE_FX[nxt].desc,'dim');
        } else {
          state.p.stance=state.p.stance==='攻击架势'?'防御架势':'攻击架势';
          print('你切换架势——'+state.p.stance+'：'+STANCE_FX[state.p.stance].desc,'dim');
        }
        state.p.sta=Math.max(0,state.p.sta-5);
      } else {
        let staCost=Math.round(sk.cost*wprofSta(wtS));
        if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('鲸骨'))staCost=Math.round(staCost*0.8); // 鲸骨：耐力-20%
        if(ctx.skillCd||state.p.sta<staCost){ renderCombat(); return; }
        if(sk.mp){ if(state.p.mp<sk.mp){ print('法力不足','bad'); renderCombat(); return; } state.p.mp-=sk.mp; }
        state.p.sta=Math.max(0,state.p.sta-staCost);
        ctx.skillCd=2;
        if(sk.spellBoost){ ctx.spellBoost=2; print('你凝神共鸣——下一发法术伤害×2','hint'); }
        else if(sk.counter){
          state.p.counter=sk.counterM||1.5;
          my.lastDef='格挡';
          print('你架起'+sk.n+'——来犯之敌将遭反击！','hint');
        } else {
          let def=Math.max(0,en.def+squadDefBonus(en)-(en.defDown||0));
          const stFxS=stanceApplies()?STANCE_FX[state.p.stance]:null;
          if(stFxS&&stFxS.pierce)def=Math.round(def*stFxS.pierce); // 破势：削甲
          if(sk.pierce)def=Math.round(def*(1-sk.pierce));
          dmg=hitDmg(playerAtk(),sk.mult,def);
          dmg=duelGloryReduce(dmg);
          if(state.p.weapon&&state.p.weapon.name==='小镰刀'){ if(en.pos)dmg=Math.round(dmg*en.pos.belly); else if(en.exposed)dmg=Math.round(dmg*2); print('镰刃直取弱点！','hint'); }
          if(en.blocked){ dmg=Math.max(1,Math.round(dmg*0.5)); print(en.name+'格挡了！你的伤害减半','def'); en.blocked=false; }
          print('战技——'+sk.n+'！','hint');
          if(sk.aoe){
            const es=ctx.enemies&&ctx.enemies.length?ctx.enemies.filter(e=>e.hp>0):[en];
            es.forEach(e=>{ const dd=Math.max(1,Math.round(dmg*0.8)); e.hp-=dd; ctx.damagedEnemy=true; print(sk.n+'扫过'+e.name+' −'+dd,'hit'); });
          } else if(sk.hits){
            for(let h=0;h<sk.hits;h++){ if(en.hp<=0)break; en.hp-=dmg; ctx.damagedEnemy=true; print(en.name+' −'+dmg+'（第'+(h+1)+'击）','hit'); }
            print(sk.n+'连击 ×'+sk.hits+'！','hint');
          } else {
            en.hp-=dmg;
            ctx.damagedEnemy=true;
            print(en.name+' −'+dmg,'hit');
          }
          if(sk.drain&&dmg>0){ const back=Math.max(1,Math.round(dmg*sk.drain)); state.p.hp=Math.min(state.p.maxHp,state.p.hp+back); print('你汲取了力量 +'+back,'ok'); }
          if(sk.guard){ my.lastDef='格挡'; print('余势不衰——你顺势架起防御','dim'); }
          if(sk.defDown)en.defDown=(en.defDown||0)+sk.defDown;
          if(sk.bleed){ en.bleed=(en.bleed||0)+2; print('目标血流不止','hit'); }
          if(sk.stun){ en.stunned=true; print('目标被震住了！','hint'); }
          applyWeaponFx(en);
        }
      }
    } else {
      let mult = kind==='正面' ? (en.pos?en.pos.front:0.8)
               : kind==='侧面' ? (en.pos?en.pos.side:1.3)
               : (en.pos?en.pos.belly:2.0);
      let def=Math.max(0,en.def+squadDefBonus(en)-(en.defDown||0));
      if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('破甲'))def=Math.round(def*0.8);
      dmg=hitDmg(playerAtk(),mult,def);
      dmg=duelGloryReduce(dmg);
      if(state.p.sta<10){ dmg=Math.max(1,Math.round(dmg*0.6)); print('你累得发飘（体力不足，伤害-40%）','dim'); }
      if(en.physRes){
        if(!en.physNoted){ en.physNoted=true; print('它的身体对物理攻击有抗性（伤害减半）','hint'); }
        dmg=Math.round(dmg*en.physRes);
      }
      if(state.p.weapon&&state.p.weapon.mod==='硬直'&&my.exposed){ dmg=Math.round(dmg*1.1); }
      if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('噬魂')&&en.亡灵){ dmg=Math.round(dmg*1.3); print('噬魂之力在它身上灼出青烟！','hint'); }
      if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('无魂')&&en.骑类){ dmg=Math.round(dmg*1.2); print('无魂之刃斩开骑士的架势！','hint'); }
      const vsU=accFx('vs亡灵');
      if(vsU&&en.亡灵){ dmg=Math.round(dmg*(1+vsU)); print('亡者克制的饰品发烫——亡者畏惧','hint'); }
      const vsR=accFx('vs骑类');
      if(vsR&&en.骑类){ dmg=Math.round(dmg*(1+vsR)); print('骑士克制的饰品低鸣——骑者受制','hint'); }
      if(en.name==='轩辕十四·单挑'&&en.finalBlow&&en.hp>0){ dmg=Math.max(dmg,en.hp); print('终焉一击之后，他力竭了——这一剑他躲不开','hint'); }
      if(en.blocked){ dmg=Math.max(1,Math.round(dmg*0.5)); print(en.name+'格挡了！你的伤害减半','def'); en.blocked=false; }
      let hits=Math.max(1,Math.round(accFx('hits')));
      const wtMelee=weaponTypeOf(state.p.weapon);
      if(wtMelee==='匕首'){ const ex=daggerExtraHits(); if(ex>0){ hits+=ex; print('匕首连击·追加'+ex+'击！','hint'); } }
      for(let h=0;h<hits;h++){
        if(en.hp<=0)break;
        en.hp-=dmg;
        ctx.damagedEnemy=true;
        print('你挥剑'+en.name+' −'+dmg+'（'+kind+(hits>1?'·第'+(h+1)+'击':'')+'）','hit');
      }
      if(hits>1)print('连击 ×'+hits+'！','hint');
      {
        const wfxs=state.p.weapon&&state.p.weapon.fx;
        let stCost=wfxs&&wfxs.includes('轻量')?9:10;
        if(wfxs&&wfxs.includes('鲸骨'))stCost=Math.round(stCost*0.8); // 鲸骨：耐力消耗-20%
        state.p.sta=Math.max(0,state.p.sta-stCost);
      }
      applyWeaponFx(en);
    }
  } else if(kind==='格挡'){
    state.p.sta=Math.max(0,state.p.sta-5);
    gainWprof(weaponTypeOf(state.p.weapon));
    print('你架起武器，护住要害');
  } else if(kind==='闪避'){
    state.p.sta=Math.max(0,state.p.sta-10);
    gainWprof(weaponTypeOf(state.p.weapon));
    print('你压低重心，盯着它的动作');
  } else if(kind==='逃跑'){
    const fxs=state.p.weapon&&state.p.weapon.fx;
    const rate=0.8+(fxs&&fxs.includes('迅影')?0.1:0)+accFx('fleePct');
    if(Math.random()<rate){ print('你转身就跑它没有追','ok'); ctx=null; state.p.buff.流血=0; allies().forEach(a=>{ a.fled=false; a.act=null; a.guard=false; a.dodge=false; }); if(state.p.flags.tyrfing&&!my.damagedEnemy){ state.p.hp=Math.max(1,state.p.hp-Math.round(state.p.maxHp*0.2)); print('必杀之约——你没有伤人，提尔锋借你的手刺穿了自己！','bad'); } if(my.opts.onFlee)my.opts.onFlee(); return; }
    print('你转身就跑——被扑了回来！','bad'); my.lastDef=null;
  }
  // 饰品·再次行动：攻击类行动后概率抢出第二击（每回合至多一次）
  if(ctx===my && !my.control && en.hp>0 && !ctx.extraUsed && kind!=='逃跑' && kind!=='格挡' && kind!=='闪避'){
    const ep=accFx('extraTurn');
    if(ep>0 && Math.random()<ep){
      ctx.extraUsed=true;
      print('饰品低鸣——你抢出了又一次行动！','hint');
      renderCombat();
      return;
    }
  }
  if(ctx!==my) return;
  if(en.hp<=0){ if(!enemyDown())return; }
  lionJoinCheck();
  if((!ctx.opts.solo&&allies().length) || (ctx.lionJoined&&!ctx.lionFled)) nextAllyTurn(0);
  else { enemyTurn(); afterEnemy(); }
}
function afterEnemy(){
  if(!ctx) return;
  lionJoinCheck();
  if(ctx.en.name==='老龙'){
    if(state.p.hp<=0){ dragonLeave(); return; }
  }
  if(state.p.hp<=0){ loseCombat(); return; }
  if(ctx.en.hp<=0){ if(!enemyDown())return; }
  renderCombat();
}
function nextAllyTurn(i){
  const list=allies().filter(a=>a!==ctx.control);
  if(i>=list.length){ allyResolve(); if(!ctx)return; if(ctx.lionJoined&&!ctx.lionFled)trialLionAct(); if(!ctx)return; enemyTurn(); afterEnemy(); return; }
  const a=list[i];
  clearActs();
  print(a.name+' 的行动？（生命 '+a.hp+'/'+a.maxHp+' · 法力 '+(a.mp||0)+'/'+(a.maxMp||0)+'）','h');
  const o=[
  ['战斗',()=>{ a.act='战斗'; nextAllyTurn(i+1); }],
  ['防御',()=>{ a.act='防御'; nextAllyTurn(i+1); }],
  ['闪避',()=>{ a.act='闪避'; nextAllyTurn(i+1); }],
  ['道具',()=>{ allyUseItem(a); a.act='道具'; nextAllyTurn(i+1); }],
  ['逃跑',()=>{ a.fled=true; print(a.name+'撤出了这场战斗','dim'); nextAllyTurn(i+1); }]
  ];
  const skA=allySkill(a);
  if(skA && !(a.skillCd>0))o.splice(o.length-1,0,['战技·'+skA.name+'（×'+skA.mult+'）',()=>{ a.act='战技'; a.skillCd=2; print(a.name+'握紧了武器，准备'+skA.name,'dim'); nextAllyTurn(i+1); }]);
  else if(skA && a.skillCd>0)print('战技冷却：'+a.name+'还剩 '+a.skillCd+' 回合','dim');
  if(casterSpells(a).length)o.splice(o.length-1,0,['法术',()=>allySpellPick(a,i)]);
  choices(o); statusLine();
}
function allySpellPick(a,i){
  clearActs();
  print(a.name+' 的法术（MP '+(a.mp||0)+'/'+(a.maxMp||0)+'）','h');
  const o=casterSpells(a).map(k=>{
    const s=SPELL_DEFS[k]||REGULUS_SPELL_DEFS[k];
    return [s.name+'（'+s.cost+'MP · '+s.desc+'）',()=>{
      if((a.mp||0)<s.cost){ print('法力不足','bad'); allySpellPick(a,i); return; }
      a.mp-=s.cost;
      a.act='法术'; a.actSpell=k;
      print(a.name+'开始咏唱'+s.name,'dim');
      nextAllyTurn(i+1);
    }];
  });
  o.push(['返回',()=>nextAllyTurn(i)]);
  choices(o); statusLine();
}
function allyUseItem(a){
  const inv=state.p.inv;
  const target = state.p.hp<a.hp ? state.p : a;
  const nm=target===state.p?'你':target.name;
  if(inv.止血膏>0){ inv.止血膏--; target.hp=Math.min(target.maxHp,target.hp+25); print(a.name+'给'+nm+'抹上止血膏 +25','ok'); return; }
  if(inv.绷带>0){ inv.绷带--; target.hp=Math.min(target.maxHp,target.hp+10); print(a.name+'给'+nm+'包扎 +10','ok'); return; }
  if(inv.干粮>0){ inv.干粮--; target.hp=Math.min(target.maxHp,target.hp+15); print(a.name+'喂给'+nm+'干粮 +15','ok'); return; }
  if(inv.盐渍肉>0){ inv.盐渍肉--; target.hp=Math.min(target.maxHp,target.hp+30); print(a.name+'给'+nm+'盐渍肉 +30','ok'); return; }
  print(a.name+'翻了翻口袋——没有能用的','dim');
}
function allyResolve(){
  const arm=state.p.armguard?4:0;
  const leadBonus=leaderDmg();
  for(const a of allies()){
    if(a===ctx.control)continue; // 被操控的角色已手动行动
    if(!ctx)break;
    if(ctx.en.hp<=0){ if(!enemyDown())break; }
    const en=ctx.en;
    if(a.fled){ print(a.name+'在战场边缘观望','dim'); continue; }
    if(a.act==='防御'){ a.guard=true; print(a.name+'摆出防御姿态','dim'); continue; }
    if(a.act==='闪避'){ a.dodge=true; print(a.name+'压低重心，准备闪避','dim'); continue; }
    if(a.act==='法术'){
      const s=SPELL_DEFS[a.actSpell]||REGULUS_SPELL_DEFS[a.actSpell];
      if(REGULUS_SPELL_DEFS[a.actSpell]){ castRegulusSpell(a.actSpell,a); }
      else if(s&&(s.fear||s.atkDown||s.defDown||s.plague||s.illusion||s.luck)){
        const e=ctx.en;
        if(s.fear)e.fear=s.fear;
        if(s.atkDown)e.atkDown=s.atkDown;
        if(s.defDown)e.defDown=s.defDown;
        if(s.plague)e.plague=s.plague;
        if(s.luck)e.luckDown=true;
        if(s.illusion){ e.stunned=true; print('幻影在它眼前晃动——它挥空了','hint'); }
        print(a.name+'施放'+s.name+'——'+e.name+'被缠住了','hint');
      }
      else if(s&&s.soothe){ a.hp=Math.min(a.maxHp,a.hp+15); print(a.name+'的伤痛被幻觉抚平 +15生命','ok'); }
      else if(s&&(s.fort||s.pow)){
        if(s.fort){ a.fort=s.fort; print(a.name+'周身土石护体——本场所受伤害-'+s.fort,'ok'); }
        if(s.pow){ a.pow=s.pow; print(a.name+'魔力涌入四肢——本场攻击+'+s.pow,'ok'); }
      }
      else if(s&&s.heal){
        const h=allySpellPower(a.actSpell,a).heal;
        if(s.aoeHeal){
          [state.p].concat(allies()).forEach(x=>{ if(x.maxHp&&x.hp>0)x.hp=Math.min(x.maxHp,x.hp+h); });
          print(a.name+'念动'+s.name+'——温流环过全队，每人+'+h+'生命','ok');
        } else {
          const t=mostWounded();
          t.hp=Math.min(t.maxHp,t.hp+h);
          print(a.name+'念动'+s.name+'——微光落在'+(t===state.p?'你':t.name)+'身上 +'+h+'生命','ok');
        }
      } else if(s){
        let dmg=Math.max(1,allySpellPower(a.actSpell,a).dmg-Math.round(en.def/2));
        if(s.fire&&en.惧火){ dmg=Math.round(dmg*2); print('火舌遇惧火者，伤害翻倍！','hint'); }
        if(en.name==='妖僧·拉斯普提'&&a.name==='安普提斯'){ dmg=Math.round(dmg*1.5); print('「我知道怎么打他」——妖雾缠上旧同事的伤口（×1.5）','hint'); }
        en.hp-=dmg;
        print(a.name+'咏唱'+s.name+'——'+en.name+' −'+dmg,'hit');
        if(s.bleed){ en.bleed=(en.bleed||0)+s.bleed; print('目标血流不止','hit'); }
        if(s.stun){ en.stunned=true; print('目标被震住了！','hint'); }
        if(s.stunChance&&Math.random()<s.stunChance){ en.stunned=true; print('目标被冻住了！','hint'); }
        if(s.drain&&dmg>0){ const back=Math.max(1,Math.round(dmg*s.drain)); a.hp=Math.min(a.maxHp,a.hp+back); print(a.name+'汲取生命 +'+back,'ok'); }
        if(en.hp<=0){ if(!enemyDown())break; }
      }
      continue;
    }
    if(a.act==='战技'){
      const sk=allySkill(a);
      if(sk){
        let def=en.def+squadDefBonus(en);
        if(sk.pierce)def=Math.round(def*(1-sk.pierce));
        let d=hitDmg(allyFullAtk(a),sk.mult||1,def); // 保险：mult缺失按1算，杜绝NaN
        if(en.blocked){ d=Math.max(1,Math.round(d*0.5)); print(en.name+'格挡了！伤害减半','def'); en.blocked=false; }
        en.hp-=d;
        print(a.name+'战技——'+sk.name+'！'+en.name+' −'+d,'hit');
        if(sk.bleed){ en.bleed=(en.bleed||0)+2; print('目标血流不止','hit'); }
        if(sk.stun){ en.stunned=true; print('目标被震住了！','hint'); }
        if((a.traits||[]).includes('狠辣')&&Math.random()<0.2){ en.bleed=(en.bleed||0)+1; print(a.name+'的攻击撕开了伤口','hit'); }
        allyHitFx(a,en);
        if(en.hp<=0){ if(!enemyDown())break; }
      }
      continue;
    }
    if(a===state.p.regulus){
      regulusAllyAct(a,en);
      if(en.hp<=0){ if(!enemyDown())break; }
      continue;
    }
    // 战斗（含被动）
    let d=allyAtk(a)+allyWeaponDmg(a)+(a.w||0)+(a.pow||0)+arm+leadBonus;
    if(en.name==='妖僧·拉斯普提'&&a.name==='安普提斯'){ d=Math.round(d*1.5); print('「我知道怎么打他」——她直取旧同事的要害（×1.5）','hint'); }
    if((a.traits||[]).includes('强壮'))d+=1;
    if(state.p.leader==='落魄骑士'&&a===state.p.knight)d+=1; // 军心：他自身再+1
    if(a.double){
      const rage=en.hp<en.maxHp*0.5;
      let d1=d, d2=d;
      if(rage){ d1=Math.round(d1*1.2); d2=Math.round(d2*1.2); print('暴怒：目标半血以下，伤害+20%','hint'); }
      en.hp-=d1;
      print(a.name+'出手了'+en.name+' −'+d1+'（狮心·第一击）','hit');
      if(en.hp>0){
        en.hp-=d2;
        print('狮心·第二击 −'+d2,'hit');
        if(en.hp>0 && a.w>0){ en.bleed=(en.bleed||0)+1; print('追猎：狮纹烙进伤口（流血+1）','hit'); }
      }
      allyHitFx(a,en);
      if(en.hp<=0){ if(!enemyDown())break; }
      continue;
    }
    en.hp-=d;
    print(a.name+'出手了'+en.name+' −'+d,'hit');
    if((a.traits||[]).includes('狠辣')&&Math.random()<0.2){ en.bleed=(en.bleed||0)+1; print(a.name+'的攻击撕开了伤口','hit'); }
    if((a.traits||[]).includes('利落')&&Math.random()<0.1){ en.hp-=d; print(a.name+'追了一击！'+en.name+' −'+d,'hit'); }
    allyHitFx(a,en);
    if(en.hp<=0){ if(!enemyDown())break; }
  }
}
function lionJoinCheck(){
  if(!ctx||!ctx.opts.twoLions||ctx.lionJoined)return;
  const en=ctx.en;
  if(en.hp>en.maxHp*0.5 && state.p.hp>20)return;
  ctx.lionJoined=true;
  state.p.flags.lionTrialJoined=true;
  hr();
  print('野兽的爪风里混进一声狮吼——金色的光撕开了雾！','hint');
  print('轩辕十四降临：40级，基础攻防比40级的你高20点','ok');
  const heal=Math.max(1,Math.round(state.p.maxHp*0.3));
  state.p.hp=Math.min(state.p.maxHp,state.p.hp+heal);
  allies().forEach(a=>{ if(a.maxHp)a.hp=Math.min(a.maxHp,a.hp+Math.round(a.maxHp*0.3)); });
  state.p.buff.流血=0;
  print('王者归来：全队恢复'+heal+'生命','ok');
  print('他看了一眼你怀里的'+(state.p.lionSword?'狮心剑':'狮子信物')+'，站到了你身侧','dim');
  statusLine();
}
function trialLionAct(){
  if(!ctx)return;
  const en=ctx.en;
  const base=149+(state.p.lionSword?40:0);
  const rage=en.hp<en.maxHp*0.5;
  let d1=Math.max(1,Math.round((base-en.def)*0.5));
  let d2=d1;
  if(rage){ d1=Math.round(d1*1.2); d2=Math.round(d2*1.2); print('暴怒：目标半血以下，伤害+20%','hint'); }
  en.hp-=d1;
  print('轩辕十四挥剑'+en.name+' −'+d1+'（狮心·第一击）','hit');
  if(en.hp>0){
    en.hp-=d2;

function dragonLeave(){

function mercTurn(){
  const list=state.p.mercs||[];
  const arm=state.p.armguard?4:0;
  for(const m of list){
    if(ctx.en.hp<=0)break;
    if(m.guard){ print(m.name+'保持防御姿态，没有出手','dim'); continue; }
    const d=4+(m.tn||0)+arm;
    ctx.en.hp-=d;
    print(m.name+'补上一刀'+ctx.en.name+' −'+d,'hit');
    if(ctx.en.hp<=0 && !enemyDown())return;
  }
  if(!ctx)return;
  if(ctx.en.hp>0 && state.p.knight){
    if(state.p.knight.guard){ print(state.p.knight.name+'保持防御姿态，没有出手','dim'); }
    else {
      ctx.en.hp-=(10+(state.p.knight.w||0)+arm);
      print('落魄骑士的重剑落下'+ctx.en.name+' −'+(10+(state.p.knight.w||0)+arm),'hit');
      if(ctx.en.hp<=0 && !enemyDown())return;
    }
  }
  if(!ctx)return;
  if(ctx.en.hp>0 && state.p.companion){
    if(state.p.companion.guard){ print(state.p.companion.name+'保持防御姿态，没有出手','dim'); }
    else {
      ctx.en.hp-=((state.p.companion.d||6)+(state.p.companion.w||0)+arm);
      print(state.p.companion.name+'补上一击'+ctx.en.name+' −'+((state.p.companion.d||6)+(state.p.companion.w||0)+arm),'hit');
      if(ctx.en.hp<=0 && !enemyDown())return;
    }
  }
}
function enemyTurn(){
  if(!ctx)return;
  const es=(ctx.enemies&&ctx.enemies.length)?ctx.enemies.filter(e=>e.hp>0):[ctx.en];
  for(const e of es){
    if(!ctx)break;
    ctx.en=e;
    enemyTurnOne();
    e.atkBoost=0;
  }
  if(!ctx)return;
  // 回合收尾：盟友姿态重置、战技冷却与法力回复（每回合一次）
  allies().forEach(a=>{ a.act=null; a.guard=false; a.dodge=false; if(a.skillCd>0)a.skillCd--; if(a.unyield>0)a.unyield--; if(a.maxMp&&a.mp<a.maxMp)a.mp=Math.min(a.maxMp,a.mp+2); if(a.regen&&a.hp>0&&a.hp<a.maxHp){ a.hp=Math.min(a.maxHp,a.hp+a.regen); print(a.name+'在星光里缓缓回复 '+a.regen+' 生命','dim'); } });
  if(state.p.crown>0)state.p.crown--; // DYO荣冠：3回合攻击+30%
  ctx.extraUsed=false; // 再次行动：每回合至多一次
  const rg=accFx('regen');
  if(rg&&state.p.hp>0&&state.p.hp<state.p.maxHp){ state.p.hp=Math.min(state.p.maxHp,state.p.hp+rg); print('饰品温润——回复'+rg+'生命','dim'); }
}

function allyWeaponDmg(a){
  if(!a.weapon||typeof a.weapon==='string')return 0; // 佣兵的武器只是招牌（string），不转化伤害

/* 盟友法术与战技：队友也有法力（MP），会咏唱主角已学会的法术，能用自己武器的战技 */
function ensureAllyFields(a){
  if(!a)return a;
  if(!isFinite(a.maxHp))a.maxHp=30+(a.lv||1)*2;
  if(!isFinite(a.hp))a.hp=a.maxHp; // 血条异常自修复
  if(a.maxMp===undefined)a.maxMp=30+(a.lv||1)*2;
  if(a.mp===undefined)a.mp=a.maxMp;
  if(a.skillCd===undefined)a.skillCd=0;
  if(a.pow===undefined)a.pow=0;
  if(a.fort===undefined)a.fort=0;
  if(a.regen===undefined)a.regen=0;
  if(a.stunC===undefined)a.stunC=0;
  return a;
}
function allyWeaponType(a){
  if(a.weapon&&typeof a.weapon==='object'&&a.weapon.type)return a.weapon.type;
  if(typeof a.weapon==='string')return a.weapon==='锤'?'小锤':a.weapon;
  return a.type||'剑';
}
function allySkill(a){
  const w=WSKILLS[allyWeaponType(a)];

  const sk=w.find(s=>s.mult)||w[0]; // 队友不玩架势：挑带伤害的战技（架势切换无mult，曾导致NaN）
  return {name:sk.n,mult:sk.mult||1,cost:sk.cost};
}

}
/* 轩辕十四（0.25强化·角色档案/16-BOSS与传奇单位）：荣耀之锁/剑意蓄势/不屈/二阶段狮子型/猎食本能/DYO加冕 */
function regulusAllyAct(a,en){
  a.swordWill=Math.min(5,(a.swordWill||0)+1); // 剑意蓄势：每回合+1层，最多5层
  let d=allyAtk(a)+allyWeaponDmg(a)+(a.w||0)+(a.pow||0)+(state.p.armguard?4:0)+leaderDmg();
  let mult=1+0.05*a.swordWill; // 剑意：每层+5%攻击
  if(a.lionForm)mult*=1.5; // 兽形解禁：攻击+50%
  if(a.lionForm&&a.hp>0&&a.hp<=a.maxHp*0.15)mult*=1.5; // 末路狂奔：攻击+50%
  if(a.unyield>0)mult*=1.3; // 不屈：攻击+30%
  if(en.bleed>0||en.fear||en.stunned)mult*=1.25; // 猎食本能：对流血/恐惧/硬直目标+25%
  d=Math.max(1,Math.round(d*mult));
  if(a.lionForm){
    a.lionRounds=(a.lionRounds||0)+1;
    if(a.lionRounds%5===0){
      const roar=Math.max(1,Math.round(en.maxHp*0.15));
      en.hp-=roar; en.fear=1;
      print('狮吼！'+en.name+' −'+roar+'（真实伤害·无视护甲），恐惧入骨','hint');
    }
    if(a.lionRounds%4===0){
      print('狂怒连击——三爪齐出！','hint');
      for(let i=0;i<3;i++){
        if(en.hp<=0)break;
        const h=Math.max(1,Math.round(d*0.8));
        en.hp-=h; en.bleed=(en.bleed||0)+1;
        print('狂怒连击·第'+(i+1)+'击 −'+h,'hit');
      }
    } else {
      en.hp-=d; en.bleed=(en.bleed||0)+2; // 撕裂爪击：命中附加2层流血
      print(a.name+'挥爪'+en.name+' −'+d+'（撕裂爪击·流血+2）','hit');
    }
    if(a.hp>0&&a.hp<=a.maxHp*0.15){ a.hp=Math.max(1,a.hp-Math.round(a.maxHp*0.08)); print('末路狂奔——他不再守任何规矩（攻击+50%·自损8%生命）','bad'); }
  } else {
    const rage=en.hp<en.maxHp*0.5;
    let d1=d, d2=d;
    if(rage){ d1=Math.round(d1*1.2); d2=Math.round(d2*1.2); print('暴怒：目标半血以下，伤害+20%','hint'); }
    en.hp-=d1;
    print(a.name+'出手了'+en.name+' −'+d1+'（狮心·第一击'+(a.swordWill?'·剑意+'+a.swordWill*5+'%':'')+'）','hit');
    if(en.hp>0){
      en.hp-=d2;
      print('狮心·第二击 −'+d2,'hit');
      if(en.hp>0 && a.w>0){ en.bleed=(en.bleed||0)+1; print('追猎：狮纹烙进伤口（流血+1）','hit'); }
    }
  }
  // DYO「以荣冠加冕无名之身」：每4回合为玩家加冕（荣冠：3回合攻击+30%）
  a.crownCd=(a.crownCd||0)+1;
  if(a.crownCd>=4){ a.crownCd=0; state.p.crown=3; print('「以荣冠加冕无名之身」——他为你加冕：接下来3回合你的攻击+30%','hint'); }
  if(a.unyield>0)a.unyield--;
  allyHitFx(a,en);
}

function ampthisMult(sch){ if(sch==='诅咒'||sch==='精神')return 6; return 3+Math.floor(Math.random()*3); }
function allySpellPower(key,a){
  const s=SPELL_DEFS[key];
  const staff=(a.weapon&&typeof a.weapon==='object'&&a.weapon.type==='法杖')?a.weapon.atk:0;
  const raw=Math.max(1,(s.dmg||0)+Math.round((a.lv||1)*(s.scale||1))+staff);
  const full=state.p.armguard?Math.round(raw*1.25):raw; // 臂甲对全队法伤+25%
  let dmg=Math.max(1,Math.round(full*0.25));
  let heal=s.heal?Math.max(1,Math.round(s.heal*0.25)):0;
  if(a&&a.name==='安普提斯'){
    const m=ampthisMult(SPELL_SCHOOL[key]||'');
    dmg*=m; heal*=m;

  }

function allyHurt(a,dmg){
  if(a===state.p.regulus){
    if(a.lionInvuln>0){ a.lionInvuln=0; print('兽形解禁的金光挡下了这一击——'+a.name+'毫发无伤','hint'); return; }
    dmg=Math.max(1,Math.round(dmg*0.65));
    if(!a.gloryNoted){ a.gloryNoted=true; print('荣耀之锁——'+a.name+'正面受击-35%（他不能拒绝正面交锋）','def'); }
    if(a.swordWill>0)a.swordWill--;
    if(!a.unyieldUsed&&a.hp>a.maxHp*0.5&&a.hp-dmg<=a.maxHp*0.5){ a.unyield=3; a.unyieldUsed=true; print('不屈——'+a.name+'拄剑不倒（3回合不会倒下，攻击+30%）','hint'); }
    if(!a.lionForm&&a.hp>0&&a.hp>a.maxHp*0.25&&a.hp-dmg<=a.maxHp*0.25){
      a.lionForm=true; a.lionRounds=0; a.lionInvuln=1;
      a.hp=Math.min(a.maxHp,a.hp-dmg+Math.round(a.maxHp*0.3));
