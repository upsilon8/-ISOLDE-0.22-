<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伊索尔德 · 原型（序章）</title>
<style>
  :root{ --bg:#050805; --fg:#b8e8c0; --dim:#6f9a78; --amber:#e0b96a; --red:#ff6b5e; --ok:#8ee89a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Sarasa Mono SC","Consolas","Courier New","Noto Sans Mono CJK SC",monospace;
    font-size:15px; line-height:1.55; }
  #app{ display:flex; flex-direction:column; height:100%; max-width:880px; margin:0 auto; padding:8px 14px; }
  #status{ border:1px solid #1d3a22; padding:6px 10px; color:var(--amber); font-size:13px; white-space:pre-wrap; }
  #log{ flex:1; overflow-y:auto; padding:10px 2px; scrollbar-width:thin; }
  #log .line{ margin:2px 0; white-space:pre-wrap; word-break:break-word; }
  #log .h{ color:var(--amber); font-weight:bold; }
  #log .enemy{ color:var(--red); }
  #log .hit{ color:var(--ok); }
  #log .bad{ color:var(--red); }
  #log .def{ color:#7ec8e3; }
  #log .hint{ color:var(--amber); }
  #log .dim{ color:var(--dim); }
  #actions{ padding:8px 0; border-top:1px dashed #1d3a22; display:flex; flex-wrap:wrap; gap:6px; }
  button{ background:#0c1a0e; color:var(--fg); border:1px solid #2a5c33; padding:6px 12px;
    cursor:pointer; font:inherit; font-size:14px; }
  button:hover{ background:#14301a; border-color:#4b9a5c; color:#fff; }
  button:disabled{ opacity:.4; cursor:default; }
  #inputrow{ display:flex; padding:6px 0 2px; color:var(--ok); }
  #cmd{ flex:1; background:transparent; border:none; outline:none; color:var(--fg); font:inherit; font-size:15px; }
  .title{ text-align:center; margin:18vh 0 0; }
  .title pre{ font-size:13px; color:var(--amber); }
</style>
</head>
<body>
<div id="app">
  <div id="status">—</div>
  <div id="log"></div>
  <div id="actions"></div>
  <div id="inputrow">&gt; <input id="cmd" autocomplete="off" spellcheck="false" placeholder="帮助 / 看 / 状态 / 背包"></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const log=$('#log'), act=$('#actions'), cmd=$('#cmd'), statusEl=$('#status');
const SAVE_KEY='isolde_proto_v1';
let state=null, ctx=null, lastDesc='';
let twOn=true, twBusy=false;
const twQueue=[];
try{ const _st0=JSON.parse(localStorage.getItem('isolde_settings')||'{}'); if(_st0.tw===false)twOn=false; }catch(e){}

/* ---------- 输出与UI ---------- */
function twSpeed(){ return 8; }
function appendLine(t,cls){
  const d=document.createElement('div');
  d.className='line '+cls;
  d.textContent=t;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}
function print(t,cls=''){
  t=String(t);
  if(!twOn){ appendLine(t,cls); return; }
  twQueue.push([t,cls]);
  twTick();
}
function twTick(){
  if(twBusy||!twQueue.length)return;
  twBusy=true;
  const pair=twQueue.shift();
  const t=pair[0], cls=pair[1];
  const d=document.createElement('div');
  d.className='line '+cls;
  log.appendChild(d);
  let i=0;
  const step=()=>{
    if(i>=t.length){ twBusy=false; log.scrollTop=log.scrollHeight; twTick(); return; }
    i++;
    d.textContent=t.slice(0,i);
    log.scrollTop=log.scrollHeight;
    setTimeout(step,twSpeed());
  };
  step();
}
function flushTw(){ while(twQueue.length){ const p=twQueue.shift(); appendLine(p[0],p[1]); } twBusy=false; }
function hr(){ print('─'.repeat(44),'dim'); }
function clearActs(){ act.innerHTML=''; }
function btn(t,f,disabled){ const b=document.createElement('button'); b.textContent=t; if(disabled)b.disabled=true; b.onclick=()=>f(); act.appendChild(b); }
function choices(list){ clearActs(); list.forEach(([t,f,d])=>btn(t,f,d)); }
function scene(title,desc,opts,descRaw){
  lastDesc=descRaw||desc;
  clearActs(); hr();
  print(title,'h'); print(desc);
  if(opts)choices(opts);
  statusLine();
}
function statusLine(){
  const p=state.p, w=p.weapon;
  let s='【'+placeName()+'】第'+(p.days||0)+'天 · Lv.'+(p.level||1)+'('+(p.xp||0)+'/'+xpNeed()+') · 生命 '+p.hp+'/'+p.maxHp+' · 体力 '+p.sta+' · 铜币 '+p.gold;
  s+='\n武器：'+(w?w.name+'(+'+w.atk+')':'空手')+(p.def>0?' · 甲 '+p.def:'')+(p.accessory?' · 饰：'+p.accessory.name:'')+(p.armguard?' · 臂甲：'+p.armguard.name:'')+(p.companion?' · 伙伴':'' )+(p.knight?' · 骑士随从':'')+(p.mercs&&p.mercs.length?' · 佣兵×'+p.mercs.length:'');
  if(p.buff.流血>0)s+=' · 流血'+p.buff.流血+'层';
  if(p.buff.保养>0)s+=' · 保养×'+p.buff.保养;
  if(p.buff.磨石>0)s+=' · 磨石×'+p.buff.磨石;
  if(p.flags.通缉)s+=' · 被通缉';
  statusEl.textContent=s;
}
let curScene='ashwold';
function backToTown(){ if(state.p.lastTown==='cromford')gotoCromford(); else if(state.p.lastTown==='tanwo')gotoTanwo(); else if(state.p.lastTown==='lienfiel')gotoLienfiel(); else if(state.p.lastTown==='warrin')gotoWarrin(); else if(state.p.lastTown==='whitestone')gotoWhitestone(); else if(state.p.lastTown==='windcap')gotoWindcap(); else gotoAshwold(); }
function backToRoad(){ if(state.p.lastTown==='cromford')gotoRoad2(); else if(state.p.lastTown==='tanwo')gotoRoad3(); else if(state.p.lastTown==='lienfiel')gotoRoad4(); else if(state.p.lastTown==='warrin')gotoRoad5(); else if(state.p.lastTown==='whitestone')gotoRoad6(); else if(state.p.lastTown==='windcap')gotoRoad7(); else gotoRoad(); }
function placeName(){
  if(curScene==='cromford')return '克罗姆福德';
  if(curScene==='tanwo')return '坦沃';
  if(curScene==='lienfiel')return '利恩菲尔';
  if(curScene==='warrin')return '沃林';
  if(curScene==='whitestone')return '白石镇';
  if(curScene==='windcap')return '风角港';
  if(curScene==='road2')return '克罗姆福德城外';
  if(curScene==='road3')return '坦沃城外';
  if(curScene==='road4')return '利恩菲尔城外';
  if(curScene==='road5')return '沃林城外';
  if(curScene==='road6')return '白石镇城外';
  if(curScene==='road7')return '风角港城外';
  if(curScene==='road')return '阿什沃德城外';
  if(curScene==='camp')return '营地';
  if(curScene==='journey')return '旅途';
  return '阿什沃德';
}
function saveGame(){
  try{
    state.scene=curScene;
    state.sv=2;
    state.savedDay=state.p.days;
    localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  }catch(e){}
}
/* 存档迁移：任何旧版本存档读入后，逐项补齐新字段（旧档永不失效） */
function migrate(s){
  if(!s||!s.p||s.p.weapon===undefined)return null;
  const p=s.p;
  if(p.level===undefined)p.level=1;
  if(p.xp===undefined)p.xp=0;
  if(p.mercs===undefined){ p.mercs=p.merc?[p.merc]:[]; delete p.merc; }
  if(!p.buff)p.buff={流血:0,硬直:0,保养:0,磨石:0};
  if(p.buff.磨石===undefined)p.buff.磨石=0;
  if(p.buff.流血===undefined)p.buff.流血=0;
  if(p.buff.硬直===undefined)p.buff.硬直=0;
  if(p.buff.保养===undefined)p.buff.保养=0;
  if(p.days===undefined)p.days=0;
  if(p.shop===undefined)p.shop={};
  if(p.gear===undefined){ p.gear={头:null,胸:p.armor||null,腿:null,披风:null}; delete p.armor; }
  for(const slot of ['头','胸','腿','披风']){ if(p.gear[slot]===undefined)p.gear[slot]=null; }
  if(p.knight===undefined)p.knight=null;
  if(p.accessory===undefined)p.accessory=null;
  if(p.armguard===undefined)p.armguard=null;
  if(p.lairFloor===undefined)p.lairFloor=1;
  if(!p.flags)p.flags={};
  if(p.flags.god===undefined)p.flags.god=false;
  if(p.forge===undefined)p.forge={count:0};
  if(p.companion===undefined)p.companion=null;
  if(p.journey===undefined)p.journey=null;
  if(p.flags.ampelosMet===undefined)p.flags.ampelosMet=false;
  if(p.flags.dragonMet===undefined)p.flags.dragonMet=false;
  if(p.lastTown===undefined)p.lastTown='ashwold';
  for(const k of ['铁料','蛙皮','蛙油膏','覆金属龙皮','烟幕弹','苦蜜蜡','苦蜜酒','骨器','灰肉','疫骨','麦饼','龙鳞','精炼熔断钢铁','管理者材料','海鱼','大鱼','烤鱼','兽皮','野猪肉','绷带','干粮','保养油','旧铁片','猪王皮','胡椒','烤肉','旧银币','巨魔牙','魔化兽皮','蛇蛋','净水袋','草药','陈年果酒','巨魔粗制饰品','磨石','肉桂','丁香','藏红花','血盐','血水结晶','女妖之泪','黑鳄皮','巨魔皮','碎布条','火把','止血膏','醒神草','盐渍肉','猛火油','皮革帽','铁头盔','锁子甲兜帽','板甲头盔','皮背心','锁子甲胸甲','板甲胸甲','皮革护腿','锁子甲护腿','板甲护腿','布披风','皮革披风','游侠短弓','骑士剑','熊皮','蛛丝','骨头','蛇皮','暗影之尘','送葬骨灰','水渍石','摆锤','弃誓之剑','空甲胄壳','虱壳','虱母壳','除虱粉','灰衣甲片','灰衣队长徽记','灰土结晶']){
    if(p.inv[k]===undefined)p.inv[k]=0;
  }
  for(const k of ['wellJob','wellDone','wellReward','grainJob','grainDone','grainPay','frogJob','frogDone','frogsLeft','tideJob','tideDone','squadJob','squadDone','mineJob','mineDone','crowJob','crowDone','crowsLeft','crowFirst','beggarJob','beggarDone','diggerJob','diggerDone','diggerReward','flagJob','flagDone','flagReward','potFrogJob','potFrogDone','potFrogsLeft','hunterJob2','hunter2Done','hunter2Reward','queenJob','queenDone','queenReward','mudJob','mudDone','mudReward','scavJob','scavDone','ratJob','ratDone','ratsLeft','boneJob','boneDone','boneReward','taxJob','taxDone','taxReward','commanderJob','commanderDone','commanderReward','riverJob','riverStage','riverDone','riverReward','campJob2','campStage','camp2Done','camp2Reward','lostJob','lostStage','lostDone','lostReward','heavyJob','heavyDone','heavyReward','hagJob2','hag2Done','hag2Reward','nestJob','nestDone','nestReward','fliesJob','fliesDone','fliesLeft','riteJob','riteDone','riteReward','robberJob4','robber4Done','robber4Reward','honeyJob4','honey4Done','honey4Reward','relicJob4','relic4Done','relic4Reward','militiaJob4','militia4Done','militia4Reward','churchSit','patrolJob','patrolDone','patrolReward','saltCarJob','saltCarDone','saltCarReward','altarJob','altarDone','altarReward','legionJob','legionDone','legionReward','deaconJob','deaconDone','deaconReward','beastJob','beastDone','beastsLeft','haulerJob','haulerDone','haulerReward','craftJob','craftDone','craftReward','plagueRelicJob5','plagueRelic5Done','plagueRelic5Reward','plagueKnightJob','plagueKnightDone','plagueKnightReward','ferryJob','ferryDone','ferryReward','clearJob','clearDone','clearsLeft','escrowActive','escrowDone','escrowPay','wolfJob','wolfDone','wolfReward','duelJob','duelDone','duelReward','captainJob','captainDone','captainReward','fishJob','fishDone','fishNets','pirateJob','pirateDone','pirateReward','saltGhostJob','saltGhostDone','saltGhostReward','seaWolfJob','seaWolfDone','seaWolfReward','lairJob','lairStage','lairDone','lairReward','lighthouseJob','lighthouseDone','lighthouseReward','lairUnlocked','lairBest','armguardGot']){
    if(p.flags[k]===undefined)p.flags[k]=false;
  }
  const WMAP={木剑:{atk:3,type:'剑'},破铁剑:{atk:8,type:'剑'},生锈匕首:{atk:5,type:'匕首'},环头剑:{atk:8,type:'剑'},黄刀:{atk:8,mod:'硬直',type:'剑'},云剑:{atk:16,type:'剑'},小锤:{atk:6,type:'锤'},大马士革刀:{atk:50,type:'剑'}};
  if(p.owned&&p.owned.length&&typeof p.owned[0]==='string'){
    p.owned=p.owned.map(n=>({name:n,...(WMAP[n]||{atk:2,type:'剑'})}));
  }
  if(!p.weapon.type)p.weapon.type=WMAP[p.weapon.name]?WMAP[p.weapon.name].type:'剑';
  if(p.weapon.fx===undefined)p.weapon.fx=[];
  s.sv=2;
  return s;
}
function loadGame(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    return migrate(s);
  }catch(e){}
  return null;
}
function restoreScene(sc){
  if(sc==='ashwold')gotoAshwold();
  else if(sc==='cromford')gotoCromford();
  else if(sc==='tanwo')gotoTanwo();
  else if(sc==='lienfiel')gotoLienfiel();
  else if(sc==='warrin')gotoWarrin();
  else if(sc==='whitestone')gotoWhitestone();
  else if(sc==='windcap')gotoWindcap();
  else if(sc==='road')gotoRoad();
  else if(sc==='road2')gotoRoad2();
  else if(sc==='road3')gotoRoad3();
  else if(sc==='road4')gotoRoad4();
  else if(sc==='road5')gotoRoad5();
  else if(sc==='road6')gotoRoad6();
  else if(sc==='road7')gotoRoad7();
  else if(sc==='camp')gotoCamp();
  else if(sc==='journey'&&state.p.journey)journeyScene(state.p.journey.target);
  else if(sc==='journey')gotoRoad();
  else backToTown();
}
function exportSave(){
  state.scene=curScene;
  state.sv=2;
  try{
    const code='ISOLDE'+btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    print('存档码——复制下面整段文字，可在任何浏览器"导入存档"继续这段旅程：','h');
    print(code,'ok');
  }catch(e){ print('导出失败','bad'); }
  sysMenu();
}
function importSave(){
  let code=null;
  try{ if(typeof prompt==='function')code=prompt('粘贴存档码：'); }catch(e){}
  if(!code){ print('无法打开输入框（此环境不支持）','dim'); sysMenu(); return; }
  try{
    const json=decodeURIComponent(escape(atob(String(code).trim().replace(/^ISOLDE/,''))));
    const s=migrate(JSON.parse(json));
    if(!s){ print('存档码无效','bad'); sysMenu(); return; }
    state=s; ctx=null; twQueue.length=0; twBusy=false;
    saveGame();
    print('导入成功，已覆盖本地存档','ok');
    restoreScene(s.scene||'ashwold');
  }catch(e){ print('存档码无效','bad'); sysMenu(); }
}

/* ---------- 杂货与商店刷新 ---------- */

function shopCycle(){ return Math.floor((state.p.days||0)/3); }
function pickFrom(pool,n){
  const arr=pool.slice();
  let seed=shopCycle()*7+13;
  const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr.slice(0,n);
}
function stockOf(shop,pool){
  if(!state.p.shop)state.p.shop={};
  const cyc=shopCycle();
  if(!state.p.shop[shop]||state.p.shop[shop].cycle!==cyc){
    state.p.shop[shop]={cycle:cyc,items:pickFrom(pool,2)};
  }
  return state.p.shop[shop];
}
function takeStock(shop,name){
  const s=stockOf(shop,[]);
  const i=s.items.indexOf(name);
  if(i>=0)s.items.splice(i,1);
}

function forgeLevel(){
  const c=state.p.forge?state.p.forge.count:0;
  if(c>=1000)return 8; if(c>=600)return 7; if(c>=350)return 6; if(c>=200)return 5;
  if(c>=100)return 4; if(c>=40)return 3; if(c>=10)return 2; return 1;
}
function rollQuality(lv){
  const r=Math.random();
  if(lv===1)return r<0.6?'劣质':'普通';
  if(lv===2)return '普通';
  if(lv===3)return r<0.5?'普通':'优良';
  if(lv===4)return '优良';
  if(lv===5)return r<0.5?'优良':'稀有';
  if(lv===6)return '稀有';
  if(lv===7)return r<0.5?'稀有':'史诗';
  return '史诗';
}
function rollFxCount(lv){
  if(lv<=2)return 0;
  if(lv<=5)return 1;
  if(lv===6)return Math.random()<0.5?1:2;
  if(lv===7)return 2;
  return 2+(Math.random()<0.5?1:0);
}
function rollFx(lv){
  const n=rollFxCount(lv);
  const pool=FX_POOL.slice().sort(()=>Math.random()-0.5);
  return pool.slice(0,n);
}

    const have=(k==='铁料'?state.p.inv.铁料:state.p.inv[k])||0;
    const used=chosen.filter(x=>x===k).length;
    const remaining=have-used;
    const full=chosen.length>=20;
    o.push([k+'（'+desc+'）'+(k==='铁料'?'':(' ×'+remaining)), (full||remaining<=0)?()=>{ print(full?'辅料已满（20件）':'材料不够','bad'); forgeMatMenu(cat,baseMat,chosen); } : ()=>forgeMatMenu(cat,baseMat,chosen.concat([k]))]);
  }
  if(chosen.length) o.push(['撤销上一个（'+chosen[chosen.length-1]+'）',()=>forgeMatMenu(cat,baseMat,chosen.slice(0,-1))]);
  o.push(['开炉打造（辅料×'+chosen.length+'，加工费'+(5+lv*3)+'铜币）',()=>doForge(cat,baseMat,chosen)]);
  o.push(['返回',forgeMenu]);
  choices(o); statusLine();
}
function doForge(cat,baseMat,chosen){
  const lv=forgeLevel();
  const fee=5+lv*3;
  const ironExtra=chosen.filter(k=>k==='铁料').length;
  const needIron=baseMat+ironExtra;
  const counts={};
  chosen.forEach(k=>{ counts[k]=(counts[k]||0)+1; });
  if(state.p.inv.铁料<needIron){ print('铁料不够（需'+needIron+'块，现有'+state.p.inv.铁料+'）','bad'); forgeMatMenu(cat,baseMat,chosen); return; }
  for(const k of Object.keys(counts)){
    if(k==='铁料')continue;
    if((state.p.inv[k]||0)<counts[k]){ print('没有足够的'+k+'','bad'); forgeMatMenu(cat,baseMat,chosen); return; }
  }
  if(state.p.gold<fee){ print('加工费'+fee+'铜币，钱不够','bad'); forgeMatMenu(cat,baseMat,chosen); return; }
  state.p.inv.铁料-=needIron;
  for(const k of Object.keys(counts)){ if(k!=='铁料')state.p.inv[k]-=counts[k]; }
  state.p.gold-=fee;
  state.p.forge.count++;
  const newLv=forgeLevel();
  if(newLv>lv){ print('铁匠端详着打出的家伙，点了点头——他升到了 Lv.'+newLv+'！','hint'); }
  // 聚合全部辅料效果（叠加）
  const rank={劣质:0,普通:1,优良:2,稀有:3,史诗:4};
  let mul=1, minQ=null, flatAtk=0;
  const fxAll=[];
  for(const k of chosen){
    const eff=MAT_EFFECT[k]||{};
    if(eff.mul)mul*=eff.mul;
    if(eff.minQ&&(minQ===null||rank[eff.minQ]>rank[minQ]))minQ=eff.minQ;
    if(eff.flatAtk)flatAtk+=eff.flatAtk;
    if(eff.fx)for(const fx of eff.fx){ if(!fxAll.includes(fx))fxAll.push(fx); }
  }
  let w;
  if(Math.random()<0.021){
    const o=ORIENTAL[Math.floor(Math.random()*ORIENTAL.length)];
    w={name:o[0]+'（东方）',atk:Math.max(1,Math.round(o[1]*mul)+flatAtk),type:o[2],fx:['异纹'].concat(rollFx(lv).filter(f=>f!=='异纹'))};
    print('炉火里翻出一种异样的花纹……','hint');
    print('异纹：来自海外的锻法，攻击+8%','dim');
  } else {
    const branch=CAT_BRANCH[cat][Math.floor(Math.random()*CAT_BRANCH[cat].length)];
    let q=rollQuality(lv);
    if(minQ && rank[q]<rank[minQ])q=minQ;
    const atk=Math.max(1,Math.round(Math.round(CAT_BASE[cat]*Q_FACTOR[q])*mul)+flatAtk);
    w={name:branch+'·'+q,atk,type:cat,fx:rollFx(lv)};
  }
  for(const fx of fxAll){ if(!w.fx.includes(fx))w.fx.push(fx); }
  print('打好了：'+w.name+'（攻击+'+w.atk+(w.fx.length?'，词条：'+w.fx.join('/'):'')+'）','ok');
  state.p.owned.push(w);
  state.p.weapon={...w};
  print('你接过'+w.name+'，掂了掂（木剑还在包袱里——它不扔）','dim');
  forgeMatMenu(cat,baseMat,[]);
}

    const k=pair[0], desc=pair[1];
    const have=(k==='铁料'?state.p.inv.铁料:state.p.inv[k])||0;
    const used=chosen.filter(x=>x===k).length;
    const remaining=have-used;
    const full=chosen.length>=20;
    o.push([k+'（'+desc+'）'+(k==='铁料'?'':(' ×'+remaining)), (full||remaining<=0)?()=>{ print(full?'辅料已满（20件）':'材料不够','bad'); forgeArmorMatMenu(slot,chosen); } : ()=>forgeArmorMatMenu(slot,chosen.concat([k]))]);
  }
  if(chosen.length) o.push(['撤销上一个（'+chosen[chosen.length-1]+'）',()=>forgeArmorMatMenu(slot,chosen.slice(0,-1))]);
  o.push(['开炉打造（辅料×'+chosen.length+'，加工费'+(5+lv*3)+'铜币）',()=>doForgeArmor(slot,chosen)]);
  o.push(['返回',forgeArmorMenu]);
  choices(o); statusLine();
}
function doForgeArmor(slot,chosen){
  const lv=forgeLevel();
  const fee=5+lv*3;
  const mat=ARMOR_MAT_FEE[slot];
  const ironExtra=chosen.filter(k=>k==='铁料').length;
  const needIron=mat+ironExtra;
  const counts={};
  chosen.forEach(k=>{ counts[k]=(counts[k]||0)+1; });
  if(state.p.inv.铁料<needIron){ print('铁料不够（需'+needIron+'块）','bad'); forgeArmorMatMenu(slot,chosen); return; }
  for(const k of Object.keys(counts)){
    if(k==='铁料')continue;
    if((state.p.inv[k]||0)<counts[k]){ print('没有足够的'+k+'','bad'); forgeArmorMatMenu(slot,chosen); return; }
  }
  if(state.p.gold<fee){ print('加工费'+fee+'铜币，钱不够','bad'); forgeArmorMatMenu(slot,chosen); return; }
  state.p.inv.铁料-=needIron;
  for(const k of Object.keys(counts)){ if(k!=='铁料')state.p.inv[k]-=counts[k]; }
  state.p.gold-=fee;
  state.p.forge.count++;
  const newLv=forgeLevel();
  if(newLv>lv){ print('铁匠点了点头——他升到了 Lv.'+newLv+'！','hint'); }
  let pool;
  if(lv<=2)pool=ARMOR_FORGE[slot].slice(0,1);
  else if(lv<=4)pool=ARMOR_FORGE[slot].slice(0,2);
  else if(lv<=5)pool=ARMOR_FORGE[slot].slice(0,3);
  else pool=ARMOR_FORGE[slot];
  const pick=pool[Math.floor(Math.random()*pool.length)];
  let q=rollQuality(lv);
  const rank={劣质:0,普通:1,优良:2,稀有:3,史诗:4};
  let dAdd=0, minQ=null;
  for(const k of chosen){
    const eff=ARMOR_MAT_EFFECT[k]||{};
    if(eff.d)dAdd+=eff.d;
    if(eff.minQ&&(minQ===null||rank[eff.minQ]>rank[minQ]))minQ=eff.minQ;
  }
  if(minQ && rank[q]<rank[minQ])q=minQ;
  const qf={劣质:0.7,普通:1.0,优良:1.3,稀有:1.7,史诗:2.2}[q];
  const def=Math.max(0,Math.round(pick[1]*qf)+dAdd);
  // 材质由第一个放入的辅料决定（第一个是铁料则走常规材质池）
  const first=chosen[0];
  const matName=(first&&first!=='铁料'&&ARMOR_MAT_NAME[first])?ARMOR_MAT_NAME[first]:pick[0];
  const name=matName+'·'+q;
  if(first&&first!=='铁料'&&ARMOR_MAT_NAME[first]) print('材质：'+first+'——整件甲胄都浸透了它的气息','dim');
  print('打好了：'+name+'（'+slot+'·+'+def+'防'+(dAdd?'，辅料加成+'+dAdd:'')+'）','ok');
  addItem(name,1);
  if(!state.p.gear[slot]){
    state.p.gear[slot]={name,def,price:def*5};
    state.p.def+=def;
    print('你直接穿上了它+'+def+'防御','ok');
  } else {
    print('（身上有甲——去营地"穿戴护甲"换装）','dim');
  }
  forgeArmorMatMenu(slot,[]);
}

/* ---------- 连携（锚定 08-游戏系统.md：+15%/人，最多4人，原型简化链） ---------- */
const PROT_CHAIN={
 剑:['斧','盾','军刀'], 匕首:['大剑','斧'], 细剑:['大剑'], 大剑:['斧','弩','战戟'], 斧:['弩','弓'],
 弓:['长枪','军刀'], 弩:['长枪'], 长枪:['盾','锤','战戟'], 盾:['剑','细剑'], 锤:['大剑'],
 军刀:['盾','斧'], 战戟:['弓','大剑'], 骨刃:['盾','斧']
};
function weaponTypeOf(w){ return (w&&w.type)?w.type:'剑'; }
/* 每把武器的战技（锚定 12-武器技能系统.md，原型每类型一招） */
const SKILLS={
 剑:{name:'突进刺',mult:1.4,cost:12}, 匕首:{name:'连刺',mult:1.8,cost:12},
 细剑:{name:'精准刺',mult:1.5,cost:12}, 大剑:{name:'重劈',mult:1.5,cost:15},
 重剑:{name:'蓄力斩',mult:1.8,cost:18}, 焰型大剑:{name:'波浪斩',mult:1.4,cost:15,bleed:1},
 小锤:{name:'碎甲',mult:1.4,cost:12}, 斧:{name:'裂甲劈',mult:1.6,cost:14},
 重锤:{name:'山崩',mult:2.0,cost:20}, 圆形大锤:{name:'震地',mult:1.3,cost:14,stun:true},
 弓:{name:'瞄准射',mult:1.6,cost:12}, 弩:{name:'重射',mult:1.8,cost:14},
 长枪:{name:'贯穿突',mult:1.5,cost:12,pierce:0.3}, 突刺长枪:{name:'螺旋突',mult:1.8,cost:16,pierce:0.4},
 军刀:{name:'弧月斩',mult:1.5,cost:12}, 战戟:{name:'横扫',mult:1.6,cost:15,pierce:0.3},
 骨刃:{name:'裂骨击',mult:1.6,cost:13},
 盾:{name:'盾击',mult:0.9,cost:10,stun:true}, 拳头:{name:'寸劲',mult:1.2,cost:8,stun:true},
 法杖:{name:'法弹',mult:1.3,cost:10}
};
function comboChain(){
  const start=weaponTypeOf(state.p.weapon);
  const used=new Set();
  const allies=[];
  const arm=state.p.armguard?2:0;
  state.p.mercs.forEach(m=>allies.push({name:m.name,type:m.weapon,d:4+(m.tn||0)+arm}));
  if(state.p.knight)allies.push({name:'落魄骑士',type:'大剑',d:10+arm});
  if(state.p.companion)allies.push({name:state.p.companion.name,type:'剑',d:(state.p.companion.d||6)+arm});
  const seq=[];
  let cur=start, guard=0;
  while(seq.length<3 && guard++<10){
    const next=PROT_CHAIN[cur]||[];
    const a=allies.find(x=>!used.has(x.name)&&next.includes(x.type));
    if(!a)break;
    used.add(a.name); seq.push(a); cur=a.type;
  }
  return seq;
}

/* ---------- 战斗 ---------- */
function playerAtk(){
  let a=state.p.atk+(state.p.weapon?state.p.weapon.atk:0);
  if(state.p.buff.保养>0)a=Math.round(a*1.3);
  if(state.p.buff.磨石>0)a=Math.round(a*1.1);
  if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('锋利'))a=Math.round(a*1.05);
  if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('异纹'))a=Math.round(a*1.08);
  if(state.p.armguard)a=Math.round(a*1.15); // 裂纹的臂甲：武器法伤增伤+15%
  return a;
}
function hitDmg(atk,mult,def){ return Math.max(1,Math.round(atk*mult-def)); }

/* 等级与经验（锚定 22-基础数值.md：升级所需=等级×80，上限80级） */
function xpNeed(){ return (state.p.level||1)*80; }
function gainXp(n){
  if(!n)return;
  state.p.xp=(state.p.xp||0)+n;
  print('获得 '+n+' 经验','dim');
  while(state.p.xp>=xpNeed() && state.p.level<80){
    state.p.xp-=xpNeed();
    state.p.level++;
    state.p.maxHp+=10; state.p.hp=Math.min(state.p.maxHp,state.p.hp+10);
    state.p.maxMp+=5; state.p.mp=Math.min(state.p.maxMp,state.p.mp+5);
    state.p.maxSta+=5; state.p.sta=Math.min(state.p.maxSta,state.p.sta+5);
    state.p.atk+=3;
    print('你还没死经验这种东西，攒着攒着就变成了活命的本事','hint');
    print('等级提升至 '+state.p.level+'！生命+10 · 法术+5 · 体力+5 · 攻击+3','ok');
  }
}

function startCombat(en,opts){
  en.hp=Math.round(en.hp*1.6); en.maxHp=en.hp; en.atk=Math.round(en.atk*1.4);
  en.狂暴=false; en.stunned=false; en.physNoted=false; en.bleed=0; en.stolen=0;
  en.亡灵=!!{骷髅兵:1,送葬人:1,遗迹守卫者:1,掘墓人:1,腐尸:1}[en.name];
  en.骑类=!!(en.name&&en.name.indexOf('骑士')>=0);
  ctx={en,opts,cycle:0,lastDef:null,exposed:false,skillCd:0};
  hr(); print('⚔ '+en.name,'enemy'); print(en.intro,'dim');

}
function renderCombat(){
  clearActs();
  print(enemyHdr(),'enemy');
  if(ctx.exposed) print('它硬直了！腹部暴露——弱点','hint');
  if(ctx.en.bellyAlways) print('它的弱点在腹部——壳遮不住的地方','hint');
  print('你：生命 '+state.p.hp+'/'+state.p.maxHp+' · 体力 '+state.p.sta+(state.p.buff.流血>0?' · 流血'+state.p.buff.流血+'层':''));
  const o=[];
  o.push(['攻击·正面 (×0.8)',()=>playerAct('正面')]);

  const sk=SKILLS[weaponTypeOf(state.p.weapon)];

  o.push(['格挡 (减伤50%)',()=>playerAct('格挡')]);

  o.push(['道具',useItemMenu]);

}
function enemyHdr(){ return ctx.en.name+' Lv.'+(ctx.en.lv||'?')+' — 生命 '+Math.max(0,ctx.en.hp)+'/'+ctx.en.maxHp+(ctx.en.狂暴?' [狂暴]':''); }

  if(state.p.inv.烤肉>0)o.push(['烤肉 ×'+state.p.inv.烤肉+'（+20生命）',()=>{state.p.inv.烤肉--;state.p.hp=Math.min(state.p.maxHp,state.p.hp+20);print('你吃下烤肉+20生命','ok');renderCombat();}]);
  if(state.p.inv.净水袋>0)o.push(['净水袋 ×'+state.p.inv.净水袋+'（+10体力）',()=>{state.p.inv.净水袋--;state.p.sta=Math.min(state.p.maxSta,state.p.sta+10);print('你灌了几口+10体力','ok');renderCombat();}]);

function applyWeaponFx(en){
  const fx=state.p.weapon&&state.p.weapon.fx;
  if(!fx)return;
  if(fx.includes('血腥')||fx.includes('剧毒')){
    en.bleed=(en.bleed||0)+2;
    print('目标血流不止','hit');
  }
  if(fx.includes('汲血')){
    state.p.hp=Math.min(state.p.maxHp,state.p.hp+2);
    print('汲血：你回复2生命','ok');
  }
  const stunChance=(fx.includes('哀鸣')?0.15:0)+(fx.includes('尘封')?0.15:0)+(fx.includes('缠丝')?0.1:0);
  if(stunChance&&Math.random()<stunChance){
    en.stunned=true;
    print('目标被震住了！','hint');
  }
}
function playerAct(kind){
  const my=ctx, en=my.en;
  my.lastDef=kind;
  if(kind==='正面'||kind==='侧面'||kind==='腹部'||kind==='连携'||kind==='战技'){
    let dmg=0;
    if(kind==='连携'){
      const adds=comboChain();
      if(!adds.length){ renderCombat(); return; }
      state.p.sta=Math.max(0,state.p.sta-12);
      let total=playerAtk();
      const parts=['你（'+state.p.weapon.name+'）'];
      const chainBonus=(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('军令'))?0.2:0.15;
      adds.forEach((a,i)=>{ const d=Math.round(a.d*(1+chainBonus*(i+1))); total+=d; parts.push(a.name+'（'+a.type+'）'); });
      dmg=Math.max(1,Math.round(total-en.def));
      en.hp-=dmg;
      print('连携！'+parts.join(' → '),'hint');
      print(en.name+' −'+dmg+'（连携伤害，+'+(chainBonus*100)+'%/人）','hit');
      applyWeaponFx(en);
    } else if(kind==='战技'){
      const sk=SKILLS[weaponTypeOf(state.p.weapon)];
      if(!sk||ctx.skillCd||state.p.sta<sk.cost){ renderCombat(); return; }
      state.p.sta=Math.max(0,state.p.sta-sk.cost);
      ctx.skillCd=2;
      let def=en.def;
      if(sk.pierce)def=Math.round(def*(1-sk.pierce));
      dmg=hitDmg(playerAtk(),sk.mult,def);
      en.hp-=dmg;
      print('战技——'+sk.name+'！','hint');
      print(en.name+' −'+dmg,'hit');
      if(sk.bleed){ en.bleed=(en.bleed||0)+2; print('目标血流不止','hit'); }
      if(sk.stun){ en.stunned=true; print('目标被震住了！','hint'); }
      applyWeaponFx(en);
    } else {
      let mult = kind==='正面' ? (en.pos?en.pos.front:0.8)
               : kind==='侧面' ? (en.pos?en.pos.side:1.3)
               : (en.pos?en.pos.belly:2.0);
      let def=en.def;
      if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('破甲'))def=Math.round(def*0.8);
      dmg=hitDmg(playerAtk(),mult,def);
      if(state.p.sta<10){ dmg=Math.max(1,Math.round(dmg*0.6)); print('你累得发飘（体力不足，伤害-40%）','dim'); }
      if(en.physRes){
        if(!en.physNoted){ en.physNoted=true; print('它的身体对物理攻击有抗性（伤害减半）','hint'); }
        dmg=Math.round(dmg*en.physRes);
      }
      if(state.p.weapon&&state.p.weapon.mod==='硬直'&&my.exposed){ dmg=Math.round(dmg*1.1); }
      if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('噬魂')&&en.亡灵){ dmg=Math.round(dmg*1.3); print('噬魂之力在它身上灼出青烟！','hint'); }
      if(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('无魂')&&en.骑类){ dmg=Math.round(dmg*1.2); print('无魂之刃斩开骑士的架势！','hint'); }
      if(state.p.accessory&&state.p.accessory.name==='安魂十字'&&en.亡灵){ dmg=Math.round(dmg*1.1); print('安魂十字发烫——亡者畏惧','hint'); }
      en.hp-=dmg;
      state.p.sta=Math.max(0,state.p.sta-(state.p.weapon&&state.p.weapon.fx&&state.p.weapon.fx.includes('轻量')?9:10));
      print('你挥剑'+en.name+' −'+dmg+'（'+kind+'）','hit');
      applyWeaponFx(en);
    }
  } else if(kind==='格挡'){
    state.p.sta=Math.max(0,state.p.sta-5);
    print('你架起武器，护住要害');
  } else if(kind==='闪避'){
    state.p.sta=Math.max(0,state.p.sta-10);
    print('你压低重心，盯着它的动作');
  } else if(kind==='逃跑'){
    const fxs=state.p.weapon&&state.p.weapon.fx;
    const rate=0.8+(fxs&&fxs.includes('迅影')?0.1:0);
    if(Math.random()<rate){ print('你转身就跑它没有追','ok'); ctx=null; state.p.buff.流血=0; if(my.opts.onFlee)my.opts.onFlee(); return; }
    print('你转身就跑——被扑了回来！','bad'); my.lastDef=null;
  }
  if(ctx!==my) return;
  if(en.hp>0) mercTurn();
  if(ctx!==my) return;
  if(en.hp<=0){ winCombat(); return; }
  enemyTurn();
  if(ctx!==my) return;
  if(en.name==='老龙'){
    if(state.p.hp<=0){ dragonLeave(); return; }
  }
  if(state.p.hp<=0){ loseCombat(); return; }
  if(en.hp<=0){ winCombat(); return; }
  renderCombat();
}

function mercTurn(){
  const list=state.p.mercs||[];
  const arm=state.p.armguard?2:0;

function applyEnemyHit(raw,def,extra){
  if(state.p.flags.god){ print('（无敌）这一下没有打中你','def'); return true; }
  let dmg=raw;
  if(def==='格挡'){ dmg=Math.ceil(raw*0.5); print('你格挡！伤害减半','def'); }
  else if(def==='闪避'){
    const fxs=state.p.weapon&&state.p.weapon.fx;
    const rate=0.6+(fxs&&fxs.includes('灵活')?0.05:0)+(fxs&&fxs.includes('迅影')?0.1:0);
    if(Math.random()<rate){ print('你侧身闪过！','def'); return false; }
    print('闪避失败——','bad');
  }
  state.p.hp-=dmg;
  if(state.p.hp<0)state.p.hp=0;
  print(ctx.en.name+' 命中你 −'+dmg+(extra?'（'+extra+'）':''),'bad');
  return true;
}
function tickBleed(){
  if(state.p.flags.god){ state.p.buff.流血=0; return; }
  if(state.p.buff.流血>0){
    const d=2*state.p.buff.流血;
    state.p.hp=Math.max(0,state.p.hp-d);
    print('伤口流血 −'+d,'bad');
    state.p.buff.流血--;
  }
}

function kingTurn(def){
  const en=ctx.en;
  if(ctx.exposed){ ctx.exposed=false; print('猪王摇摇晃晃地回过神','dim'); return; }
  if(en.hp<en.maxHp*0.4 && !en.狂暴){

    print('猪王眼睛更红了——狂暴！攻击+30%，防御-20%','hint');
  }

  if(cyc===0){

    print('猪王后蹄刨地——冲锋！');

  } else if(cyc===1){
    const raw=en.狂暴?10:8;
    print('猪王扭头横扫！');
    const hit=applyEnemyHit(raw,def);
    if(hit){ state.p.buff.流血+=1; print('伤口被撕开（流血+1层）','bad'); }

function winCombat(){
  const en=ctx.en, op=ctx.opts;
  ctx=null; state.p.buff.流血=0;
  if(state.p.buff.保养>0)state.p.buff.保养--;
  if(state.p.buff.磨石>0)state.p.buff.磨石--;
  print(en.name+' 倒下了','ok');
  if(en.xp){ gainXp(en.xp); }
  if(en.stolen>0){ state.p.gold+=en.stolen; print('你捡回了被抢走的 '+en.stolen+' 枚铜币','ok'); }
  if(op.gold){ state.p.gold+=op.gold; print('拾取 '+op.gold+' 铜币','ok'); }
  if(op.items){ for(const k in op.items){ addItem(k,op.items[k]); print('获得 '+k+' ×'+op.items[k],'ok'); } }
  if(op.note)print(op.note,'dim');
  op.onWin();
}
function loseCombat(){
  if(state.p.companion){
    const c=state.p.companion;
    if((c.a||0)>0){
      c.a--;
      state.p.hp=5; state.p.buff.流血=0;
      print(c.name+'替你挡了这一下护甲碎了，人还站着（挡刀层数剩'+(c.a||0)+'）','bad');
    } else {
      state.p.companion=null;
      state.p.hp=5; state.p.buff.流血=0;
      print(c.name+'替你挡了这一下他重伤被救走——之后还能在酒厂重逢','bad');
    }
    if(ctx){ renderCombat(); } else { clearActs(); choices([['起身',gotoCamp]]); }
    statusLine();
    return;
  }
  if(state.p.knight){
    const k=state.p.knight;
    if((k.a||0)>0){
      k.a--;
      state.p.hp=5; state.p.buff.流血=0;
      print(k.name+'替你挡了这一击甲碎了一层，人还在（挡刀层数剩'+(k.a||0)+'）','bad');
    } else {
      state.p.knight=null;
      state.p.hp=5; state.p.buff.流血=0;
      print('落魄骑士替你挡下这一击甲碎了他倒了下去','bad');
    }
    if(ctx){ renderCombat(); } else { clearActs(); choices([['起身',gotoCamp]]); }
    statusLine();
    return;
  }
  if(state.p.mercs&&state.p.mercs.length){
    const m=state.p.mercs.shift();
    state.p.hp=5; state.p.buff.流血=0;
    print(m.name+'替你挡了这一下他倒下了你连他的全名都不知道','bad');
    if(ctx){ renderCombat(); } else { clearActs(); choices([['起身',gotoCamp]]); }
    statusLine();
    return;
  }
  ctx=null; state.p.buff.流血=0;
  clearActs(); hr();
  print('你倒下了','bad'); print('……','dim');
  print('噩梦你在营地篝火旁醒来——上次休息之后的记忆，像隔着一层水','dim');
  state.p.hp=state.p.maxHp; state.p.sta=state.p.maxSta; state.p.mp=state.p.maxMp;
  state.p.buff.硬直=0;
  choices([['起身',gotoCamp],['回最近城镇',backToTown]]);
  statusLine();
}

    if(state.p.inv[k]>0){ hasSell=true; o.push(['卖：'+k+' ×'+state.p.inv[k]+'（'+v+'铜币）',()=>sellG(k,v)]); }
  }
  if(!hasSell) o.push(['卖：——（身上没有能卖的东西）',()=>{ print('老板扫了你一眼："空着手来，空着手走？"','dim'); gotoGoods(); }]);
  o.push(['卖：旧铁片',()=>{ print('老板摇头："这是遗物的碎片，学者们要我收不起"','dim'); gotoGoods(); }]);
  o.push(['离开',backToTown]);
  scene('杂货铺','什么都有一点：绳子、火绒、草药、旧货老板什么杂物都收'+(st.items.length?'\n他今天进了点新货':''),o);
}
function buyG(k,price,back){
  const cat=CATALOG[k]||{};
  const pr=(price!=null)?price:cat.price;
  const backFn=back||gotoGoods;
  if(state.p.gold<pr){ print('钱不够','bad'); backFn(); return; }
  state.p.gold-=pr;
  if(cat.give){ for(const kk in cat.give)addItem(kk,cat.give[kk]); }
  else addItem(k,1);
  print('买下'+k+(cat.give?'（3个绷带）':'')+'','ok');
  backFn();
}
function sellG(k,v,back){
  const backFn=back||gotoGoods;
  if(!state.p.inv[k]){ print('你没有这个','dim'); backFn(); return; }
  state.p.inv[k]--; state.p.gold+=v;
  print('卖出'+k+' ×1，+'+v+'铜币','ok'); backFn();
}

/* ---------- 佣兵市场 ---------- */
function gotoMarket(){
  const roster=mercRoster();
  const o=[];
  state.p.mercs.forEach(m=>{
    o.push([m.name+' Lv.'+m.lv+'（雇佣中·每回合砍'+(4+m.tn)+'）',()=>{ print('他跟着你给钱，办事','dim'); gotoMarket(); }]);
  });
  if(state.p.mercs.length<2){
    roster.forEach((m,i)=>{
      o.push(['雇佣：'+m.name+' Lv.'+m.lv+'（'+m.weapon+'·'+m.traits.join('/')+'，每回合砍'+(4+m.tn)+'，'+m.price+'铜币）',()=>hireMerc(i)]);
    });
  } else {
    o.push(['（两个人跟着，够了）',()=>{},true]);
  }
  o.push(['离开',backToTown]);
  scene('佣兵市场','几个等着被雇的人蹲在墙根行情每天都在变'+(state.p.mercs.length<2?'\n你身后还能再站一个':''),o);
}
function hireMerc(i){
  const roster=mercRoster();
  const m=roster[i];
  if(!m){ print('那人已经走了','dim'); gotoMarket(); return; }
  if(state.p.mercs.length>=2){ print('你已经有两个跟着了','dim'); gotoMarket(); return; }
  if(state.p.gold<m.price){ print(m.price+'铜币钱不够','bad'); gotoMarket(); return; }
  state.p.gold-=m.price;
  state.p.mercs.push({name:m.name,lv:m.lv,weapon:m.weapon,traits:m.traits,tn:m.tn});
  roster.splice(i,1);
  print(m.name+'站起来，拍拍灰，站到你身后','ok');
  gotoMarket();
}

  state.p.owned.push({name,atk,mod,type,fx:isOr?['异纹']:[]});
  print('你买下'+name+'，放进了背包'+(isOr?'——异纹微亮，攻击+8%':'')+'（营地「换武器」可装备）','ok');

function buyItem(k,v){

  if(!f.dragonMet && Math.random()<0.03){
    startCombat({name:'老龙',lv:20,xp:50,hp:400,atk:18,def:8,physRes:0.5,intro:'它落下来的时候，风先到了'},{canFlee:false,items:{覆金属龙皮:2,精炼熔断钢铁:1},onWin:wanderNext});
    return;
  }
  if(f.dragonMet && Math.random()<0.012){
    startCombat({name:'赤河龙',lv:40,xp:400,hp:900,atk:30,def:12,physRes:0.6,intro:'河水红了，一条比老龙更大的龙从河里升起——赤河龙'},{canFlee:false,items:{覆金属龙皮:3,龙鳞:2,精炼熔断钢铁:1,管理者材料:1},onWin:wanderNext});

      startCombat({name:'送葬人',lv:8,xp:40,hp:38,atk:7,def:2,intro:'一个扛着铲子的人他在低吟'},{canFlee:true,items:{送葬骨灰:1},onWin:wanderNext,onFlee:wanderBack});

function rangerWin(){
  if(Math.random()<0.4)addItem('游侠短弓',1);
  wanderNext();
}
function knightWin(gear,chance){
  if(Math.random()<chance)addItem(gear,1);
  wanderNext();
}
function fallenKnight(){
  scene('野外','一个披着破甲的人坐在路边剑横在膝上\n"给八十铜币，我这条命跟你走或者，别管我"',[
  ['雇他（80铜币，每回合砍10，替你挡一次死）',()=>{
    if(state.p.gold<80){ print('钱不够','bad'); }
    else { state.p.gold-=80; state.p.knight={name:'落魄骑士',tn:10,type:'大剑'}; print('他站起来铁甲哗啦响','ok'); }
    wander2();
  }],
  ['别管他',wander2]]);
}
function wanderNext(){ print('你继续走','dim'); scene('野外','风从北边吹来',[['继续游荡',wander],['回城',gotoAshwold]]); }
function wanderBack(){ scene('野外','你绕开了继续走',[['继续游荡',wander],['回城',gotoAshwold]]); }
function wander2(){ scene('野外','采药人背起篓子走了',[['继续游荡',wander],['回城',gotoAshwold]]); }
function travellerMerchant(){
  const items=pickFrom(['草药','陈年果酒','巨魔粗制饰品','净水袋','火绒'],2);
  const o=items.map(k=>[k+'（'+Math.floor(CATALOG[k].price*0.9)+'铜币，'+CATALOG[k].desc+'）',()=>buyTrav(k)]);
  o.push(['继续赶路',gotoRoad]);
  scene('旅行商人','一辆破车，一个到处走的人货不多，价还行',o);
}
function buyTrav(k){
  const price=Math.floor(CATALOG[k].price*0.9);
  if(state.p.gold<price){ print('钱不够','bad'); travellerMerchant(); return; }
  state.p.gold-=price; addItem(k,1);
  print('你买下'+k+'','ok'); travellerMerchant();
}

/* ---------- 设置与读档 ---------- */
const FONT_SIZES={s:'13px',m:'15px',l:'17px'};
function getFont(){
  try{ const st=JSON.parse(localStorage.getItem('isolde_settings')||'{}'); return st.font||'m'; }catch(e){ return 'm'; }
}
function applyFont(){ document.documentElement.style.fontSize=FONT_SIZES[getFont()]||'15px'; }
function toggleFont(){
  const order=['s','m','l'];
  let st={};
  try{ st=JSON.parse(localStorage.getItem('isolde_settings')||'{}'); }catch(e){}
  const next=order[(order.indexOf(st.font||'m')+1)%3];
  st.font=next;
  try{ localStorage.setItem('isolde_settings',JSON.stringify(st)); }catch(e){}
  applyFont();
  sysMenu();
}
function toggleTw(){
  let st={};
  try{ st=JSON.parse(localStorage.getItem('isolde_settings')||'{}'); }catch(e){}
  twOn=!twOn;
  if(!twOn)flushTw();
  st.tw=twOn;
  try{ localStorage.setItem('isolde_settings',JSON.stringify(st)); }catch(e){}
  print('打字机效果：'+(twOn?'开':'关'),'ok');
  sysMenu();
}
function sysMenu(){
  const o=[];
  o.push(['手动存档',()=>{ saveGame(); print('已存档（第'+state.p.days+'天）','ok'); sysMenu(); }]);
  o.push(['读档（回到上次存档）',()=>{
    const s=loadGame();
    if(!s){ print('没有存档','dim'); sysMenu(); return; }
    state=s; ctx=null; twQueue.length=0; twBusy=false;
    print('读档完成（第'+state.p.days+'天）','ok');
    restoreScene(state.scene||'ashwold');
  }]);
  o.push(['导出存档（复制存档码）',exportSave]);
  o.push(['导入存档（粘贴存档码）',importSave]);
  o.push(['字体大小：'+(getFont()==='s'?'小':getFont()==='l'?'大':'中'),toggleFont]);
  o.push(['打字机效果：'+(twOn?'开':'关'),toggleTw]);
  o.push(['清空存档并重新开始',()=>{
    clearActs();
    print('确认清空存档？此操作不可撤销','bad');
    choices([['确认清空',()=>{ localStorage.removeItem(SAVE_KEY); titleScreen(); }],['取消',sysMenu]]);
  }]);
  o.push(['返回',backToTown]);
  scene('系统','设置与存档'+(state.savedDay!==undefined?'上次存档：第'+state.savedDay+'天':''),o);
}

function journeyStep(){
  const j=state.p.journey;
  j.step++;
  if(j.step>=3){
    const d=JOURNEY_DEFS[j.target];
    state.p.journey=null;
    if(d.arrive==='cromford')arriveCromford();
    else if(d.arrive==='ashwold')arriveAshwoldBack();
    else if(d.arrive==='tanwo')arriveTanwo();
    else if(d.arrive==='lienfiel')arriveLienfiel();
    else if(d.arrive==='warrin')arriveWarrin();
    else if(d.arrive==='lienfielBack')arriveLienfielBack();
    else if(d.arrive==='whitestone')arriveWhitestone();
    else if(d.arrive==='whitestoneBack')arriveWhitestoneBack();
    else if(d.arrive==='windcap')arriveWindcap();
    else if(d.arrive==='warrinBack')arriveWarrinBack();
    else arriveCromfordBack();
    return;
  }
  journeyScene(j.target);
}
function journeyScene(target){
  curScene='journey';
  const d=JOURNEY_DEFS[target];
  const j=state.p.journey;
  const o=[
  ['扎营（休息+存档，过一天）',()=>{
    state.p.days=(state.p.days||0)+1;
    state.p.hp=state.p.maxHp; state.p.sta=state.p.maxSta; state.p.mp=state.p.maxMp;
    state.p.buff.流血=0; state.p.buff.硬直=0;
    saveGame();
    print('路边扎营第'+state.p.days+'天（已存档）','ok');
    journeyStep();
  }],
  ['探索周围',()=>exploreStep(journeyStep)],
  ['地区特色：'+d.event,()=>{ if(d.eventFn==='frog')frogEvent(journeyStep); else if(d.eventFn==='fly')flyEvent(journeyStep); else if(d.eventFn==='plague')plagueEvent(journeyStep); else if(d.eventFn==='normal')normalEvent(journeyStep); else liceEvent(journeyStep); }],
  ['回头',()=>{ state.p.journey=null; print('你折了回去','dim'); if(d.back==='ashwoldRoad')gotoRoad(); else if(d.back==='tanwoRoad')gotoRoad3(); else if(d.back==='lienfielRoad')gotoRoad4(); else if(d.back==='whitestoneRoad')gotoRoad6(); else if(d.back==='warrinRoad')gotoRoad5(); else if(d.back==='windcapRoad')gotoRoad7(); else gotoRoad2(); }]
  ];
  scene(d.title,d.desc+'，第'+(j.step+1)+'/3 段',o);
}

function chainFights(arr,done){
  if(!arr.length){ done(); return; }
  const e=arr[0];
  if(e.before)e.before();
  startCombat(e.en,{canFlee:e.flee===undefined?true:e.flee,items:e.items,gold:e.gold,
   onWin:()=>{ if(e.after)e.after(); chainFights(arr.slice(1),done); },
   onFlee:()=>{ print('你从混战中脱身','dim'); done(); }});
}

function huntCheck(back){
  const f=state.p.flags;
  const act=HUNT_LIST.filter(h=>f[h.flag]&&!f[h.done]);
  if(!act.length)return false;
  if(Math.random()>0.25)return false;
  const h=act[Math.floor(Math.random()*act.length)];
  scene('寻踪·'+h.name,h.desc, [['进去',h.fight],['改天再来',back]]);
  return true;
}

/* ---------- 龙巢深处·无限下潜（肉鸽） ---------- */
function lairEndlessPool(floor){
  const low=[['龙蜥',12,64,12,4],['海狼',8,40,9,1],['盐鬼',11,58,10,2],['海盗',7,38,9,2]];
  const mid=[['巢穴之主',18,140,15,7],['教团护教骑士',12,66,12,5],['黑甲骑士',13,80,13,8],['渡口水鬼',8,38,8,1]];
  const high=[['血池甲士',10,60,11,5],['巡防队长',15,90,14,7],['疫岸野骑士',14,80,13,6],['灰衣指挥官',13,75,13,6]];
  const pool=floor>=30?high.concat(mid).concat(low):floor>=10?mid.concat(low):low;
  return pool[Math.floor(Math.random()*pool.length)];
}
function lairMobStats(floor){
  const m=lairEndlessPool(floor);
  const mul=1+0.12*(floor-1);
  return {name:m[0],lv:Math.max(1,Math.round(m[1]+floor*0.5)),xp:Math.round(m[1]*4*(1+floor*0.1)),hp:Math.round(m[2]*mul),atk:Math.round(m[3]*(1+0.08*(floor-1))),def:m[4],intro:'第'+floor+'层的'+m[0]+'，被深处的鲸泉滋养得格外强壮'};
}
function whaleDragonStats(floor){
  const tier=Math.floor(floor/10);
  return {name:'巨鲸之泉龙',lv:10+tier*8,xp:tier*120,hp:Math.round(280*(1+0.25*(tier-1))),atk:16+tier*3,def:6+Math.round(tier*1.5),physRes:0.5,intro:'第'+floor+'层——巨鲸之泉的龙，每一片鳞都浸过鲸泉'};
}
function gotoLairEndless(){
  const f=state.p.flags;
  if(!f.lairUnlocked&&!f.lairReward&&!f.lairDone){ print('你还没探过龙巢的底，洞口不肯放你下去','dim'); gotoBoard7(); return; }
  if(!state.p.lairFloor||state.p.lairFloor<1)state.p.lairFloor=1;
  const floor=state.p.lairFloor;
  if(floor%10===0){
    print('第'+floor+'层——洞壁在发亮，鲸泉的气息浓得能喝','hint');
    chainFights([
      {en:lairMobStats(floor),flee:false,after:()=>print('第一只倒下了，第二只从泉水里爬出来','dim')},
      {en:lairMobStats(floor),flee:false,after:()=>print('泉眼翻涌——龙来了','hint')},
      {en:whaleDragonStats(floor),flee:false}
    ],()=>lairFloorWin(floor,true));
  } else {
    startCombat(lairMobStats(floor),{canFlee:false,
     onWin:()=>lairFloorWin(floor,false)});
  }
}
function lairFloorWin(floor,isBoss){
  const p=state.p, f=state.p.flags;
  p.lairFloor=floor+1;
  if(floor>f.lairBest)f.lairBest=floor;
  const gold=2+floor*2;
  p.gold+=gold;
  print('第'+floor+'层清空：+'+gold+'铜币','ok');
  gainXp(15+floor*4);
  if(isBoss){
    const tier=Math.floor(floor/10);
    addItem('龙鳞',1+tier);
    if(floor>=20 && Math.random()<0.5)addItem('精炼熔断钢铁',1);
    print('巨鲸之泉龙倒下，泉水把鳞片冲到了你脚边','hint');
  } else {
    if(Math.random()<0.35)addItem('海鱼',1+Math.floor(Math.random()*2));
    else if(Math.random()<0.3)addItem('兽皮',1);
    else if(floor>=10 && Math.random()<0.25)addItem('龙鳞',1);
  }
  // 50层特殊奖励：裂纹的臂甲（不可替换）
  if(floor===50 && !f.armguardGot){
    f.armguardGot=true;
    p.armguard={name:'裂纹的臂甲'};
    p.maxHp+=50; p.hp=Math.min(p.maxHp,p.hp+50);
    hr();
    print('泉水中央浮起一具臂甲——阿喀琉斯的左臂甲，已经裂了','hint');
    print('裂纹的臂甲：不可替换，武器获得法伤增伤+15%，全体队友伤害+2，生命上限+50','ok');
    print('它贴在你的左臂上，再也摘不下来','dim');
  }
  statusLine();
  scene('龙巢深处·第'+floor+'层','要再往下吗？更深处的奖励更厚，更深处的龙更饿',[
  ['继续下潜（第 '+(floor+1)+' 层）',gotoLairEndless],
  ['返回地面',()=>{ print('你顺着来路爬回地面，这次到了第'+floor+'层','dim'); state.p.lairFloor=1; gotoBoard7(); }]
  ]);
}

    else startCombat({name:'龙蜥',lv:12,xp:70,hp:64,atk:12,def:4,intro:'一条龙蜥趴在崖壁上，眼睛像两点火'},{canFlee:true,items:{龙鳞:1},onWin:wanderWindcapNext,onFlee:wanderWindcapBack});

    }
    return;
  }
  if(roll<0.85){
    scene('风角港郊野','一个赶海的老妇人，篓子里有刚捡的海货',[
    ['买：烤鱼（4铜币）',()=>{ if(state.p.gold<4){ print('钱不够','bad'); } else { state.p.gold-=4; addItem('烤鱼',1); print('买下烤鱼×1','ok'); } wanderWindcapNext(); }],
    ['继续赶路',wanderWindcapNext]]);
    return;
  }
  if(roll<0.93){

function runCmd(s){
  s=(s||'').trim();
  if(!s)return;
  const t=s.split(/\s+/);
  const c=t[0].toLowerCase();
  if(c.charAt(0)==='/' && !state){ print('还没有存档先开始新的旅程吧','bad'); return; }
  if(c==='帮助'||c==='help')showHelp();
  else if((c==='状态'||c==='背包')&&!state){ print('还没有存档先开始新的旅程吧','bad'); return; }
  else if(c==='状态')showStatusPanel();
  else if(c==='背包')showInvPanel();
  else if(c==='看')print(lastDesc||'……','dim');
  else if(c==='/dev'||c==='/help')devHelp();
  else if(c==='/钱'||c==='/gold'){ const n=parseInt(t[1])||0; state.p.gold=Math.max(0,state.p.gold+n); print('金币 +'+n+'（现 '+state.p.gold+'）','ok'); statusLine(); }
  else if(c==='/级'||c==='/level'){
    let n=parseInt(t[1])||1; n=Math.max(1,Math.min(80,n));
    state.p.level=n; state.p.xp=0;
    state.p.maxHp=110+10*(n-1)+(state.p.armguard?50:0); state.p.maxMp=50+5*(n-1); state.p.maxSta=100+5*(n-1); state.p.atk=12+3*(n-1);
    state.p.hp=state.p.maxHp; state.p.mp=state.p.maxMp; state.p.sta=state.p.maxSta;
    print('等级设为 '+n+'，属性已按成长曲线重算','ok'); statusLine();
  }
  else if(c==='/xp'){ const n=parseInt(t[1])||0; gainXp(n); statusLine(); }
  else if(c==='/item'){ const k=t[1], n=parseInt(t[2])||1; if(k){ addItem(k,n); print('获得 '+k+' ×'+n,'ok'); } else print('用法：/item 名称 数量','dim'); }
  else if(c==='/heal'){ state.p.hp=state.p.maxHp; state.p.sta=state.p.maxSta; state.p.mp=state.p.maxMp; state.p.buff.流血=0; print('回满了','ok'); statusLine(); }
  else if(c==='/god'){ state.p.flags.god=!state.p.flags.god; print(state.p.flags.god?'无敌开启':'无敌关闭','hint'); }
  else if(c==='/kill'){ if(ctx){ ctx.en.hp=0; print('（开发者）目标被抹除','hint'); winCombat(); } else print('当前没有战斗','dim'); }
  else if(c==='/天'||c==='/day'){ const n=parseInt(t[1]); if(!isNaN(n)&&n>=0){ state.p.days=n; print('天数设为 '+n+'','ok'); statusLine(); } }
  else if(c==='/通缉'){ state.p.flags.通缉=!state.p.flags.通缉; print(state.p.flags.通缉?'你被通缉了':'通缉撤销','hint'); statusLine(); }
  else if(c==='/清人'){ state.p.mercs=[]; state.p.knight=null; print('（开发者）随从已清空','hint'); statusLine(); }
  else if(c==='/克'){ state.p.journey=null; gotoCromford(); }
  else if(c==='/坦'){ state.p.journey=null; gotoTanwo(); }
  else if(c==='/利'){ state.p.journey=null; gotoLienfiel(); }
  else if(c==='/沃'){ state.p.journey=null; gotoWarrin(); }
  else if(c==='/白'){ state.p.journey=null; gotoWhitestone(); }
  else if(c==='/风'){ state.p.journey=null; gotoWindcap(); }
  else if(c==='/龙'){ state.p.flags.dragonMet=false; startCombat({name:'老龙',lv:20,xp:50,hp:400,atk:18,def:8,physRes:0.5,intro:'它落下来的时候，风先到了'},{canFlee:false,items:{覆金属龙皮:2,精炼熔断钢铁:1},onWin:()=>{ scene('野外','它倒下了，这不是它该有的结局',[['继续走',backToTown]]); }}); }
  else if(c==='/赤龙'){ startCombat({name:'赤河龙',lv:40,xp:400,hp:900,atk:30,def:12,physRes:0.6,intro:'河水红了，赤河龙从河里升起'},{canFlee:false,items:{覆金属龙皮:3,龙鳞:2,精炼熔断钢铁:1,管理者材料:1},onWin:()=>{ scene('河滩','它沉回了河里，河水慢慢变清',[['继续走',backToTown]]); }}); }
  else if(c==='敌情'){ if(ctx){ print('敌情：'+ctx.en.name+' Lv.'+(ctx.en.lv||'?')+' · 生命 '+Math.max(0,ctx.en.hp)+'/'+ctx.en.maxHp+' · 攻击'+ctx.en.atk+' · 防御'+ctx.en.def+(ctx.en.狂暴?' · 狂暴':'')+(ctx.en.stunned?' · 被震住':'')+(ctx.en.bleed?' · 流血'+ctx.en.bleed:'')+(ctx.exposed?' · 腹部暴露':'')); } else print('当前没有战斗','dim'); }
  else if(c==='/reset'||c==='/重置'){ state=newGame(); riverScene(); }
  else print('听不懂（试试：看 / 状态 / 背包 / 帮助 / /dev）','dim');

  print('  /克 —— 直接跳转到克罗姆福德','dim');
  print('  /坦 —— 直接跳转到坦沃','dim');
  print('  /利 —— 直接跳转到利恩菲尔','dim');
  print('  /沃 —— 直接跳转到沃林','dim');
  print('  /白 —— 直接跳转到白石镇','dim');
  print('  /风 —— 直接跳转到风角港','dim');
  print('  /龙 —— 触发老龙遭遇（拼尽全力的一战）','dim');
  print('  /赤龙 —— 触发40级赤河龙（可击杀）','dim');
  print('  /reset —— 重新开始','dim');
}
cmd.addEventListener('keydown',e=>{ if(e.key==='Enter'){ runCmd(cmd.value); cmd.value=''; } });

/* ---------- 启动 ---------- */
applyFont();
titleScreen();
</script>
